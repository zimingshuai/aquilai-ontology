rule_types:
- code: rule_daf5b7c7
  name: 标准用量
  ruleType: calculation
  mode: single
  description: 标准用量 = BOM 行用量 ÷ BOM 基准数量；用量比较须在单位和基准数量一致后进行（§4.2 核心判断规则）
  ruleConfig:
    expression: '[BOM行.BOM行用量] / [BOM行.BOM基准数量]'
  outputEntityCode: BomLine
  outputPropertyCode: standard_usage
  outputPropertyName: 标准用量
  initializationStrategy: full_recompute
- code: rule_1559efe0
  name: 订单未收货量
  ruleType: calculation
  mode: single
  description: 订单未收货量 = max(订单数量 − 累计有效收货量 − 已取消量 − 已关闭未收余量, 0)；订单收货转为库存后不再按原未收货数量重复计入（§4.3 ③）
  ruleConfig:
    expression: MAX([采购订单.订单数量] - [采购订单.累计有效收货量] - [采购订单.已取消量] - [采购订单.已关闭未收余量], 0)
  outputEntityCode: PurchaseOrder
  outputPropertyCode: unreceived_qty
  outputPropertyName: 订单未收货量
  initializationStrategy: full_recompute
- code: rule_2519a26b
  name: 剩余新料需求
  ruleType: calculation
  mode: single
  description: 剩余新料需求 = 物料毛需求 − 替代满足量（主案例 Z9：20,000−6,000=14,000，加 Z9S 共 24,000）（§4.3 ④）
  ruleConfig:
    expression: '[物料需求汇总.物料毛需求] - [物料需求汇总.替代满足量]'
  outputEntityCode: MaterialRequirement
  outputPropertyCode: remaining_material_qty
  outputPropertyName: 剩余新料需求
  initializationStrategy: full_recompute
- code: rule_84ef6f3b
  name: 新料缺口
  ruleType: calculation
  mode: single
  description: 新料缺口 = max(剩余新料需求 − 已分配新料供给, 0)（24,000−15,000=9,000）；不得因授权增加而新增供给（§4.3 ④+§11.8 测试四）
  ruleConfig:
    expression: MAX([物料需求汇总.剩余新料需求] - [物料需求汇总.已分配供给量], 0)
  outputEntityCode: MaterialRequirement
  outputPropertyCode: physical_gap_qty
  outputPropertyName: 物理缺口
  initializationStrategy: full_recompute
- code: rule_27e9ab4b
  name: 待授权数量
  ruleType: calculation
  mode: single
  description: 待授权数量 = max(毛需求 − 已授权覆盖量, 0)（测试四：18,000−10,000=8,000；授权 v2 生效后 18,000−12,000=6,000）；授权单独核算、不作为物理供给（§4.3 步骤6）
  ruleConfig:
    expression: MAX([物料需求汇总.物料毛需求] - [物料需求汇总.已授权覆盖量], 0)
  outputEntityCode: MaterialRequirement
  outputPropertyCode: pending_auth_qty
  outputPropertyName: 待授权数量
  initializationStrategy: full_recompute
- code: rule_3b05540c
  name: 待授权参考金额
  ruleType: calculation
  mode: single
  description: 待授权参考金额 = 待授权数量 × 参考单价（8,000×20=160,000 元）；供内部审核，不自动生成采购订单（§11.8 测试四+§2.1 场景24）
  ruleConfig:
    expression: '[物料需求汇总.待授权数量] * [物料需求汇总.参考单价]'
  outputEntityCode: MaterialRequirement
  outputPropertyCode: pending_auth_amount
  outputPropertyName: 待授权参考金额
  initializationStrategy: full_recompute
- code: rule_53b6f12b
  name: 本期期末量
  ruleType: calculation
  mode: single
  description: 本期期末量 = 期初量 + 本期有效到货 + 其他有效流入 − 实际满足需求量 − 其他有效流出；初始库存只计入一次（§4.4 ①）
  ruleConfig:
    expression: '[分期供需.本期期初量] + [分期供需.本期有效到货] + [分期供需.其他有效流入] - [分期供需.实际满足需求量] - [分期供需.其他有效流出]'
  outputEntityCode: PeriodSupplyBalance
  outputPropertyCode: ending_qty
  outputPropertyName: 本期期末量
  initializationStrategy: full_recompute
- code: rule_981b585b
  name: 本期未满足需求
  ruleType: calculation
  mode: single
  description: 本期未满足需求 = 本期应满足需求 − 实际满足需求量；保留为逾期需求，后续结转不得重复累计（11 月 9,000 与 12 月底 7,800 分别展示）（§4.4 ①+§5.3.3）
  ruleConfig:
    expression: '[分期供需.本期应满足需求] - [分期供需.实际满足需求量]'
  outputEntityCode: PeriodSupplyBalance
  outputPropertyCode: unmet_demand_qty
  outputPropertyName: 本期未满足需求
  initializationStrategy: full_recompute
- code: rule_4095926c
  name: 期末风险量
  ruleType: calculation
  mode: single
  description: 风险量 = max(评估期末剩余量 − 经确认的保留量 − 经证实的期后消耗量, 0)；保留量与期后消耗量不得重复覆盖同一用途（§4.4 ②）
  ruleConfig:
    expression: MAX([呆滞风险.评估期末剩余量] - [呆滞风险.经确认的保留量] - [呆滞风险.经证实的期后消耗量], 0)
  outputEntityCode: SlowMovingRisk
  outputPropertyCode: risk_qty
  outputPropertyName: 期末风险量
  initializationStrategy: full_recompute
- code: rule_10dc02e7
  name: 呆滞风险金额
  ruleType: calculation
  mode: single
  description: 风险金额 = Σ(风险数量 × 对应成本单价)；不等于减值损失或实际收益，敞口≠损失（§4.4 ④+§8 红线）
  ruleConfig:
    expression: '[呆滞风险.期末风险量] * [呆滞风险.成本单价]'
  outputEntityCode: SlowMovingRisk
  outputPropertyCode: risk_amount
  outputPropertyName: 风险金额
  initializationStrategy: full_recompute
- code: rule_df2501cf
  name: 方案合计敞口
  ruleType: calculation
  mode: single
  description: 合计敞口 = 窗口内风险金额 + 窗口后未消化承诺（S2：24,000+64,000=88,000，不能宣称消除了 64,000 风险）；延期只是把旧料移出评估窗口（§11.7）
  ruleConfig:
    expression: '[处理方案.窗口内风险金额] + [处理方案.窗口后未消化承诺]'
  outputEntityCode: SolutionPlan
  outputPropertyCode: total_exposure_amount
  outputPropertyName: 合计敞口金额
  initializationStrategy: full_recompute
- code: rule_cb30677c
  name: 模拟可减少风险量
  ruleType: calculation
  mode: single
  description: 模拟可减少风险量 = max(不干预风险量 − 干预后风险量, 0)（8,000−2,000=6,000）；表示条件成立时可减少的量，不等同已实现收益（§4.5 ③）
  ruleConfig:
    expression: MAX([处理方案.不干预风险量] - [处理方案.干预后风险量], 0)
  outputEntityCode: SolutionPlan
  outputPropertyCode: reducible_qty
  outputPropertyName: 模拟可减少风险量
  initializationStrategy: full_recompute
- code: rule_84a8f4f9
  name: 未归因数量
  ruleType: calculation
  mode: single
  description: 未归因数量 = max(呆滞总量 − Σ各原因归因数量, 0)；各主要原因对应数量之和 ≤ 案例呆滞总量，无法确认的部分保留为未归因、不强行凑足总量（§4.5 ④+§8 防重复归因红线）
  ruleConfig:
    expression: MAX([历史呆滞案例.呆滞总量] - COALESCE(SUM([原因归因.归因数量]), 0), 0)
  outputEntityCode: HistoricalCase
  outputPropertyCode: unattributed_qty
  outputPropertyName: 未归因数量
  initializationStrategy: full_recompute
