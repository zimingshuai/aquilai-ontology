format: studio-model
object_types:
- code: Project
  name: 项目
  description: 机型/产品线，需求和 BOM 的挂载主体（如 P-Z9/Z9、P-Z10 仅风险 BOM、P-X8 历史停产）
  enabled: true
  attrs:
  - code: project_id
    name: 项目ID
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 项目唯一编号（如 P-Z9）
    isDerived: false
  - code: project_code
    name: 项目编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 系统编码（如 100-Z9001）
    isDerived: false
  - code: model_name
    name: 机型
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 机型名称（如 Z9/Z9S/Z10/X8）
    isDerived: false
  - code: stage
    name: 项目阶段
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 量产 MP=量产；NPI-DVT=新品验证；EOL=停产（历史）
    isDerived: false
  - code: bom_status_desc
    name: BOM状态说明
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 该项目当前 BOM 版本状态快照描述（如 标准 v3.2；换料后主板 v2.2）
    isDerived: false
  - code: purpose_desc
    name: 用途说明
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 主线/补充测试/历史案例包等，历史案例包不与当前混算
    isDerived: false
- code: Material
  name: 物料
  description: 最小跟踪单位（WiFi 模组、SoC 等），用于汇总与库存跟踪
  enabled: true
  attrs:
  - code: material_code
    name: 物料编码
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 物料唯一编码（如 300-W6A01、H-WIFI-OLD、UNIT-M）
    isDerived: false
  - code: material_name
    name: 物料名称
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 如 WiFi5/WiFi6/SoC
    isDerived: false
  - code: base_uom
    name: 基本单位
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 物料基本计量单位（颗/盒）
    isDerived: false
  - code: unit_cost
    name: 演示成本单价
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 固定演示成本（WiFi5 16 元/颗、WiFi6 20 元/颗），与供应商报价区间分别记录，不代表真实报价
    isDerived: false
- code: UnitConversion
  name: 单位换算
  description: 已批准的计量单位换算关系（如 1盒=100颗）；移除换算依据后提示缺证，不得将 12 盒当作 12 颗
  enabled: true
  attrs:
  - code: conversion_id
    name: 换算关系ID
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 换算关系唯一编号
    isDerived: false
  - code: material_id
    name: 物料编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 换算适用的物料
    isDerived: false
  - code: from_uom
    name: 源单位
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 被换算单位（如 盒）
    isDerived: false
  - code: to_uom
    name: 目标单位
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 换算目标单位（如 颗，即基本单位）
    isDerived: false
  - code: ratio
    name: 换算比率
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 1 源单位 = ratio 目标单位（1盒=100颗）
    isDerived: false
  - code: approval_status
    name: 批准状态
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 换算关系须为已批准才可参与计算
    isDerived: false
  - code: evidence_status
    name: 证据状态
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: complete=证据齐全；missing=换算依据被移除，缺证提示、不按零处理
    isDerived: false
- code: Supplier
  name: 供应商
  description: 物料供应商（参考清单的整理维度；参考清单不等于采购订单，默认不外发）
  enabled: true
  attrs:
  - code: supplier_id
    name: 供应商编码
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 供应商唯一编码（如 V-WLINK）
    isDerived: false
  - code: supplier_name
    name: 供应商名称
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 供应商名称
    isDerived: false
  - code: purchasing_group
    name: 采购组
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 采购组编码（如 206）
    isDerived: false
- code: BomLine
  name: BOM行
  description: 机型结构清单行（标准/风险/维修 BOM），含版本、层级用量、损耗与生效日期；标准 BOM 与风险 BOM 分开比较，新旧替代料行不得在同一有效 BOM 中同时作为必需组件相加
  enabled: true
  attrs:
  - code: line_id
    name: BOM行ID
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 行唯一编号（如 L-Z9-01、H-BOM-OLD-R1）
    isDerived: false
  - code: bom_type
    name: BOM类型
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: standard=标准 BOM；risk=风险 BOM（NPI 预批）；maintenance=维修 BOM（售后）
    isDerived: false
  - code: version
    name: BOM版本
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 所属 BOM 版本（如 整机 v3.2、主板 v2.2、风险 v0.9）
    isDerived: false
  - code: parent_material_id
    name: 父项物料编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 父项物料（如 100-Z9001 整机、200-Z9PCB 主板）；不进 links（双链取舍见 assumptions A7）
    isDerived: false
  - code: material_id
    name: 子项物料编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: BOM 行的子项物料（如 300-W6A01 WiFi6），links 主关联；父项引用以属性承载
    isDerived: false
  - code: project_id
    name: 所属项目ID
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 行所属项目（由项目表"BOM 状态"关联推断，附录行表未单列）
    isDerived: false
  - code: qty_per
    name: BOM行用量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 该行子项用量原始值，单位一致后参与计算
    isDerived: false
  - code: base_qty
    name: BOM基准数量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 行用量对应的父项基准数量（如 1/1）
    isDerived: false
  - code: yield_rate
    name: 良率
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 该层良率，仅明确适用的层级计入；没有损耗的层级取 1（主案例良率均设 1，多层损耗见测试五）
    isDerived: false
  - code: effective_from
    name: 生效开始日期
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 行生效起始日期（如 2026-11-01 起）
    isDerived: false
  - code: effective_to
    name: 生效截止日期
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 行生效截止日期（旧 WiFi 行至 2026-10-31，V1 更新后的有效期）
    isDerived: false
  - code: known_at
    name: known_at（可见数据版本）
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 记录可见时间，取值为数据版本号（V0/V1/V0之前）；版本机制见 DataVersion
    isDerived: false
  - code: evidence_status
    name: 证据状态
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: complete=明细齐全；missing=缺证版本移除行明细后标记缺失，依赖它的推导同步不可验证
    isDerived: false
  - code: standard_usage
    name: 标准用量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 标准 = BOM 行用量 ÷ BOM 基准数量（derived）
    isDerived: true
- code: EcnRecord
  name: 工程变更记录
  description: 工程变更（ECN）记录（如 Z9 换料 ECN：WiFi5 退出、WiFi6 引入、11-01 生效）；缺证版本保留引用编号但批准文件与变更后 BOM 明细标记缺失
  enabled: true
  attrs:
  - code: ecn_id
    name: 工程变更ID
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 变更唯一编号（历史案例如 H-ECN-01；主案例编号文档未给出，见 OQ-10）
    isDerived: false
  - code: project_id
    name: 所属项目ID
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 变更所属项目
    isDerived: false
  - code: change_desc
    name: 变更内容
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 变更描述（换料：WiFi5 退出、WiFi6 引入）
    isDerived: false
  - code: publish_date
    name: 发布日期
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 变更发布日期（V1=2026-09-29）
    isDerived: false
  - code: effective_date
    name: 生效日期
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 变更生效日期（2026-11-01）
    isDerived: false
  - code: approval_status
    name: 批准状态
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: approved=已批准；pending=待批准
    isDerived: false
  - code: evidence_status
    name: 证据状态
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: complete=批准文件与变更后 BOM 明细齐全；missing=引用编号保留但批准文件缺失，依赖推导不可验证
    isDerived: false
  - code: known_at
    name: known_at（可见数据版本）
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 记录可见数据版本（如 V1）
    isDerived: false
- code: Demand
  name: 需求
  description: 各项目需要数量与日期（订单/MPS/预测/售后维修），覆盖关系明确；同 ID 新版本替换旧版本、不追加计数
  enabled: true
  attrs:
  - code: demand_id
    name: 需求ID
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 需求唯一编号（如 DEM-Z9-NOV、ORD-Z9-NOV、FCST-Z9-NOV）
    isDerived: false
  - code: demand_version
    name: 需求版本
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 同一需求的版本（v1/v2），v2 替换 v1 而非追加；与 demand_id 构成复合主键
    isDerived: false
  - code: project_id
    name: 项目ID
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 需求归属项目
    isDerived: false
  - code: need_date
    name: 需要日期
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 物料需要可用的日期（非客户交货日期，如 2026-11-30）
    isDerived: false
  - code: demand_qty
    name: 需求数量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 需求数量（台/件）
    isDerived: false
  - code: source_type
    name: 需求来源
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: MPS=已确认生产计划；order=客户订单；forecast=早期预测；service=售后维修需求
    isDerived: false
  - code: covered_by_demand_id
    name: 被覆盖于需求ID
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 覆盖关系：本需求已包含于哪条需求（ORD-Z9-NOV covered_by=DEM-Z9-NOV）；无覆盖依据时不得仅凭来源优先级舍弃；以属性承载、不建 links（复合主键目标，见 assumptions A7 与 OQ-03）
    isDerived: false
  - code: status
    name: 需求状态
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: confirmed=已确认参与计算；superseded=已被新版本替换；reference=仅作参考（被替换的早期预测）
    isDerived: false
  - code: known_at
    name: known_at（可见数据版本）
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 记录可见数据版本（V0/V3）
    isDerived: false
  - code: package_id
    name: 所属数据包ID
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 所属数据包（主案例/历史案例/补充测试互不混算）
    isDerived: false
- code: MaterialAuthorization
  name: 物料授权
  description: 整机料号维度的供应商备料授权（对应卫国策备表口径）；授权仅是审批覆盖口径，不构成物理供给，不得因授权增加而新增供给；新版本替换旧版本
  enabled: true
  attrs:
  - code: auth_id
    name: 授权ID
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 授权记录唯一编号
    isDerived: false
  - code: auth_version
    name: 授权版本
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 授权版本（v1/v2），v2 覆盖并替换 v1；与 auth_id 构成复合主键
    isDerived: false
  - code: material_id
    name: 物料编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 被授权物料
    isDerived: false
  - code: project_id
    name: 授权对象项目ID
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 授权覆盖的整机项目/产品
    isDerived: false
  - code: covered_qty
    name: 授权覆盖量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 授权覆盖的数量（如 v1 覆盖 10
    isDerived: false
  - code: approval_status
    name: 批准状态
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: approved=已批准（10月1日批准）；pending=待批准
    isDerived: false
  - code: effective_from
    name: 生效开始日期
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 授权生效起始日期
    isDerived: false
  - code: known_at
    name: known_at（可见数据版本）
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 记录可见数据版本
    isDerived: false
  - code: package_id
    name: 所属数据包ID
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 所属数据包
    isDerived: false
- code: Supply
  name: 供给记录
  description: 物理供给条目（可用库存/质检冻结库存/已确认未收货订单/模拟采购）；质检冻结不参与供给单列待核查；模拟供给只存在于 SIM 情景、不得写入 FACT
  enabled: true
  attrs:
  - code: supply_id
    name: 供给ID
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 供给唯一编号（PS-1001/SIM-W6-9000/ST-R1）
    isDerived: false
  - code: material_id
    name: 物料编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 供给物料
    isDerived: false
  - code: supply_type
    name: 供给类型
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: available_stock=可用库存；frozen_stock=质检冻结库存；open_order=已确认未收货订单；simulated_purchase=模拟采购（仅 SIM）
    isDerived: false
  - code: qty
    name: 供给数量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 供给数量（颗）
    isDerived: false
  - code: available_date
    name: 可用或到货日
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 供给可用/确认到货日期；库存类取数据版本可见日（V0 映射见 assumptions A1）；未确定时缺省并由 evidence 语义约束
    isDerived: false
  - code: restriction_desc
    name: 限制说明
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 使用限制（如 仅按 A.4 临时许可使用/未获放行不参与供给/不能满足 11 月）
    isDerived: false
  - code: po_id
    name: 关联订单号
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 订单类供给指向的采购订单（库存类为空）
    isDerived: false
  - code: scenario_tag
    name: 情景标签
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: FACT=事实记录；SIM=模拟记录；事实与模拟分别保存，模拟供给不得写入 FACT
    isDerived: false
  - code: package_id
    name: 所属数据包ID
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 所属数据包（主案例/历史/测试包独立）
    isDerived: false
  - code: known_at
    name: known_at（可见数据版本）
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 记录可见数据版本（六条供给均在 V0 可见）
    isDerived: false
  - code: exclude_reason
    name: 排除原因
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 不参与供给分配的原因（质检冻结：未获放行，单列待核查，不认定零风险或全额损失）
    isDerived: false
- code: PurchaseOrder
  name: 采购订单
  description: 采购订单承诺与取消/延期条款（未到货供给的订单侧）；取消权限、数量上限及延期条件须为已有书面模拟证据，不能在计算出结果后临时补设
  enabled: true
  attrs:
  - code: po_id
    name: 订单号
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 订单唯一编号（PO-R1；PS-3002 对应订单）
    isDerived: false
  - code: material_id
    name: 物料编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 订单物料
    isDerived: false
  - code: order_qty
    name: 订单数量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 订单总量（如 8
    isDerived: false
  - code: cumulative_receipt_qty
    name: 累计有效收货量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 累计有效收货数量；明确为 0 与未导入不同（assumptions A4）
    isDerived: false
  - code: cancelled_qty
    name: 已取消量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 已执行取消的数量
    isDerived: false
  - code: closed_unreceived_qty
    name: 已关闭未收余量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 已关闭订单的未收余量（收货转库存后不再按原未收货数量重复计入）
    isDerived: false
  - code: confirmed_arrival_date
    name: 确认到货日
    type: date
    required: false
    isKey: false
    defaultValue: ''
