items:
  - id: X-001
    dimension: D1
    kind: scope
    statement: "本期范围覆盖一车间全部动设备的日常巡检，不含静态点检与润滑保养"
    basis: stated
    must_ask: true
    status: proposed
    rationale: "范围口径来自会议纪要摘录，待张主管当面确认是否包含备用设备"
    source: "口述探索 2026-11-20 张主管"
  - id: X-002
    dimension: D1
    kind: scope
    statement: "巡检按班组排班，每个班次巡检一次"
    basis: inferred
    must_ask: true
    status: confirmed
    rationale: "按班次巡检是制造现场的通行做法，与排班表一致便于考核"
    resolution: "2026-11-20 张主管：确认按班次巡检"
    source: "AI 建议 2026-11-20"
  - id: X-003
    dimension: D2
    kind: object
    statement: "巡检任务是巡检业务的主体对象，一条任务对应一个班次的一次巡检"
    basis: stated
    must_ask: true
    status: confirmed
    source: "口述探索 2026-11-20 张主管"
  - id: X-004
    dimension: D2
    kind: object
    statement: "巡检项是任务下的检查条目，按设备类型预置"
    basis: stated
    must_ask: true
    status: confirmed
    source: "资料：巡检标准作业指导书#3.2"
  - id: X-005
    dimension: D2
    kind: relation
    statement: "一个巡检任务包含多个巡检项"
    basis: stated
    must_ask: true
    status: confirmed
    source: "口述探索 2026-11-20 张主管"
    refs: ["X-003", "X-004"]
  - id: X-006
    dimension: D2
    kind: object
    statement: "设备台账沿用设备主数据，不新建对象"
    basis: inferred
    must_ask: false
    status: confirmed
    rationale: "设备主数据已由设备科维护，重复建模会造成双源头"
    resolution: "2026-11-20 张主管：确认沿用设备主数据"
    source: "AI 建议 2026-11-20"
  - id: X-007
    dimension: D2
    kind: object
    statement: "异常记录独立成对象，不并入巡检项"
    basis: stated
    must_ask: false
    status: proposed
    question: "异常记录是否需要独立跟踪到闭环？"
    rationale: "资料提到异常要登记并跟踪处理进度，独立对象才能承载闭环状态"
    source: "资料：异常处理规定#2.1"
  - id: X-008
    dimension: D2
    kind: property
    statement: "异常记录的「更换备件数量」以「件」为计量单位，只填非负整数"
    basis: inferred
    must_ask: false
    status: proposed
    question: "是否存在按米或升计量的备件？"
    rationale: "备件库按件发放与记账，异常记录沿用同一计量单位便于对账"
    source: "资料：备件台账字段说明#unit"
  - id: X-009
    dimension: D3
    kind: state
    statement: "异常记录按 待处理、处理中、已关闭 三态流转，不设挂起态"
    basis: inferred
    must_ask: false
    status: pending
    question: "等待备件到货期间异常记录停在哪个状态？"
    proposal: "三态为 待处理、处理中、已关闭，等件期间停在处理中并用备注说明"
    rationale: "等件是处理过程中的正常环节，单设挂起态会让状态机多出两条迁移"
    source: "AI 建议 2026-11-20"
    asked_rounds: 1
    pending_reason: "张主管需与维修班组核对是否增加「挂起」态"
  - id: X-010
    dimension: D3
    kind: state
    statement: "巡检任务状态为 待巡检、巡检中、已完成 三态"
    basis: stated
    must_ask: true
    status: pending
    rationale: "状态口径来自作业指导书，是否增加「已取消」态尚未确认"
