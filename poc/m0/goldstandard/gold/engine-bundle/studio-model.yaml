format: studio-model
object_types:
- code: Supplier
  name: 供应商
  description: SRM 系统管理的供应商主数据，含结算方式与冻结状态
  enabled: true
  attrs:
  - code: supplier_code
    name: 供应商编码
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: SRM 系统供应商唯一编码
    isDerived: false
  - code: supplier_name
    name: 供应商名称
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 供应商营业执照全称
    isDerived: false
  - code: settlement_type
    name: 结算方式
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 与供应商约定的付款周期
    isDerived: false
  - code: frozen_flag
    name: 冻结标记
    type: boolean
    required: false
    isKey: false
    defaultValue: ''
    description: true=冻结（停止对账与付款）；false=正常
    isDerived: false
  - code: create_time
    name: 创建时间
    type: datetime
    required: false
    isKey: false
    defaultValue: ''
    description: 供应商主数据创建时间
    isDerived: false
  - code: update_time
    name: 更新时间
    type: datetime
    required: false
    isKey: false
    defaultValue: ''
    description: 供应商主数据最近更新时间
    isDerived: false
  - code: total_delivery_amount
    name: 供应商交货总额
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 该供应商所有合同下全部交货记录的交货金额合计（元，含税）；由规则「供应商交货总额」衍生
    isDerived: true
- code: PurchaseContract
  name: 采购合同
  description: 与供应商签署的采购合同，记录金额与履约状态
  enabled: true
  attrs:
  - code: contract_nr
    name: 采购合同号
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: SRM 合同唯一编号
    isDerived: false
  - code: contract_amount
    name: 合同总金额
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 合同含税总金额（元）
    isDerived: false
  - code: sign_date
    name: 签约日期
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 合同签署日期
    isDerived: false
  - code: status
    name: 合同状态
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 生效=正常履约；终止=到期或提前终止；作废=签署后取消
    isDerived: false
  - code: supplier_code
    name: 签约供应商
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 合同签约方的供应商编码
    isDerived: false
- code: DeliveryRecord
  name: 交货记录
  description: WMS 记录的每次交货明细，挂在采购合同下
  enabled: true
  attrs:
  - code: delivery_nr
    name: 交货单号
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: WMS 交货单唯一编号
    isDerived: false
  - code: delivery_qty
    name: 交货数量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 本次交货件数
    isDerived: false
  - code: delivery_amount
    name: 交货金额
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 本次交货金额（元，含税）
    isDerived: false
  - code: delivery_date
    name: 交货日期
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 实际到货日期
    isDerived: false
  - code: contract_nr
    name: 关联合同
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 本次交货所属采购合同
    isDerived: false
- code: ReconciliationStatement
  name: 对账单
  description: FIM 财务系统按供应商按月生成的对账单，记录发票与对账金额
  enabled: true
  attrs:
  - code: recon_nr
    name: 对账单号
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: FIM 对账单唯一编号
    isDerived: false
  - code: recon_period
    name: 对账期间
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 对账月份，格式 yyyy-MM
    isDerived: false
  - code: invoice_amount
    name: 发票金额
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 供应商本期开具发票总额（元）
    isDerived: false
  - code: reconciled_amount
    name: 已对账金额
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 双方核对一致确认的金额（元）
    isDerived: false
  - code: status
    name: 对账状态
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: open=对账中；confirmed=双方确认；disputed=存在争议
    isDerived: false
  - code: create_time
    name: 创建时间
    type: datetime
    required: false
    isKey: false
    defaultValue: ''
    description: 对账单创建时间
    isDerived: false
  - code: supplier_code
    name: 对账供应商
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 本对账单对应的供应商
    isDerived: false
  - code: recon_diff_amount
    name: 对账差异金额
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 发票金额 − 已对账金额（元）；由规则「对账差异金额」衍生
    isDerived: true
  - code: recon_diff_rate
    name: 对账差异率
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 差异金额 ÷ 发票金额（比率）；由规则「对账差异率」衍生
    isDerived: true
link_types:
- code: rel_d4301b95
  source: Supplier
  target: PurchaseContract
  name: ''
  cardinality: 1:n
  description: ''
  sourcePropertyCode: supplier_code
  targetPropertyCode: supplier_code
- code: rel_ec1c7c1a
  source: PurchaseContract
  target: DeliveryRecord
  name: ''
  cardinality: 1:n
  description: ''
  sourcePropertyCode: contract_nr
  targetPropertyCode: contract_nr
- code: rel_6cd9e0a1
  source: Supplier
  target: ReconciliationStatement
  name: ''
  cardinality: 1:n
  description: ''
  sourcePropertyCode: supplier_code
  targetPropertyCode: supplier_code
rule_types:
- code: rule_06abb59a
  name: 对账差异金额
  ruleType: calculation
  mode: single
  description: 发票金额 − 已对账金额（元）；无已对账金额按 0 处理；负值=多对账，保留不取绝对值
  ruleConfig:
    expression: '[对账单.发票金额] - COALESCE([对账单.已对账金额], 0)'
  outputEntityCode: ReconciliationStatement
  outputPropertyCode: recon_diff_amount
  outputPropertyName: 对账差异金额
  initializationStrategy: full_recompute
- code: rule_0adf3d8e
  name: 对账差异率
  ruleType: calculation
  mode: single
  description: 差异金额 ÷ 发票金额（比率）；发票金额为 0 或缺失时记 9999（异常大，保证触发复核）
  ruleConfig:
    expression: COALESCE([对账单.对账差异金额] / [对账单.发票金额], 9999)
  outputEntityCode: ReconciliationStatement
  outputPropertyCode: recon_diff_rate
  outputPropertyName: 对账差异率
  initializationStrategy: full_recompute
- code: rule_9824568c
  name: 供应商交货总额
  ruleType: calculation
  mode: single
  description: 该供应商所有合同下全部交货记录的交货金额合计（元，含税）
  ruleConfig:
    expression: SUM([交货记录.交货金额])
  outputEntityCode: Supplier
  outputPropertyCode: total_delivery_amount
  outputPropertyName: 供应商交货总额
  initializationStrategy: full_recompute
