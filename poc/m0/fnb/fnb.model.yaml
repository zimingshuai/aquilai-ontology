ontology: fnb
version: 0.1.0-draft.1
base_version: null
entities:
  ProductCategory:
    display_name: 产品品类
    table_name: product_category
    description: 餐饮食用品及供应链物料的标准品类层级与分类定义
    properties:
      pc_code:
        display_name: 品类编码
        description: 品类编码
        type: STRING
        primary: true
      pc_name:
        display_name: 品类名称
        description: 品类名称
        type: STRING
      description:
        display_name: 品类描述
        description: 品类描述
        type: STRING
  SKU:
    display_name: 商品SKU
    table_name: sku
    description: 餐饮与供应链场景下的物料单元，记录产品基础物理规格及型号信息
    properties:
      sku_code:
        display_name: SKU编码
        description: SKU编码
        type: STRING
        primary: true
      sku_name:
        display_name: SKU名称
        description: SKU名称
        type: STRING
      abc_type:
        display_name: ABC分类
        description: 按照SKU对库存金额的累计贡献进行排序，并根据累计贡献比例划分A/B/C等级
        type: STRING
      material_type:
        display_name: 所属物料层级
        description: 所属物料层级
        type: STRING
      base_uom:
        display_name: 基础计量单位
        description: 基础计量单位
        type: STRING
      purchase_uom:
        display_name: 采购计量单位
        description: 采购计量单位
        type: STRING
      sales_uom:
        display_name: 销售计量单位
        description: 销售计量单位
        type: STRING
      shelf_life_days:
        display_name: 总货架寿命天数
        description: 从商品生产日期到商品失效日期之间允许流通、存储和销售的最长时间，用于衡量商品整体可销售周期，是库存管理、保质期控制和供应链决策的重要基础指标。
        type: INTEGER
      min_receive_shelf_life:
        display_name: 收货最小剩余货架期
        description: 供应商送货到仓库或门店时，商品必须至少保留的可销售时间，用于保障收货商品具备足够的销售周期，降低临期和报损风险。
        type: INTEGER
      sled_days:
        display_name: 最佳赏味期天数
        description: 商品在规定储存条件下能够保持最佳口感、风味、品质状态的时间周期，用于指导食品质量管理、库存周转和临期运营策略。
        type: INTEGER
      storage_type:
        display_name: 存储类型
        description: 常温品/冷鲜品/冷冻品
        type: STRING
      storage_condition:
        display_name: 存储条件
        description: 常温/冷藏/冷冻
        type: STRING
      temp_control_req:
        display_name: 温度控制要求
        description: 温度控制要求（Temperature Control Requirement）
        type: STRING
      allergen:
        display_name: 过敏原
        description: 标识物料是否包含过敏原，如小麦、坚果、乳制品等
        type: STRING
      organic_flag:
        display_name: 有机标识
        description: 标识该SKU是否为有机产品：Y/N
        type: BOOLEAN
      trace_code:
        display_name: 追溯码
        description: 用于批次追踪、供应链追溯的编码
        type: STRING
      status:
        display_name: SKU状态
        description: 表示SKU当前状态，如正常、停用、冻结等
        type: STRING
      create_time:
        display_name: 创建时间
        description: 数据行创建时间
        type: TIMESTAMP
      update_time:
        display_name: 更新时间
        description: 数据行更新时间
        type: TIMESTAMP
      launch_date:
        display_name: 上市日期
        description: SKU首次进入市场或供应链体系的日期
        type: DATE
      pc_code:
        display_name: 品类编码
        description: 品类编码
        type: STRING
      pc_name:
        display_name: 品类名称
        description: 品类名称
        type: STRING
    links:
      product_category: ProductCategory
  Warehouse:
    display_name: 仓库
    table_name: warehouse
    description: 餐饮及供应链物流存储网络中的物理库房与仓储节点
    properties:
      wh_code:
        display_name: 仓库编码
        description: 仓库编码
        type: STRING
        primary: true
      wh_name:
        display_name: 仓库名称
        description: 仓库名称
        type: STRING
      factory_code:
        display_name: 工厂编码
        description: 仓库所属工厂编码
        type: STRING
      region:
        display_name: 区域
        description: 仓库所属区域
        type: STRING
      temp_type:
        display_name: 仓库支持温层
        description: 仓库支持温层：冷链、常温
        type: STRING
      city:
        display_name: 城市
        description: 仓库所属城市
        type: STRING
      max_storage_capacity:
        display_name: 最大库容
        description: 仓库最大可存储能力
        type: DOUBLE
  PurchaseOrder:
    display_name: 采购订单
    table_name: purchase_order
    description: 已确认未收货的采购订单, 在途采购量
    properties:
      purchase_order_nr:
        display_name: 采购订单编号
        description: ''
        type: STRING
        primary: true
      order_date:
        display_name: 采购订单日期
        description: 由采购部门发起采购订单日期
        type: DATE
      required_delivery_date:
        display_name: 要求交货日期
        description: ''
        type: DATE
      estimated_arrival_date:
        display_name: 预计到达日期
        description: 采购订单预计到达日期
        type: DATE
      ship_date:
        display_name: 发货日期
        description: 发货日期
        type: DATE
      total_order_qty:
        display_name: 订单总量
        description: 订单总量
        type: DOUBLE
      delivered_qty:
        display_name: 交货量
        description: 交货量
        type: DOUBLE
      undelivery_qty:
        display_name: 未交货量
        description: ''
        type: DOUBLE
      status:
        display_name: 采购订单状态
        description: ''
        type: STRING
      unit_code:
        display_name: 采购单位
        description: ''
        type: STRING
      unit_cost:
        display_name: 单位成本（元）
        description: ''
        type: STRING
      cancel_flag:
        display_name: 是否取消标记
        description: ''
        type: BOOLEAN
      close_flag:
        display_name: 是否关闭标记
        description: ''
        type: BOOLEAN
      sku_code:
        display_name: SKU编码
        description: ''
        type: STRING
      wh_code:
        display_name: 仓库编码
        description: 采购订单所属仓库
        type: STRING
    links:
      sku: SKU
      warehouse: Warehouse
      sku_in_warehouse: SKUInWarehouse
  ReplenishmentOrder:
    display_name: 调拨单
    table_name: replenishment_order
    description: 上游仓向下游仓调拨库存的调拨单
    properties:
      replenishment_order_nr:
        display_name: 调拨单编号
        description: ''
        type: STRING
        primary: true
      undelivery_qty:
        display_name: 未交货量
        description: ''
        type: DOUBLE
    links:
      sku_in_warehouse: SKUInWarehouse
  SalesOrder:
    display_name: 销售订单
    table_name: sales_order
    description: 实时销售订单
    properties:
      order_nr:
        display_name: 订单编号
        description: ''
        type: STRING
        primary: true
      due_date:
        display_name: 交付日期
        description: ''
        type: STRING
      order_qty:
        display_name: 订单总量
        description: ''
        type: DOUBLE
      unit_code:
        display_name: 销售单位
        description: ''
        type: STRING
      unit_cost:
        display_name: 单位成本（元）
        description: ''
        type: DOUBLE
      delivery_qty:
        display_name: 已交付量
        description: ''
        type: DOUBLE
      undelivery_qty:
        display_name: 未交付量
        description: ''
        type: DOUBLE
      fulfill_qty:
        display_name: 满足量
