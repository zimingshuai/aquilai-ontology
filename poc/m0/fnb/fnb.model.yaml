        type: DOUBLE
      unfulfill_qty:
        display_name: 缺货量
        description: 缺货/未满足量
        type: DOUBLE
      sku_code:
        display_name: SKU编码
        description: ''
        type: STRING
      sku_name:
        display_name: SKU名称
        description: ''
        type: STRING
      wh_code:
        display_name: 仓库编码
        description: ''
        type: STRING
    links:
      sku: SKU
      warehouse: Warehouse
      sku_in_warehouse: SKUInWarehouse
  SKUInWarehouse:
    display_name: SKU在库状态
    table_name: sku_in_warehouse
    description: 表达特定的 SKU 在具体仓库中的进销存属性及流转量化指标
    properties:
      sku_in_wh_code:
        display_name: SKU-仓库编码
        description: SKU-仓库编码
        type: STRING
        primary: true
      influencing_factor:
        display_name: 影响因子
        description: SKU的影响因子，越大影响越大
        type: DOUBLE
      onhand_inventory_qty:
        display_name: 实时库存数量
        description: SKU-仓库聚合的实时库存数量
        type: DOUBLE
      inventory_aging_days:
        display_name: 库龄天数
        description: 用于计算库存元天（IDD）等指标
        type: INTEGER
      inventory_unit_cost:
        display_name: 单位库存成本（元）
        description: 单位库存存储成本、单位库存金额等，用于计算库存指标
        type: DECIMAL
      average_inventory_qty:
        display_name: 平均库存量
        description: 评估周期内平均库存量
        type: DOUBLE
      average_daily_outbound_qty:
        display_name: 日出库量
        description: 评估周期内平均日出库量
        type: DOUBLE
      target_inventory_level:
        display_name: 目标库存水位
        description: 企业根据业务目标、服务水平要求和供应链策略，希望库存长期维持的理想库存水平，用于指导补货、库存控制和库存优化
        type: DOUBLE
      safety_stock:
        display_name: 安全库存
        description: 为了应对需求波动、供应不确定性而额外持有的库存缓冲，用于保障服务水平，降低缺货风险
        type: DOUBLE
      inventory_level:
        display_name: 库存水位
        description: 库存周转天数偏低/正常/偏高/异常高
        type: STRING
      supply_demand_matching:
        display_name: 库存供需匹配
        description: 是否有库存缺货
        type: STRING
      sku_code:
        display_name: SKU编码
        description: SKU编码
        type: STRING
      sku_name:
        display_name: SKU名称
        description: SKU名称
        type: STRING
      pc_code:
        display_name: 品类编码
        description: 品类编码
        type: STRING
      pc_name:
        display_name: 品类名称
        description: 品类名称
        type: STRING
      wh_code:
        display_name: 仓库编码
        description: 仓库编码
        type: STRING
      wh_name:
        display_name: 仓库名称
        description: 仓库名称
        type: STRING
      undelivery_purchase_qty:
        display_name: 未到货采购量
        description: 发往该仓该SKU的实时未到货/在途采购量
        type: DOUBLE
      undelivery_replenishment_qty:
        display_name: 未到货调拨量
        description: 发往该仓该SKU的实时未到货调拨量
        type: DOUBLE
      undelivery_sales_qty:
        display_name: 未交货销售订单量
        description: 未交货销售订单量
        type: DOUBLE
      unfulfill_sales_qty:
        display_name: 销售订单缺货量
        description: 销售订单缺货量
        type: DOUBLE
      idd:
        display_name: SKU库存元天
        description: 用于衡量当前库存按库存金额加权后的平均持有天数，反映库存资金占用时间及库存老化程度
        type: DOUBLE
      inventory_turnover_days:
        display_name: SKU库存周转天数
        description: 用于衡量库存资金按当前出库速度可维持的天数，反映其库存周转效率和资金占用水平
        type: DOUBLE
    links:
      sku: SKU
      warehouse: Warehouse
      product_category_in_warehouse: ProductCategoryInWarehouse
