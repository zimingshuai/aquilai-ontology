# =========== 规则（14 条设计口径 → 13 条 DSL + RU-14 落 OQ-12）==========
rules:
  # RU-01 衍生｜标准用量（§4.2/inspection-rules.csv：在单位和基准数量一致后比较标准用量）
- rule_type: derived_property
  name: 标准用量
  upstream: [BomLine]
  logic: "std_usage_qty: line_qty / base_qty"
  description: 标准用量 = BOM 行用量 ÷ BOM 基准数量（演示各层 1:1 → 标准用量 1）；点检用量比较与下层展开的基准口径。

  # RU-02 衍生｜下层物料需求（§4.3②/测试五：20,000÷0.98÷0.99=20,615 颗）
- rule_type: derived_property
  name: 下层物料需求
  upstream: [BomLine]
  logic: "lower_level_demand_qty: SUM(project.demands.required_qty) * std_usage_qty / COALESCE(yield_rate, 1)"
  description: 下层物料需求 = 上层需求 × 标准用量 ÷ 有效良率。本 DSL 落单层展开口径（挂载 BomLine，fact-cards 候选之一，假设 A-08）：取隶属项目需求合计×标准用量÷良率（良率仅计明确适用层级，无损耗取 1，COALESCE 兜底；同一损耗不得经良率与损耗系数重复计）；多层逐层展开后同物料汇总属多跳反向聚合（OQ-03 引擎沙箱验证，不支持则逐级衍生）；替代料不作为额外必需组件重复展开。

  # RU-03 衍生｜订单未收货量（§4.3③/测试八：8,000=3,000+5,000 不重复计）
- rule_type: derived_property
  name: 订单未收货量
  upstream: [Supply]
  logic: "open_order_qty: MAX(order_qty - received_qty - cancelled_qty - closed_unreceived_qty, 0)"
  description: max（订单数量 − 累计有效收货量 − 已取消量 − 已关闭未收余量, 0）；收货转库存后不再按原未收数量重复计（配套 StockMovement.source_supply 溯源）。

  # RU-04 衍生｜分期期末量（§4.4①/§11.6 分期表数字逐一吻合）
- rule_type: derived_property
  name: 分期期末量
  upstream: [PeriodSupplyDemand]
  logic: "closing_qty: opening_qty + arrival_qty + other_inflow_qty - fulfilled_qty - other_outflow_qty"
  description: 本期期末量 = 期初量 + 本期有效到货 + 其他有效流入 − 实际满足需求量 − 其他有效流出；本期期初量 = 上期期末量、初始库存只计一次（跨期递归结转由运行侧逐期推演承载，字段级公式如上）。

  # RU-05 衍生｜分期未满足需求（§4.4①：11 月 9,000 未满足→12 月底 7,800）
- rule_type: derived_property
  name: 分期未满足需求
  upstream: [PeriodSupplyDemand]
  logic: "unmet_carry_qty: required_qty - fulfilled_qty"
  description: 本期未满足需求 = 本期应满足需求 − 实际满足需求量；未满足保留为逾期需求，后续结转时不得重复累计。

  # RU-06 衍生｜期末风险量（§4.4②：S0 旧料 4,000=4,000−0−0）
- rule_type: derived_property
  name: 期末风险量
  upstream: [SlowMovingRisk]
  logic: "risk_qty: MAX(remaining_qty - reserved_qty - post_period_consumed_qty, 0)"
  description: 风险量 = max（评估期末剩余量 − 经确认的保留量 − 经证实的期后消耗量, 0）；保留与期后消耗不得重复覆盖同一用途，不得凭"以后可能会用"扣减。

  # RU-07 衍生｜风险金额（§11.6：4,000×16 + 1,200×20 = 88,000）
- rule_type: derived_property
  name: 风险金额
  upstream: [SlowMovingRisk]
  logic: "risk_amount: risk_qty * material.cost_unit_price"
  description: 风险金额 = Σ（风险数量 × 对应成本单价）；预计损失另行结合回收价值/处置方式计算，不与风险金额混同；窗口外承诺单独展示（延期≠消除，见 window_later_commit_* 字段）。

  # RU-08 衍生｜建议量取整（§4.3⑤/测试一：8,400/3,600→9,000/4,000）
- rule_type: derived_property
  name: 建议量取整
  upstream: [SourcingSuggestion]
  logic: "rounding_extra_qty: suggested_qty - allocated_qty"
  description: 建议量 = 按订购倍数向上取整〔max（分配量, 最小起订量）〕——向上取整函数超方言白名单，suggested_qty 落为输入侧预处理字段（OQ-02）；DSL 承载可衍生的取整额外数量 = 建议量 − 分配量，单独展示并纳入后续风险评估；交期晚于需要日期不得视为解决当期缺料（eta_meets_demand）。

  # RU-09 衍生｜待授权数量（§4.3⑥/测试四：18,000−10,000=8,000）
- rule_type: derived_property
  name: 待授权数量
  upstream: [MaterialAuthorization]
  logic: "pending_auth_qty: gross_demand_qty - authorized_qty"
  description: 待授权数量 = 项目物料毛需求 − 已授权覆盖数量；参考金额 = 待授权数量 × 成本单价（查询侧按 material.cost_unit_price 计算，不单列字段）；授权不增减物理供给（授权 v2 后物理缺口仍 15,000）。

  # RU-10 衍生｜还原期末库存（§4.5①：流水核对 8,000=8,000）
- rule_type: derived_property
  name: 还原期末库存
  upstream: [HistoricalCase]
  logic: "rebuilt_closing_qty: rebuilt_opening_qty + received_in_qty - consumed_out_qty"
  description: 期末库存 = 期初库存 + 有效收货及其他入库 − 实际消耗及其他出库；出入库分类互斥、调拨处置不重复计；与记录不一致先列差异（stock_check_diff）不判呆滞；不可取消采购承诺单独核算不混入物理库存。

  # RU-11 衍生｜模拟可减少风险量（§11.7：8,000−2,000=6,000 颗）
- rule_type: derived_property
  name: 模拟可减少风险量
  upstream: [HistoricalCase]
  logic: "simulated_reducible_qty: MAX(baseline_risk_qty - intervened_risk_qty, 0)"
  description: max（不干预风险量 − 干预后风险量, 0）；同评估期间同口径，回到历史决策时点只使用当时已知信息；证据不足时系统能忍住不给确定结论（evidence_status=缺证 时推导标记不可验证）。

  # RU-12 触发｜呆滞风险触发（§4.4②+§11.7：07-15 未覆盖风险 0→8,000）
- rule_type: trigger
  name: 呆滞风险触发
  upstream: [SlowMovingRisk]
  logic:
    ALL:
    - {field: risk_qty, operator: ">", value: 0}
  downstream: notify_slow_moving_risk
  description: 未覆盖数量 > 0（阈值预先确定，一次有效评估即触发）；风险可先出现在未到货订单上，不等入库。downstream 为占位动作名（假设 A-10），引擎侧配置时定名。

  # RU-13 触发｜换料未到货检查（§4.5 末段/§5.4：07-15 已知工程切换、07-22 取消窗口）
- rule_type: trigger
  name: 换料未到货检查
  upstream: [EcnRecord]
  logic:
    ALL:
    - {field: approve_status, operator: ==, value: 已批准}
    - {field: evidence_status, operator: ==, value: 完整}
  downstream: check_unarrived_orders_for_ecn
  description: 已批准的工程变更导致未来旧料需求减少时 → 检查关联的未到货订单，计算无法被需求覆盖的数量，提示可取消数量、办理时间及截止日期；变更已获知且影响能够判断时触发，不等 BOM 正式生效（前置条件以 approve_status=已批准 字段化，"旧料需求减少"的判定明细由下游动作承载）。downstream 为占位动作名（假设 A-10），引擎侧配置时定名。（两版拉通裁决#1
    2026-10-16：采纳旧版双条件——证据不足时不得触发检查，对齐文档红线"证据不足只输出能确认的事实"；缺证版 ECN 案例实证此条件必要）

  # RU-14（分配与归因双约束）不落 rules——登记 open_questions OQ-12 动作域候选，理由见该条。

# =========== 能力问题（12 条，与 charter.md §二一致）==========
- rule_type: trigger
  name: 授权数量变化重核算
  upstream:
  - ChangeRecord
  logic:
    ALL:
    - {field: change_type, operator: ==, value: 授权变化}
  downstream: recompute_pending_authorization
  description: 授权数量变化时重算待授权口径（两版拉通裁决#2：采纳旧版触发——§4.2 点检异常处理"授权变化→重新计算相关需求"）
- rule_type: trigger
  name: 替代关系变化复核分配
  upstream:
  - ChangeRecord
  logic:
    ALL:
    - {field: change_type, operator: ==, value: 替代关系变化}
  downstream: review_allocation_validity
  description: 替代关系变化时复核既有分配方案有效性（两版拉通裁决#2：采纳旧版触发——失效替代"保留问题记录不参与计算"，分配需复核；§11.4 PS-3002 语义）
- rule_type: trigger
  name: 冻结供给排除待核查
  upstream:
  - Supply
  logic:
    ALL:
    - {field: supply_type, operator: ==, value: 质检冻结库存}
  downstream: exclude_from_allocation_and_flag
  description: 质检冻结供给不参与分配并单列待核查（两版拉通裁决#2：采纳旧版触发——§11.3 PS-1002"未获放行不参与供给，单列待核查数量"；20,000 元冻结库存单列演示实证）
competency_questions:
- id: cq-001
  q: 指定项目与 BOM 类型的前后两个版本之间发生了哪些变化（物料增删/用量/单位/生效日期/替代/授权），各自影响哪些项目、物料、需求和供给？
  covered_by: [ChangeRecord, ChangeRecord.change_type, ChangeRecord.old_value, ChangeRecord.new_value, ChangeRecord.check_advice, ImpactRecord, ImpactRecord.evidence_refs, ImpactRecord.review_status, BomLine.std_usage_qty]
- id: cq-002
  q: 某项目在某需求日期的物料毛需求是多少，分别是按哪张 BOM（类型/版本/生效范围）展开、按哪条需求口径（覆盖/替换后）汇总的？
  covered_by: [Demand, Demand.required_qty, Demand.required_date, Demand.is_estimate, BomLine, BomLine.bom_type, BomLine.bom_version, BomLine.valid_from, BomLine.valid_to, BomLine.std_usage_qty, BomLine.lower_level_demand_qty]
- id: cq-003
  q: 某物料当前可分配的供给有多少（可用库存/在途订单，扣冻结），按既定优先级分配后缺口还剩多少？
  covered_by: [Supply, Supply.supply_type, Supply.qty, Supply.available_date, Supply.open_order_qty, AllocationRecord, AllocationRecord.allocated_qty, AllocationRecord.priority_seq, AllocationRecord.reserved_flag]
- id: cq-004
  q: 哪些（项目×物料）存在授权外需求，待授权数量与参考金额各是多少？授权增加会不会误增物理供给？
  covered_by: [MaterialAuthorization, MaterialAuthorization.authorized_qty, MaterialAuthorization.pending_auth_qty, MaterialAuthorization.auth_version, Material.cost_unit_price]
- id: cq-005
  q: 每家供应商对某缺口的建议量是多少？按最小起订量与订购倍数取整后多出多少？预计到货能否满足需要日期？
  covered_by: [SourcingSuggestion, SourcingSuggestion.suggested_qty, SourcingSuggestion.rounding_extra_qty, SourcingSuggestion.eta_meets_demand, SupplierSupplyCondition, SupplierSupplyCondition.moq, SupplierSupplyCondition.order_multiple,
    SupplierSupplyCondition.lead_time_days, SupplierSupplyCondition.quota_ratio, VendorReferenceList]
- id: cq-006
  q: 评估期末哪些物料存在呆滞风险（风险量=期末剩余−保留−期后消耗）？风险金额（数量×成本单价）与窗口后未消化承诺各是多少？
  covered_by: [PeriodSupplyDemand, PeriodSupplyDemand.closing_qty, PeriodSupplyDemand.unmet_carry_qty, SlowMovingRisk, SlowMovingRisk.risk_type, SlowMovingRisk.remaining_qty, SlowMovingRisk.reserved_qty,
    SlowMovingRisk.risk_qty, SlowMovingRisk.risk_amount, SlowMovingRisk.window_later_commit_qty]
- id: cq-007
  q: 对同一风险分别执行取消/延期/替代消耗/转用方案后，剩余风险、行动成本、是否造成缺料各是什么？哪个方案可作为优先复核方案？
  covered_by: [SolutionPlan, SolutionPlan.action_type, SolutionPlan.action_cost, SolutionPlan.shortage_flag, SolutionPlan.feasible_reason, Supply, Supply.restriction_note]
- id: cq-008
  q: 某历史呆滞案例的呆滞数量是怎样一步步形成的（库存/未到货订单瀑布），风险在哪个时点首次可识别，当时已经知道什么？
  covered_by: [HistoricalCase, HistoricalCase.rebuilt_closing_qty, HistoricalCase.stock_check_diff, HistoricalMilestone, HistoricalMilestone.milestone_type, HistoricalMilestone.milestone_date, HistoricalMilestone.known_info,
    StockMovement, StockMovement.movement_type, StockMovement.qty]
- id: cq-009
  q: 回到历史决策时点只使用当时已知信息，及时干预能够减少多少风险量？证据不足时系统能否忍住不给确定结论？
  covered_by: [HistoricalCase, HistoricalCase.simulated_reducible_qty, HistoricalCase.evidence_status, Supply, Supply.branch]
- id: cq-010
  q: 某历史案例的呆滞总量中，各主要原因归因数量是多少，未归因还剩多少（各原因之和不得超过案例总量）？
  covered_by: [CauseAttribution, CauseAttribution.cause_type, CauseAttribution.attributed_qty, CauseAttribution.evidence_ref, CauseAttribution.conclusion_level]
- id: cq-011
  q: 某次计算结果是用哪个数据版本、观察时点、规则版本和情景分支（FACT/SIM）算出来的？换一个方案重算时结果能否复算对齐？
  covered_by: [CalculationRun, CalculationRun.known_at, CalculationRun.data_version, CalculationRun.rule_version, CalculationRun.branch, CalculationRun.scenario_no, CalculationRun.eval_start_date, CalculationRun.eval_end_date]
- id: cq-012
  q: 已批准的工程变更使某旧料未来需求下降时，哪些未到货订单会触发预防规则提示（可取消数量、办理时间、截止日期）？
  covered_by: [PreventionRule, PreventionRule.rule_content, PreventionRule.trigger_condition, PreventionRule.rule_status, EcnRecord, EcnRecord.approve_status, EcnRecord.effective_date, Supply, Supply.cancel_deadline_date]

