      material_code: {display_name: 风险物料编码, description: 风险按物料计量；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "§4.4②"}
      risk_type: {display_name: 风险类型, description: 库存风险/未到货订单风险（风险可先出现在未到货订单上，不等入库）, type: STRING, enum_values: [库存风险, 未到货订单风险], source: "§4.4②"}
