      material_code: {display_name: 供需物料编码, description: 分期推演按物料；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "§4.4①"}
      period: {display_name: 期间, description: 演示粒度为月（假设 A-03），粒度本身为字段不硬编码, type: STRING, source: "§11.6"}
