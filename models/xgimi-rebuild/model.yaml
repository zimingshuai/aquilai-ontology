# xgimi-rebuild 本体 DSL（model.yaml）——source of truth
# 由已确认的 design-proposal.md（确认点②，用户 2026-10-15 批复"都没问题"）机械形式化而来：
# 语义（实体/关系/规则口径/CQ/OQ）以设计稿与 fact-cards 为唯一依据，本步只做形态转换与阶段⑤待补字段落位。
# 命名对照 seeds/glossary.md 建议名（CalculationRun/MaterialAuthorization/SubstitutionPermission/SlowMovingRisk 等）。
# 规则形态说明：RU-01~RU-11 落 derived_property（表达式按 dsl-spec §3.1 方言白名单）；RU-12/RU-13 落 trigger；
# RU-14（复合约束）登记 OQ-12 动作域候选（admission 须挂 actions 段声明的动作，本 POC 只读无动作域）。
ontology: xgimi-rebuild
version: 1.0.0-draft.1
base_version:                           # 从零建库，无引擎快照基线
governance:
  owner: 聂江锋（推断，OQ-11 待确认）     # business_owner 推断值，用户确认后回写
  maturity: experimental

# 新术语注记（受控词表 modeling-guide §四：glossary 未登记的实体名首次入库供人审裁定；
# 其余 17 个实体名已对照 seeds/glossary.md 建议名/两版同名复用）
glossary_additions:
- {term: StockMovement, definition: 出入库事实流水（收货/入库/消耗/出库，分类互斥），waterfall 核对与收货转库存的依据}
- {term: ChangeRecord, definition: 点检对比产出的单条变化（六类判断）；上次试用版对应概念为 InspectionChange}
- {term: ImpactRecord, definition: 变化波及对象的合并明细（多条依据合并一条），复核任务状态内嵌；上次试用版拆为 InspectionChange+ReviewTask}
- {term: AllocationRecord, definition: 一批供给对一个需求（含替代路径）的分配明细，可展开复算；替代上次试用版 MaterialRequirement 的汇总口径}
- {term: PeriodSupplyDemand, definition: 按评估期逐期推演的供需行；上次试用版对应概念为 PeriodSupplyBalance}
- {term: HistoricalMilestone, definition: 历史案例时间线锚点（风险形成/取消窗口/观察决策/结果核实），回答何时已知什么}
- {term: CauseAttribution, definition: 呆滞案例原因结论行（归因数量受总量上限约束，余量保留未归因）}
- {term: PreventionRule, definition: 历史教训沉淀的检查规则（草案→审核→试运行→启用），变更已获知且影响可判断时触发}

entities:

  # =========== L1 主数据 ===========
  Project:
    display_name: 项目
    layer: L1 主数据
    table_name: project
    description: 机型/产品线，需求和 BOM 的挂载主体（E01）
    provenance: {doc: "xgimi-poc-doc §4.1/§11.2；fact-cards FC-E-01", reviewed: false}
    properties:
      project_code: {display_name: 项目编码, description: 如 100-Z9001, type: STRING, primary: true, source: "§11.2 项目表"}
      project_name: {display_name: 项目代号, description: 如 P-Z9, type: STRING, source: "§11.2"}
      model: {display_name: 机型, description: 如 Z9 / Z9S, type: STRING, source: "§11.2"}
      stage: {display_name: 项目阶段, description: 演示值 量产MP/NPI-DVT/停产, type: STRING, enum_values: [量产MP, NPI-DVT, 停产], source: "§11.2"}
      bom_status_desc: {display_name: BOM状态描述, description: 项目视角的 BOM 状态说明, type: STRING, source: "§11.2"}

  Material:
    display_name: 物料
    layer: L1 主数据
    table_name: material
    description: 最小跟踪单位（WiFi、SoC、主板、整机），汇总与库存跟踪的锚点（E02）
    provenance: {doc: "xgimi-poc-doc §4.1/§11.2/§11.5；fact-cards FC-E-02", reviewed: false}
    properties:
      material_code: {display_name: 物料编码, description: 如 300-W6A01 / 200-Z9PCB / 100-Z9001（整机同为物料）, type: STRING, primary: true, source: "§11.2"}
      material_name: {display_name: 物料名称, description: 如 WiFi6 模组 / Z9 主板, type: STRING, source: "§11.2"}
      base_uom: {display_name: 基本计量单位, description: 如 颗, type: STRING, source: "测试六 UNIT-M"}
      cost_unit_price: {display_name: 成本单价, description: 演示成本单价（WiFi5 16 元/颗、WiFi6 20 元/颗）, type: DOUBLE, uom: 元/颗, source: "§11.5 成本参数"}

  Supplier:
    display_name: 供应商
    layer: L1 主数据
    table_name: supplier
    description: 具备供货资格的供应商主体（E09）
    provenance: {doc: "xgimi-poc-doc §11.5；fact-cards FC-E-09", reviewed: false}
    properties:
      supplier_code: {display_name: 供应商编码, description: 如 V-WLINK, type: STRING, primary: true, source: "§11.5"}
      supplier_name: {display_name: 供应商名称, description: 供应商主体名, type: STRING, source: "§11.5"}
      purchase_group: {display_name: 采购组, description: 如 206, type: STRING, source: "§11.5"}

  SupplierSupplyCondition:
    display_name: 供应商供货条件
    layer: L1 主数据
    table_name: supplier_supply_condition
    description: 交期/最小起订量/订购倍数/配额约定（E10）
    provenance: {doc: "xgimi-poc-doc §4.1/§11.5；fact-cards FC-E-10", reviewed: false}
    properties:
      condition_id:
        display_name: 供货条件ID
        description: 供应商-物料供货条件的唯一标识
        type: STRING
        primary: true
      supplier_code: {display_name: 供应商编码, description: 条件归属供应商；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "§11.5"}
      material_code: {display_name: 适用物料编码, description: 条件按物料生效；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "§11.5"}
      lead_time_days: {display_name: 交期, description: 日历周口径的供货交期, type: INTEGER, uom: 天, source: "§11.5（8 周）"}
      moq: {display_name: 最小起订量, description: '如 5,000', type: INTEGER, uom: 件, source: "§11.5"}
      order_multiple: {display_name: 订购倍数, description: 建议量按此向上取整, type: INTEGER, uom: 件, source: '§11.5（1,000）'}
      quota_ratio: {display_name: 分配份额, description: 双供应商配额（演示 100%；测试一 70%/30%）, type: DOUBLE, uom: "%", source: "§4.3⑤/测试一"}
    links:
      supplier: {target: Supplier, fk: [supplier_code], name: 供货供应商, description: 供货条件的供应商主体}
      material: {target: Material, fk: [material_code], name: 适用物料, description: 供货条件覆盖的物料（交期/MOQ/倍数按物料约定）}

  UnitConversion:
    display_name: 单位换算
    layer: L1 主数据
    table_name: unit_conversion
    description: 已确认的计量单位换算关系，原始值保留计算用换算（E12）
    provenance: {doc: "xgimi-poc-doc §4.1 统一计算约定/测试六；fact-cards FC-E-12", reviewed: false}
    properties:
      conversion_id:
        display_name: 换算关系ID
        description: 物料单位换算关系的唯一标识
        type: STRING
        primary: true
      material_code: {display_name: 换算物料编码, description: 如 UNIT-M（基本单位颗）；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "测试六"}
      alt_unit: {display_name: 备选单位, description: 如 盒；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "测试六"}
      factor: {display_name: 换算系数, description: 1 盒=100 颗, type: DOUBLE, uom: 系数, source: "测试六"}
      approval_status: {display_name: 批准状态, description: 移除换算依据后提示缺证，不将 12 盒当作 12 颗, type: STRING, source: "测试六"}
    links:
      material: {target: Material, fk: [material_code], name: 换算物料, description: 换算关系适用的物料（颗↔盒等）}

  # =========== L2 BOM与变更 ===========
  BomLine:
    display_name: BOM 行
    layer: L2 BOM与变更
    table_name: bom_line
    description: 机型结构清单行：类型/版本/层级用量/良率/生效期，点检与展开的载体（E03）
    provenance: {doc: "xgimi-poc-doc §4.1/§4.2/§11.2/inspection-rules.csv；fact-cards FC-E-03", reviewed: false}
    properties:
      bom_line_id: {display_name: BOM行标识, description: 如 L-Z9-02-new, type: STRING, primary: true, source: "§11.2"}
      bom_type: {display_name: BOM类型, description: 标准/风险/维修（Z10 仅风险 BOM v0.9、SRV-Z9 维修 BOM）, type: STRING, enum_values: [标准, 风险, 维修], source: "§11.2/§4.2"}
      bom_version: {display_name: BOM版本, description: 如 整机 v3.2/主板 v2.2, type: STRING, source: "§11.2"}
      parent_material_code: {display_name: 父项物料编码, description: 该行描述父项的一个组件构成, type: STRING, source: "§11.2 父项列"}
      child_material_code: {display_name: 子项物料编码, description: 该行挂载被使用的子项物料, type: STRING, source: "§11.2 子项列"}
      project_code: {display_name: 隶属项目编码, description: BOM 行归属机型项目, type: STRING, source: "§4.1"}
      ecn_id: {display_name: 来源变更单号, description: 行的增改（换料新旧行）由哪次 ECN 驱动，可空, type: STRING, source: "§11.1/§11.2"}
      line_qty: {display_name: 行用量, description: 该行单位用量（演示各层 1:1）, type: DOUBLE, uom: 件, source: "§11.2"}
      base_qty: {display_name: 基准数量, description: 标准用量计算的分母（演示各层 1）；设计稿 E03 阶段⑤补全字段, type: DOUBLE, uom: 件, source: "§11.2（1:1 口径）"}
      yield_rate: {display_name: 良率, description: 有效良率（主案例 1，测试五 0.98/0.99）；无损耗取 1；损耗系数是否增设见 OQ-10, type: DOUBLE, uom: 比率, source: "测试五"}
      valid_from: {display_name: 生效起始日期, description: 如 2026-11-01 起；设计稿 E03 阶段⑤补全字段, type: DATE, source: "§11.2"}
      valid_to: {display_name: 生效截止日期, description: 如 至 2026-10-31；设计稿 E03 阶段⑤补全字段, type: DATE, source: "§11.2"}
      known_at: {display_name: 版本可见时间, description: 该行记录何时进入数据版本（V0 之前/V1）；版本由各记录 known_at 承载（假设 A-02）（两版拉通裁决#5：TIMESTAMP→STRING——附录 BOM 行表存在"V0 之前"取值无法日期化，版本号口径承载；与旧版 OQ-12 裁决对齐）, type: STRING, source: "§11.2/§11.1"}
      std_usage_qty: {display_name: 标准用量, description: RU-01 衍生——行用量÷基准数量, type: DOUBLE, uom: 件, derived: true, source: "§4.2/inspection-rules.csv"}
      lower_level_demand_qty: {display_name: 下层物料需求, description: RU-02 衍生（单层展开口径）——上层需求×标准用量÷有效良率；多层递归展开待 OQ-03 引擎验证, type: DOUBLE, uom: 件, derived: true, source: "§4.3②/测试五"}
    links:
      parent_material: {target: Material, fk: [parent_material_code], name: 父项物料, description: BOM 行的父项物料（整机/主板层级，双链取舍见 A7）}
      child_material: {target: Material, fk: [child_material_code], name: 子项物料, description: BOM 行的子项物料（主关联，与 material 同指不同链路视角）}
      project: {target: Project, fk: [project_code], name: 隶属项目, description: BOM 行所属的项目/机型（结构清单归属）}
      ecn: {target: EcnRecord, fk: [ecn_id], name: 产生于变更, description: BOM 行变化驱动的工程变更记录（换料 ECN）}

  EcnRecord:
    display_name: 工程变更记录
    layer: L2 BOM与变更
    table_name: ecn_record
    description: 换料等工程变更的发布与批准记录，BOM 版本变化的驱动源（E04）
    provenance: {doc: "xgimi-poc-doc §11.1/§11.7/§5.4；fact-cards FC-E-04", reviewed: false}
    properties:
      ecn_id: {display_name: 变更单号, description: 如 Z9 换料 ECN / H-ECN-01, type: STRING, primary: true, source: "§11.1"}
      ecn_desc: {display_name: 变更描述, description: 变更内容摘要, type: STRING, source: "§11.1"}
      publish_time: {display_name: 发布时间, description: 如 V1 2026-09-29 09:00, type: TIMESTAMP, source: "§11.1"}
      effective_date: {display_name: 生效日期, description: 如 2026-11-01, type: DATE, source: "§11.1"}
      approve_status: {display_name: 批准状态, description: 演示口径"已批准的工程切换"；枚举全集未给（不脑补），RU-13 触发条件使用, type: STRING, source: "§5.4/§11.7"}
      evidence_status: {display_name: 证据状态, description: 完整/缺失（缺证版本保留引用编号但批准文件缺失）, type: STRING, enum_values: [完整, 缺失], source: "§11.7"}

  # =========== L3 需求与供给 ===========
  Demand:
    display_name: 需求
    layer: L3 需求与供给
    table_name: demand
    description: 各项目需要数量与日期（MPS/客户订单/预测/维修），覆盖与替换关系明确（E05）
    provenance: {doc: "xgimi-poc-doc §4.1/§4.3①/§11.2；fact-cards FC-E-05", reviewed: false}
    properties:
      demand_uid:
        display_name: 需求实例UID
        description: 需求实例唯一标识（demand_id+版本联合定位的业务实例）
        type: STRING
        primary: true
      demand_id: {display_name: 需求编号, description: 如 DEM-Z9-NOV / ORD-Z9-NOV / FCST-Z9-NOV；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "§11.2"}
      record_version: {display_name: 记录版本, description: 如 v1/v2，新版本替换旧版本不追加计数；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "§11.2"}
      demand_type: {display_name: 需求类型, description: 已确认MPS/客户订单/早期预测/维修, type: STRING, enum_values: [已确认MPS, 客户订单, 早期预测, 维修], source: "§11.2"}
      project_code: {display_name: 归属项目编码, description: 需求按项目归口汇总, type: STRING, source: "§11.2"}
      required_qty: {display_name: 需求数量, description: 台/颗口径的需要数量, type: INTEGER, uom: 件, source: "§11.2"}
      required_date: {display_name: 需要日期, description: 物料可用日，非客户交货日, type: DATE, source: "§11.2"}
      is_estimate: {display_name: 估算标记, description: true=估算，不进入确定需求（测试二）, type: BOOLEAN, source: "测试二"}
      covered_demand_id: {display_name: 被覆盖需求编号, description: 上位需求编号（ORD 被 DEM 覆盖），可空, type: STRING, source: "§11.2 covered_by"}
      covered_demand_version: {display_name: 被覆盖需求版本, description: 与 covered_demand_id 组成复合外键, type: STRING, source: "§11.2"}
      superseded_demand_id: {display_name: 被替换需求编号, description: 旧版本需求编号（v2 替换 v1），可空, type: STRING, source: "§11.2"}
      superseded_demand_version: {display_name: 被替换需求版本, description: 与 superseded_demand_id 组成复合外键, type: STRING, source: "§11.2"}
      supersedes_uid:
        display_name: 替换目标UID
        description: 本记录替换的上一版本需求实例（demand_uid）；无前版为空
        type: STRING
      covered_by_uid:
        display_name: 被覆盖需求UID
        description: 本需求被哪条已确认需求覆盖（demand_uid）；无覆盖为空
        type: STRING
    links:
      project: {target: Project, fk: [project_code], name: 归属项目, description: 需求所属项目（各来源需求按项目归集）}
      covered_by: {target: Demand, fk: [covered_by_uid], name: 被需求覆盖, description: 本需求被哪条已确认需求覆盖（订单/MPS 覆盖关系，避免重复计算）}
      supersedes: {target: Demand, fk: [supersedes_uid], name: 替换历史版本, description: 本记录替换的上一版本需求（v2 替换 v1 不追加计数）}

  MaterialAuthorization:
    display_name: 物料授权
    layer: L3 需求与供给
    table_name: material_authorization
    description: 整机料号采购授权记录（策备表域），授权覆盖量与物理供给分开核算（E06）
    provenance: {doc: "xgimi-poc-doc §2.1/§4.3⑥/测试四；fact-cards FC-E-06", reviewed: false}
    properties:
      auth_id:
        display_name: 授权ID
        description: 物料授权记录唯一标识
        type: STRING
        primary: true
      project_code: {display_name: 授权项目编码, description: 整机料号；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "§2.1/测试四"}
      material_code: {display_name: 授权物料编码, description: 被授权物料；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "测试四"}
      auth_version: {display_name: 授权版本, description: v2 替换 v1；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "测试四"}
      authorized_qty: {display_name: 授权覆盖数量, description: '覆盖台数/颗数（v1 10,000 → v2 6,000）', type: INTEGER, uom: 件, source: 测试四}
      approve_date: {display_name: 批准日期, description: 如 10-01 批准 v2, type: DATE, source: "测试四"}
      status: {display_name: 授权状态, description: 授权状态说明（全集未给）, type: STRING, source: "§4.1 需求行"}
      gross_demand_qty: {display_name: 项目物料毛需求, description: '待授权数量的输入侧口径（测试四 18,000）；参考金额=待授权数量×成本单价（查询侧计算，见 RU-09 描述）', type: INTEGER, uom: 件, source: 测试四}
      pending_auth_qty: {display_name: 待授权数量, description: RU-09 衍生——毛需求−已授权覆盖数量；授权不增减物理供给, type: INTEGER, uom: 件, derived: true, source: "§4.3⑥/测试四"}
    links:
      project: {target: Project, fk: [project_code], name: 授权项目, description: 授权适用的项目（授权按项目+物料下发）}
      material: {target: Material, fk: [material_code], name: 授权物料, description: 被授权的物料（整机料号采购授权对象）}

  Supply:
    display_name: 供给
    layer: L3 需求与供给
    table_name: supply
    description: 可用库存/质检冻结/已确认未收货订单的统一供给记录，含取消与延期条件（E07）
    provenance: {doc: "xgimi-poc-doc §4.1/§4.3③/§11.3；fact-cards FC-E-07", reviewed: false}
    properties:
      supply_id: {display_name: 供给编号, description: 如 PS-1001…PS-3002 / SIM-W6-9000, type: STRING, primary: true, source: "§11.3"}
      supply_type: {display_name: 供给类型, description: 可用库存/质检冻结库存/已确认未收货订单（文档统一编号统一表，假设 A-05）, type: STRING, enum_values: [可用库存, 质检冻结库存, 已确认未收货订单], source: "§11.3"}
      material_code: {display_name: 供给物料编码, description: 每条供给对应一颗物料, type: STRING, source: "§11.3"}
      run_id: {display_name: 所属运行编号, description: FACT/SIM 分支归属（模拟供给不写入 FACT）, type: STRING, source: "§11.1"}
      qty: {display_name: 数量, description: 供给数量, type: INTEGER, uom: 件, source: "§11.3"}
      available_date: {display_name: 可用或到货日, description: 库存可用日/订单到货日, type: DATE, source: "§11.3"}
      branch: {display_name: 分支, description: 事实与模拟分开保存, type: STRING, enum_values: [FACT, SIM], source: "§11.1"}
      order_qty: {display_name: 订单数量, description: 未收货订单类型的订单总量（测试八 8, 000）: null, type: INTEGER, uom: 件, source: "§4.3③/测试八"}
      received_qty: {display_name: 累计有效收货量, description: 已收货转入库存部分（测试八 3, 000）: null, type: INTEGER, uom: 件, source: "§4.3③/测试八"}
      cancelled_qty: {display_name: 已取消量, description: 已办理取消的数量, type: INTEGER, uom: 件, source: "§4.3③"}
      closed_unreceived_qty: {display_name: 已关闭未收余量, description: 订单关闭时仍未收货的余量, type: INTEGER, uom: 件, source: "§4.3③"}
      open_order_qty: {display_name: 订单未收货量, description: RU-03 衍生——max(订单数量−累计有效收货量−已取消量−已关闭未收余量, 0)；收货转库存后不重复计: null, type: INTEGER, uom: 件, derived: true, source: "§4.3③/测试八"}
      cancel_deadline_date: {display_name: 取消截止日, description: 如 10-15；设计稿 E07 阶段⑤落位字段, type: DATE, source: "§11.3"}
      cancellation_fee: {display_name: 取消费, description: 如 1 元/颗；设计稿 E07 阶段⑤落位字段, type: DOUBLE, uom: 元/颗, source: "§11.3"}
      restriction_note: {display_name: 限制条件说明, description: '如"仅按临时许可使用"/"最多可取消 2,000、可整单延期至 2027-01-15"；设计稿 E07 阶段⑤落位字段', type: STRING, source: "§11.3"}
    links:
      material: {target: Material, fk: [material_code], name: 供给物料, description: 供给记录对应的物料（库存/冻结/在途按物料跟踪）}
      run: {target: CalculationRun, fk: [run_id], name: 所属运行, description: 供给所属的计算运行（FACT/SIM 分支锚定：模拟供给仅存在于所属情景）}

  StockMovement:
    display_name: 库存收发流水
    layer: L3 需求与供给
    table_name: stock_movement
    description: 收货/入库/消耗/出库事实流水（分类互斥），waterfall 核对与收货转库存的依据（E08）
    provenance: {doc: "xgimi-poc-doc §4.5①/§11.7/测试八；fact-cards FC-E-08", reviewed: false}
    properties:
      movement_id: {display_name: 流水编号, description: 如 ST-R1 关联流水, type: STRING, primary: true, source: "测试八/§11.7"}
      movement_type: {display_name: 流水类型, description: 有效收货及其他入库/实际消耗及其他出库（分类互斥）；枚举全集未给，先按大类落（OQ-06）, type: STRING, source: "§4.5①/§11.7"}
      material_code: {display_name: 收发物料编码, description: 流水按物料核对, type: STRING, source: "§11.7"}
      source_supply_id: {display_name: 来源供给编号, description: 收货流水把未收货订单量转入库存（PO-R1→ST-R1），防止重复计入；非订单流水可空, type: STRING, source: "测试八/§4.3③"}
      qty: {display_name: 数量, description: 流水数量（带方向由类型承载）, type: INTEGER, uom: 件, source: "§11.7"}
      movement_date: {display_name: 流水日期, description: '如 11-20 收货 3,000', type: DATE, source: 测试八}
    links:
      material: {target: Material, fk: [material_code], name: 收发物料, description: 流水涉及的物料（收发按物料跟踪）}
      source_supply: {target: Supply, fk: [source_supply_id], name: 来源供给, description: 流水来源的供给记录（收货从在途转库存的溯源）}

  SubstitutionPermission:
    display_name: 替代与转用许可
    layer: L3 需求与供给
    table_name: substitution_permission
    description: 物料间可替换规则及批准条件（临时许可替代/售后转用），替代计算准入门槛（E11）
    provenance: {doc: "xgimi-poc-doc §4.1/§4.3④/§11.4；fact-cards FC-E-11", reviewed: false}
    properties:
      permission_id: {display_name: 许可编号, description: 如 SUB-01/SUB-02, type: STRING, primary: true, source: "§11.4"}
      permission_type: {display_name: 许可类型, description: 临时许可替代/售后转用, type: STRING, enum_values: [临时许可替代, 售后转用], source: "§11.4"}
      replaced_material_code: {display_name: 被替代物料编码, description: 需求侧被补偿的物料（如 WiFi6 需求）, type: STRING, source: "§11.4 SUB-01"}
      replacing_material_code: {display_name: 替代物料编码, description: 供给侧用于替代的物料（如 WiFi5 指定批次）, type: STRING, source: "§11.4"}
      project_code: {display_name: 适用项目编码, description: 许可只对指定项目生效（仅 Z9）, type: STRING, source: "§11.4"}
      conversion_ratio: {display_name: 换算比例, description: 如 1:1, type: DOUBLE, uom: 比率, source: "§11.4"}
      valid_from: {display_name: 有效起始日期, description: 如 2026-11-01（12-01 生效为售后转用通道）, type: DATE, source: "§11.4"}
      valid_to: {display_name: 有效截止日期, description: 如 2026-11-30, type: DATE, source: "§11.4"}
      batch_limit_note: {display_name: 批次限定说明, description: '如"指定库存批次共 6,000 颗"；设计稿 E11 阶段⑤落位字段', type: STRING, source: "§11.4"}
      approval_cap_qty: {display_name: 批准上限数量, description: 替代计算的批准上限（§4.3④ 检查项）；设计稿 E11 阶段⑤落位字段, type: INTEGER, uom: 件, source: "§4.3④"}
      approve_status: {display_name: 批准状态, description: 失效替代关系保留问题记录但不得参与计算（§4.2 异常处理）, type: STRING, source: "§11.4"}
    links:
      replaced_material: {target: Material, fk: [replaced_material_code], name: 被替代物料, description: 被替代满足的物料需求侧（WiFi6）}
      replacing_material: {target: Material, fk: [replacing_material_code], name: 替代物料, description: 替代物料关系（SubstitutionPermission → Material）}
      project: {target: Project, fk: [project_code], name: 适用项目, description: 替代许可适用的项目（许可按项目约束）}

  # =========== L4 计算输出 ===========
  CalculationRun:
    display_name: 计算运行
    layer: L4 计算输出
    table_name: calculation_run
    description: 一次计算的运行身份：观察时点/数据版本/规则版本/情景分支，追溯与复算的锚（E13）
    provenance: {doc: "xgimi-poc-doc §4.1/§11.1；fact-cards FC-E-13", reviewed: false}
    properties:
      run_id: {display_name: 运行编号, description: 如 V2 策备运行快照, type: STRING, primary: true, source: "§11.1"}
      known_at: {display_name: 观察时点, description: 如 2026-09-30 09:00（两版拉通裁决#5：TIMESTAMP→STRING——附录 BOM 行表存在"V0 之前"取值无法日期化，版本号口径承载；与旧版 OQ-12 裁决对齐）, type: STRING, source: "§11.1"}
      data_version: {display_name: 数据版本, description: V0—V3（版本由各记录 known_at 承载，假设 A-02）, type: STRING, source: "§11.1"}
      rule_version: {display_name: 规则版本, description: 每次运行保存规则版本；设计稿 E13 阶段⑤落位字段, type: STRING, source: "§4.1"}
      branch: {display_name: 分支, description: 事实记录与模拟记录分别保存, type: STRING, enum_values: [FACT, SIM], source: "§11.1"}
      scenario_no: {display_name: 情景编号, description: 方案/情景编号（如 S0/S1/S2 重算分支）, type: STRING, source: "§4.1"}
      eval_start_date: {display_name: 评估期间起, description: 如 2026-11-01；设计稿 E13 阶段⑤落位字段, type: DATE, source: "§11.1"}
      eval_end_date: {display_name: 评估期间止, description: 如 2026-12-31；设计稿 E13 阶段⑤落位字段, type: DATE, source: "§11.1"}

  ChangeRecord:
    display_name: 变化记录
    layer: L4 计算输出
    table_name: change_record
    description: 点检对比产出的单条变化（物料增删/用量/单位/生效日期/替代/授权六类判断）（E14）
    provenance: {doc: "xgimi-poc-doc §4.2/inspection-rules.csv；fact-cards FC-E-14", reviewed: false}
    properties:
      change_id: {display_name: 变化编号, description: 点检输出唯一编号, type: STRING, primary: true, source: "§4.2"}
      change_type: {display_name: 变化类型, description: 六类判断（inspection-rules.csv 全量）, type: STRING, enum_values: [物料增删, 用量变化, 单位变化, 生效日期变化, 替代关系变化, 授权数量变化], source: "inspection-rules.csv"}
      old_value: {display_name: 变化前值, description: 对比基准版本取值, type: STRING, source: "§4.2"}
      new_value: {display_name: 变化后值, description: 对比目标版本取值, type: STRING, source: "§4.2"}
      check_advice: {display_name: 后续检查, description: 变化附带的后续检查建议, type: STRING, source: "inspection-rules.csv"}
      run_id: {display_name: 所属运行编号, description: 点检对比也在某次运行身份下留存, type: STRING, source: "§4.1"}
      bom_line_id: {display_name: 涉及BOM行标识, description: 增删/用量/单位/生效日期四类变化指向的 BOM 行，可空, type: STRING, source: "inspection-rules.csv"}
      permission_id: {display_name: 涉及许可编号, description: 替代关系变化指向的许可记录，可空, type: STRING, source: "inspection-rules.csv"}
      project_code: {display_name: 涉及授权项目编码, description: 授权数量变化指向的授权记录（复合外键成员），可空, type: STRING, source: "inspection-rules.csv"}
      material_code: {display_name: 涉及授权物料编码, description: 授权数量变化指向的授权记录（复合外键成员），可空, type: STRING, source: "inspection-rules.csv"}
      auth_version: {display_name: 涉及授权版本, description: 授权数量变化指向的授权记录（复合外键成员），可空, type: STRING, source: "inspection-rules.csv"}
      auth_id:
        display_name: 关联物料授权
        description: 指向物料授权（MaterialAuthorization）主键 auth_id 的外键
        type: STRING
    links:
      run: {target: CalculationRun, fk: [run_id], name: 所属运行, description: 所属运行关系（ChangeRecord → CalculationRun）}
      bom_line: {target: BomLine, fk: [bom_line_id], name: 涉及BOM行, description: 变化涉及的 BOM 行}
      substitution: {target: SubstitutionPermission, fk: [permission_id], name: 涉及替代关系, description: 变化涉及的替代关系}
      authorization: {target: MaterialAuthorization, fk: [auth_id], name: 涉及授权, description: 变化涉及的物料授权}

  ImpactRecord:
    display_name: 影响记录
    layer: L4 计算输出
    table_name: impact_record
    description: 变化波及对象的合并明细（多条依据合并一条），复核任务及处理状态载体（E15）
    provenance: {doc: "xgimi-poc-doc §4.2/§5.3.1；fact-cards FC-E-15", reviewed: false}
    properties:
      impact_id: {display_name: 影响编号, description: 合并后唯一编号, type: STRING, primary: true, source: "§4.2③"}
      run_id: {display_name: 所属运行编号, description: 影响明细归属运行, type: STRING, source: "§4.2"}
      project_code: {display_name: 受影响项目编码, description: 变化波及的项目，可空, type: STRING, source: "§4.2③"}
      material_code: {display_name: 受影响物料编码, description: 变化波及的物料, type: STRING, source: "§4.2③"}
      evidence_refs: {display_name: 判断依据引用, description: 多条依据以字段清单承载（n:m 由 OQ-04 裁决是否建桥表）, type: STRING, source: "§4.2③"}
      review_status: {display_name: 复核状态, description: 待复核/已收处理依据/关闭（任务收到处理依据后才能关闭）, type: STRING, enum_values: [待复核, 已收处理依据, 关闭], source: "§4.2④"}
      impact_scope: {display_name: 影响范围, description: 波及对象范围说明, type: STRING, source: "§4.2③"}
    links:
      run: {target: CalculationRun, fk: [run_id], name: 所属运行, description: 所属运行关系（ImpactRecord → CalculationRun）}
      project: {target: Project, fk: [project_code], name: 受影响项目, description: 受影响项目关系（ImpactRecord → Project）}
      material: {target: Material, fk: [material_code], name: 受影响物料, description: 受影响的物料}

  AllocationRecord:
    display_name: 供需分配记录
    layer: L4 计算输出
    table_name: allocation_record
    description: 一批供给对一个需求（含替代路径）的分配明细，累计不超可用、可展开复算（E16）
    provenance: {doc: "xgimi-poc-doc §4.1/§4.3③④/§11.3；fact-cards FC-E-16", reviewed: false}
    properties:
      allocation_id: {display_name: 分配编号, description: 分配明细唯一编号, type: STRING, primary: true, source: "§4.3④"}
      demand_id: {display_name: 分配需求编号, description: 本次分配满足的需求（复合外键成员）, type: STRING, source: "§4.3④"}
      demand_version: {display_name: 分配需求版本, description: 复合外键成员, type: STRING, source: "§4.3④"}
      supply_id: {display_name: 分配供给编号, description: 被占用的供给批次, type: STRING, source: "§4.3④"}
      permission_id: {display_name: 依据许可编号, description: 替代路径分配的批准依据，可空, type: STRING, source: "§4.3④"}
      run_id: {display_name: 所属运行编号, description: 分配结果可追溯到运行, type: STRING, source: "§4.1"}
      allocated_qty: {display_name: 分配数量, description: 实际分配量（累计分配量≤该批可用数量，RU-14① 约束）, type: INTEGER, uom: 件, source: "§4.3④"}
      priority_seq: {display_name: 分配优先顺序, description: 相同日期按项目编码、供给可用日期和供给ID稳定排序, type: INTEGER, source: "§11.3"}
      reserved_flag: {display_name: 预留标记, description: true=为当前需求预留的供给计入已覆盖量, type: BOOLEAN, source: "§11.3"}
      demand_uid:
        display_name: 关联需求
        description: 指向需求（Demand）主键 demand_uid 的外键
        type: STRING
    links:
      demand: {target: Demand, fk: [demand_uid], name: 分配需求, description: 分配满足的需求（供给×需求行级分配）}
      supply: {target: Supply, fk: [supply_id], name: 分配供给, description: 分配使用的供给（同批累计分配≤可用）}
      substitution: {target: SubstitutionPermission, fk: [permission_id], name: 依据替代许可, description: 依据替代许可关系（AllocationRecord → SubstitutionPermission）}
      run: {target: CalculationRun, fk: [run_id], name: 所属运行, description: 所属运行关系（AllocationRecord → CalculationRun）}

  SourcingSuggestion:
    display_name: 策备建议
    layer: L4 计算输出
    table_name: sourcing_suggestion
    description: 对剩余缺口的采购建议量：MOQ/倍数取整、取整额外量、交期满足检查（E17）
    provenance: {doc: "xgimi-poc-doc §4.3⑤⑥/§11.5/§11.6/测试一/测试十；fact-cards FC-E-17", reviewed: false}
    properties:
      suggestion_id:
        display_name: 建议ID
        description: 策备建议唯一标识
        type: STRING
        primary: true
      run_id: {display_name: 运行编号, description: 建议归属运行（V2 快照）；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "§11.1"}
      material_code: {display_name: 建议物料编码, description: 建议针对的物料；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "§4.3⑤"}
      supplier_code: {display_name: 建议供应商编码, description: 建议面向的供应商；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "§4.3⑤"}
      allocated_qty: {display_name: 分配量, description: 建议基于的已分配量, type: INTEGER, uom: 件, source: "§4.3⑤"}
      suggested_qty: {display_name: 建议量, description: '按订购倍数向上取整〔max(分配量,最小起订量)〕——向上取整超方言白名单，落为输入侧预处理字段（OQ-02）', type: INTEGER, uom: 件, source: "§4.3⑤/测试一"}
      rounding_extra_qty: {display_name: 取整额外数量, description: RU-08 衍生——建议量−分配量；单独展示并纳入后续风险评估, type: INTEGER, uom: 件, derived: true, source: "§4.3⑤"}
      eta_meets_demand: {display_name: 交期满足, description: false=到货晚于需求日期，不得视为解决当期缺料（测试十）, type: BOOLEAN, source: "§4.3⑤/测试十"}
      list_id:
        display_name: 关联供应商参考清单
        description: 指向供应商参考清单（VendorReferenceList）主键 list_id 的外键
        type: STRING
    links:
      material: {target: Material, fk: [material_code], name: 建议物料, description: 建议采购的物料}
      supplier: {target: Supplier, fk: [supplier_code], name: 建议供应商, description: 建议下达的供应商（按资格/份额分配）}
      ref_list: {target: VendorReferenceList, fk: [list_id], name: 列入参考清单, description: 列入参考清单关系（SourcingSuggestion → VendorReferenceList）}
      run: {target: CalculationRun, fk: [run_id], name: 所属运行, description: 策备建议所属的计算运行}

  VendorReferenceList:
    display_name: 供应商参考清单
    layer: L4 计算输出
    table_name: vendor_reference_list
    description: 按供应商整理的建议参考清单，供内部审核；不等同采购订单、默认不外发（E18）
    provenance: {doc: "xgimi-poc-doc §3.2③/§4.1/§5.3.3；fact-cards FC-E-18", reviewed: false}
    properties:
      list_id:
        display_name: 清单ID
        description: 供应商参考清单唯一标识（平台先例命名）
