        primary: true
      run_id: {display_name: 运行编号, description: 清单归属运行；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "§11.1"}
      supplier_code: {display_name: 面向供应商编码, description: 清单按供应商整理；与原复合键其余成员联合唯一（业务唯一性语义保留）, type: STRING, source: "§3.2③"}
