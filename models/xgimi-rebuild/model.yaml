      arrival_qty: {display_name: 本期有效到货, description: 本期内有效到货量, type: INTEGER, uom: 件, source: "§4.4①"}
      other_inflow_qty: {display_name: 其他有效流入, description: 到货之外的有效流入, type: INTEGER, uom: 件, source: "§4.4①"}
      required_qty: {display_name: 本期应满足需求, description: 本期应满足的需求量（含逾期结转，不重复累计）, type: INTEGER, uom: 件, source: "§4.4①"}
      fulfilled_qty: {display_name: 实际满足需求量, description: 本期实际满足量, type: INTEGER, uom: 件, source: "§4.4①"}
      other_outflow_qty: {display_name: 其他有效流出, description: 满足需求之外的有效流出, type: INTEGER, uom: 件, source: "§4.4①"}
      closing_qty: {display_name: 期末量, description: RU-04 衍生——期初+有效到货+其他流入−满足−其他流出；本期期初=上期期末（递归结转语义见规则描述）, type: INTEGER, uom: 件, derived: true, source: "§4.4①"}
      unmet_carry_qty: {display_name: 未满足结转, description: RU-05 衍生——本期应满足−实际满足；保留为逾期需求，结转不重复累计, type: INTEGER, uom: 件, derived: true, source: "§4.4①"}
    links:
