format: studio-model
object_types:
- code: Project
  name: 项目
  description: 机型/产品线，需求和 BOM 的挂载主体（E01）
  enabled: true
  attrs:
  - code: project_code
    name: 项目编码
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 如 100-Z9001
    isDerived: false
  - code: project_name
    name: 项目代号
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 如 P-Z9
    isDerived: false
  - code: model
    name: 机型
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 如 Z9 / Z9S
    isDerived: false
  - code: stage
    name: 项目阶段
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 演示值 量产MP/NPI-DVT/停产
    isDerived: false
  - code: bom_status_desc
    name: BOM状态描述
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 项目视角的 BOM 状态说明
    isDerived: false
- code: Material
  name: 物料
  description: 最小跟踪单位（WiFi、SoC、主板、整机），汇总与库存跟踪的锚点（E02）
  enabled: true
  attrs:
  - code: material_code
    name: 物料编码
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 如 300-W6A01 / 200-Z9PCB / 100-Z9001（整机同为物料）
    isDerived: false
  - code: material_name
    name: 物料名称
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 如 WiFi6 模组 / Z9 主板
    isDerived: false
  - code: base_uom
    name: 基本计量单位
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 如 颗
    isDerived: false
  - code: cost_unit_price
    name: 成本单价
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 演示成本单价（WiFi5 16 元/颗、WiFi6 20 元/颗）
    isDerived: false
- code: Supplier
  name: 供应商
  description: 具备供货资格的供应商主体（E09）
  enabled: true
  attrs:
  - code: supplier_code
    name: 供应商编码
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 如 V-WLINK
    isDerived: false
  - code: supplier_name
    name: 供应商名称
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 供应商主体名
    isDerived: false
  - code: purchase_group
    name: 采购组
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 如 206
    isDerived: false
- code: SupplierSupplyCondition
  name: 供应商供货条件
  description: 交期/最小起订量/订购倍数/配额约定（E10）
  enabled: true
  attrs:
  - code: condition_id
    name: 供货条件ID
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 供应商-物料供货条件的唯一标识
    isDerived: false
  - code: supplier_code
    name: 供应商编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 条件归属供应商；与原复合键其余成员联合唯一（业务唯一性语义保留）
    isDerived: false
  - code: material_code
    name: 适用物料编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 条件按物料生效；与原复合键其余成员联合唯一（业务唯一性语义保留）
    isDerived: false
  - code: lead_time_days
    name: 交期
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 日历周口径的供货交期
    isDerived: false
  - code: moq
    name: 最小起订量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 如 5,000
    isDerived: false
  - code: order_multiple
    name: 订购倍数
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 建议量按此向上取整
    isDerived: false
  - code: quota_ratio
    name: 分配份额
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 双供应商配额（演示 100%；测试一 70%/30%）
    isDerived: false
- code: UnitConversion
  name: 单位换算
  description: 已确认的计量单位换算关系，原始值保留计算用换算（E12）
  enabled: true
  attrs:
  - code: conversion_id
    name: 换算关系ID
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 物料单位换算关系的唯一标识
    isDerived: false
  - code: material_code
    name: 换算物料编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 如 UNIT-M（基本单位颗）；与原复合键其余成员联合唯一（业务唯一性语义保留）
    isDerived: false
  - code: alt_unit
    name: 备选单位
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 如 盒；与原复合键其余成员联合唯一（业务唯一性语义保留）
    isDerived: false
  - code: factor
    name: 换算系数
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 1 盒=100 颗
    isDerived: false
  - code: approval_status
    name: 批准状态
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 移除换算依据后提示缺证，不将 12 盒当作 12 颗
    isDerived: false
- code: BomLine
  name: BOM 行
  description: 机型结构清单行：类型/版本/层级用量/良率/生效期，点检与展开的载体（E03）
  enabled: true
  attrs:
  - code: bom_line_id
    name: BOM行标识
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 如 L-Z9-02-new
    isDerived: false
  - code: bom_type
    name: BOM类型
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 标准/风险/维修（Z10 仅风险 BOM v0.9、SRV-Z9 维修 BOM）
    isDerived: false
  - code: bom_version
    name: BOM版本
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 如 整机 v3.2/主板 v2.2
    isDerived: false
  - code: parent_material_code
    name: 父项物料编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 该行描述父项的一个组件构成
    isDerived: false
  - code: child_material_code
    name: 子项物料编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 该行挂载被使用的子项物料
    isDerived: false
  - code: project_code
    name: 隶属项目编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: BOM 行归属机型项目
    isDerived: false
  - code: ecn_id
    name: 来源变更单号
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 行的增改（换料新旧行）由哪次 ECN 驱动，可空
    isDerived: false
  - code: line_qty
    name: 行用量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 该行单位用量（演示各层 1:1）
    isDerived: false
  - code: base_qty
    name: 基准数量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 标准用量计算的分母（演示各层 1）；设计稿 E03 阶段⑤补全字段
    isDerived: false
  - code: yield_rate
    name: 良率
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 有效良率（主案例 1，测试五 0.98/0.99）；无损耗取 1；损耗系数是否增设见 OQ-10
    isDerived: false
  - code: valid_from
    name: 生效起始日期
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 如 2026-11-01 起；设计稿 E03 阶段⑤补全字段
    isDerived: false
  - code: valid_to
    name: 生效截止日期
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 如 至 2026-10-31；设计稿 E03 阶段⑤补全字段
    isDerived: false
  - code: known_at
    name: 版本可见时间
    type: datetime
    required: false
    isKey: false
    defaultValue: ''
    description: 该行记录何时进入数据版本（V0 之前/V1）；版本由各记录 known_at 承载（假设 A-02）
    isDerived: false
  - code: std_usage_qty
    name: 标准用量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: RU-01 衍生——行用量÷基准数量
    isDerived: true
  - code: lower_level_demand_qty
    name: 下层物料需求
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: RU-02 衍生（单层展开口径）——上层需求×标准用量÷有效良率；多层递归展开待 OQ-03 引擎验证
    isDerived: true
- code: EcnRecord
  name: 工程变更记录
  description: 换料等工程变更的发布与批准记录，BOM 版本变化的驱动源（E04）
  enabled: true
  attrs:
  - code: ecn_id
    name: 变更单号
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 如 Z9 换料 ECN / H-ECN-01
    isDerived: false
  - code: ecn_desc
    name: 变更描述
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 变更内容摘要
    isDerived: false
  - code: publish_time
    name: 发布时间
    type: datetime
    required: false
    isKey: false
    defaultValue: ''
    description: 如 V1 2026-09-29 09:00
    isDerived: false
  - code: effective_date
    name: 生效日期
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 如 2026-11-01
    isDerived: false
  - code: approve_status
    name: 批准状态
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 演示口径"已批准的工程切换"；枚举全集未给（不脑补），RU-13 触发条件使用
    isDerived: false
  - code: evidence_status
    name: 证据状态
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 完整/缺失（缺证版本保留引用编号但批准文件缺失）
    isDerived: false
- code: Demand
  name: 需求
  description: 各项目需要数量与日期（MPS/客户订单/预测/维修），覆盖与替换关系明确（E05）
  enabled: true
  attrs:
  - code: demand_uid
    name: 需求实例UID
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 需求实例唯一标识（demand_id+版本联合定位的业务实例）
    isDerived: false
  - code: demand_id
    name: 需求编号
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 如 DEM-Z9-NOV / ORD-Z9-NOV / FCST-Z9-NOV；与原复合键其余成员联合唯一（业务唯一性语义保留）
    isDerived: false
  - code: record_version
    name: 记录版本
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 如 v1/v2，新版本替换旧版本不追加计数；与原复合键其余成员联合唯一（业务唯一性语义保留）
    isDerived: false
  - code: demand_type
    name: 需求类型
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 已确认MPS/客户订单/早期预测/维修
    isDerived: false
  - code: project_code
    name: 归属项目编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 需求按项目归口汇总
    isDerived: false
  - code: required_qty
    name: 需求数量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 台/颗口径的需要数量
    isDerived: false
  - code: required_date
    name: 需要日期
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 物料可用日，非客户交货日
    isDerived: false
  - code: is_estimate
    name: 估算标记
    type: boolean
    required: false
    isKey: false
    defaultValue: ''
    description: true=估算，不进入确定需求（测试二）
    isDerived: false
  - code: covered_demand_id
    name: 被覆盖需求编号
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 上位需求编号（ORD 被 DEM 覆盖），可空
    isDerived: false
  - code: covered_demand_version
    name: 被覆盖需求版本
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 与 covered_demand_id 组成复合外键
    isDerived: false
  - code: superseded_demand_id
    name: 被替换需求编号
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 旧版本需求编号（v2 替换 v1），可空
    isDerived: false
  - code: superseded_demand_version
    name: 被替换需求版本
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 与 superseded_demand_id 组成复合外键
    isDerived: false
  - code: supersedes_uid
    name: 替换目标UID
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 本记录替换的上一版本需求实例（demand_uid）；无前版为空
    isDerived: false
  - code: covered_by_uid
    name: 被覆盖需求UID
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 本需求被哪条已确认需求覆盖（demand_uid）；无覆盖为空
    isDerived: false
- code: MaterialAuthorization
  name: 物料授权
  description: 整机料号采购授权记录（策备表域），授权覆盖量与物理供给分开核算（E06）
  enabled: true
  attrs:
  - code: auth_id
    name: 授权ID
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 物料授权记录唯一标识
    isDerived: false
  - code: project_code
    name: 授权项目编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 整机料号；与原复合键其余成员联合唯一（业务唯一性语义保留）
    isDerived: false
  - code: material_code
    name: 授权物料编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 被授权物料；与原复合键其余成员联合唯一（业务唯一性语义保留）
    isDerived: false
  - code: auth_version
    name: 授权版本
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: v2 替换 v1；与原复合键其余成员联合唯一（业务唯一性语义保留）
    isDerived: false
  - code: authorized_qty
    name: 授权覆盖数量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 覆盖台数/颗数（v1 10,000 → v2 6,000）
    isDerived: false
  - code: approve_date
    name: 批准日期
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 如 10-01 批准 v2
    isDerived: false
  - code: status
    name: 授权状态
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 授权状态说明（全集未给）
    isDerived: false
  - code: gross_demand_qty
    name: 项目物料毛需求
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 待授权数量的输入侧口径（测试四 18,000）；参考金额=待授权数量×成本单价（查询侧计算，见 RU-09 描述）
    isDerived: false
  - code: pending_auth_qty
    name: 待授权数量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: RU-09 衍生——毛需求−已授权覆盖数量；授权不增减物理供给
    isDerived: true
- code: Supply
  name: 供给
  description: 可用库存/质检冻结/已确认未收货订单的统一供给记录，含取消与延期条件（E07）
  enabled: true
  attrs:
  - code: supply_id
    name: 供给编号
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 如 PS-1001…PS-3002 / SIM-W6-9000
    isDerived: false
  - code: supply_type
    name: 供给类型
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 可用库存/质检冻结库存/已确认未收货订单（文档统一编号统一表，假设 A-05）
    isDerived: false
  - code: material_code
    name: 供给物料编码
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 每条供给对应一颗物料
    isDerived: false
  - code: run_id
    name: 所属运行编号
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: FACT/SIM 分支归属（模拟供给不写入 FACT）
    isDerived: false
  - code: qty
    name: 数量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 供给数量
    isDerived: false
  - code: available_date
    name: 可用或到货日
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 库存可用日/订单到货日
    isDerived: false
  - code: branch
    name: 分支
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 事实与模拟分开保存
    isDerived: false
  - code: order_qty
    name: 订单数量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 未收货订单类型的订单总量（测试八 8
    isDerived: false
  - code: received_qty
    name: 累计有效收货量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 已收货转入库存部分（测试八 3
    isDerived: false
  - code: cancelled_qty
    name: 已取消量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 已办理取消的数量
    isDerived: false
  - code: closed_unreceived_qty
    name: 已关闭未收余量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 订单关闭时仍未收货的余量
    isDerived: false
  - code: open_order_qty
    name: 订单未收货量
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: RU-03 衍生——max(订单数量−累计有效收货量−已取消量−已关闭未收余量
    isDerived: true
  - code: cancel_deadline_date
    name: 取消截止日
    type: date
    required: false
    isKey: false
    defaultValue: ''
    description: 如 10-15；设计稿 E07 阶段⑤落位字段
    isDerived: false
  - code: cancellation_fee
    name: 取消费
    type: double
    required: false
    isKey: false
    defaultValue: ''
    description: 如 1 元/颗；设计稿 E07 阶段⑤落位字段
    isDerived: false
  - code: restriction_note
    name: 限制条件说明
    type: string
    required: false
    isKey: false
    defaultValue: ''
    description: 如"仅按临时许可使用"/"最多可取消 2,000、可整单延期至 2027-01-15"；设计稿 E07 阶段⑤落位字段
    isDerived: false
- code: StockMovement
  name: 库存收发流水
  description: 收货/入库/消耗/出库事实流水（分类互斥），waterfall 核对与收货转库存的依据（E08）
  enabled: true
  attrs:
  - code: movement_id
    name: 流水编号
    type: string
    required: true
    isKey: true
    defaultValue: ''
    description: 如 ST-R1 关联流水
    isDerived: false
  - code: movement_type
