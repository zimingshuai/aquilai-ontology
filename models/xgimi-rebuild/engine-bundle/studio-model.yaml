rule_types:
- code: rule_daf5b7c7
  name: 标准用量
  ruleType: calculation
  mode: single
  description: 标准用量 = BOM 行用量 ÷ BOM 基准数量（演示各层 1:1 → 标准用量 1）；点检用量比较与下层展开的基准口径。
  ruleConfig:
    expression: '[BOM 行.行用量] / [BOM 行.基准数量]'
  outputEntityCode: BomLine
  outputPropertyCode: std_usage_qty
  outputPropertyName: 标准用量
  initializationStrategy: full_recompute
- code: rule_d06818ba
  name: 下层物料需求
  ruleType: calculation
  mode: single
  description: 下层物料需求 = 上层需求 × 标准用量 ÷ 有效良率。本 DSL 落单层展开口径（挂载 BomLine，fact-cards 候选之一，假设 A-08）：取隶属项目需求合计×标准用量÷良率（良率仅计明确适用层级，无损耗取 1，COALESCE 兜底；同一损耗不得经良率与损耗系数重复计）；多层逐层展开后同物料汇总属多跳反向聚合（OQ-03 引擎沙箱验证，不支持则逐级衍生）；替代料不作为额外必需组件重复展开。
  ruleConfig:
    expression: SUM([需求.需求数量]) * [BOM 行.标准用量] / COALESCE([BOM 行.良率], 1)
  outputEntityCode: BomLine
  outputPropertyCode: lower_level_demand_qty
  outputPropertyName: 下层物料需求
  initializationStrategy: full_recompute
- code: rule_1559efe0
  name: 订单未收货量
  ruleType: calculation
  mode: single
  description: max（订单数量 − 累计有效收货量 − 已取消量 − 已关闭未收余量, 0）；收货转库存后不再按原未收数量重复计（配套 StockMovement.source_supply 溯源）。
  ruleConfig:
    expression: MAX([供给.订单数量] - [供给.累计有效收货量] - [供给.已取消量] - [供给.已关闭未收余量], 0)
  outputEntityCode: Supply
  outputPropertyCode: open_order_qty
  outputPropertyName: 订单未收货量
  initializationStrategy: full_recompute
- code: rule_3e74c965
  name: 分期期末量
  ruleType: calculation
  mode: single
  description: 本期期末量 = 期初量 + 本期有效到货 + 其他有效流入 − 实际满足需求量 − 其他有效流出；本期期初量 = 上期期末量、初始库存只计一次（跨期递归结转由运行侧逐期推演承载，字段级公式如上）。
  ruleConfig:
    expression: '[分期供需.期初量] + [分期供需.本期有效到货] + [分期供需.其他有效流入] - [分期供需.实际满足需求量] - [分期供需.其他有效流出]'
  outputEntityCode: PeriodSupplyDemand
  outputPropertyCode: closing_qty
  outputPropertyName: 期末量
  initializationStrategy: full_recompute
- code: rule_1fb87632
  name: 分期未满足需求
  ruleType: calculation
  mode: single
  description: 本期未满足需求 = 本期应满足需求 − 实际满足需求量；未满足保留为逾期需求，后续结转时不得重复累计。
  ruleConfig:
    expression: '[分期供需.本期应满足需求] - [分期供需.实际满足需求量]'
  outputEntityCode: PeriodSupplyDemand
  outputPropertyCode: unmet_carry_qty
  outputPropertyName: 未满足结转
  initializationStrategy: full_recompute
- code: rule_4095926c
  name: 期末风险量
  ruleType: calculation
  mode: single
  description: 风险量 = max（评估期末剩余量 − 经确认的保留量 − 经证实的期后消耗量, 0）；保留与期后消耗不得重复覆盖同一用途，不得凭"以后可能会用"扣减。
  ruleConfig:
    expression: MAX([呆滞风险.期末剩余量] - [呆滞风险.经确认保留量] - [呆滞风险.经证实的期后消耗量], 0)
  outputEntityCode: SlowMovingRisk
  outputPropertyCode: risk_qty
  outputPropertyName: 风险量
  initializationStrategy: full_recompute
- code: rule_c4fb8032
  name: 风险金额
  ruleType: calculation
  mode: single
  description: 风险金额 = Σ（风险数量 × 对应成本单价）；预计损失另行结合回收价值/处置方式计算，不与风险金额混同；窗口外承诺单独展示（延期≠消除，见 window_later_commit_* 字段）。
  ruleConfig:
    expression: '[呆滞风险.风险量] * [物料.成本单价]'
  outputEntityCode: SlowMovingRisk
  outputPropertyCode: risk_amount
  outputPropertyName: 风险金额
  initializationStrategy: full_recompute
- code: rule_5ae19ab3
  name: 建议量取整
  ruleType: calculation
  mode: single
  description: 建议量 = 按订购倍数向上取整〔max（分配量, 最小起订量）〕——向上取整函数超方言白名单，suggested_qty 落为输入侧预处理字段（OQ-02）；DSL 承载可衍生的取整额外数量 = 建议量 − 分配量，单独展示并纳入后续风险评估；交期晚于需要日期不得视为解决当期缺料（eta_meets_demand）。
  ruleConfig:
    expression: '[策备建议.建议量] - [策备建议.分配量]'
  outputEntityCode: SourcingSuggestion
  outputPropertyCode: rounding_extra_qty
  outputPropertyName: 取整额外数量
  initializationStrategy: full_recompute
- code: rule_27e9ab4b
  name: 待授权数量
  ruleType: calculation
  mode: single
  description: 待授权数量 = 项目物料毛需求 − 已授权覆盖数量；参考金额 = 待授权数量 × 成本单价（查询侧按 material.cost_unit_price 计算，不单列字段）；授权不增减物理供给（授权 v2 后物理缺口仍 15,000）。
  ruleConfig:
    expression: '[物料授权.项目物料毛需求] - [物料授权.授权覆盖数量]'
  outputEntityCode: MaterialAuthorization
  outputPropertyCode: pending_auth_qty
  outputPropertyName: 待授权数量
  initializationStrategy: full_recompute
- code: rule_361a964e
  name: 还原期末库存
  ruleType: calculation
  mode: single
  description: 期末库存 = 期初库存 + 有效收货及其他入库 − 实际消耗及其他出库；出入库分类互斥、调拨处置不重复计；与记录不一致先列差异（stock_check_diff）不判呆滞；不可取消采购承诺单独核算不混入物理库存。
  ruleConfig:
    expression: '[历史呆滞案例.还原期初库存] + [历史呆滞案例.有效收货及其他入库] - [历史呆滞案例.实际消耗及其他出库]'
  outputEntityCode: HistoricalCase
  outputPropertyCode: rebuilt_closing_qty
  outputPropertyName: 还原期末库存
  initializationStrategy: full_recompute
- code: rule_cb30677c
  name: 模拟可减少风险量
  ruleType: calculation
  mode: single
  description: max（不干预风险量 − 干预后风险量, 0）；同评估期间同口径，回到历史决策时点只使用当时已知信息；证据不足时系统能忍住不给确定结论（evidence_status=缺证 时推导标记不可验证）。
  ruleConfig:
    expression: MAX([历史呆滞案例.不干预风险量] - [历史呆滞案例.干预后风险量], 0)
  outputEntityCode: HistoricalCase
  outputPropertyCode: simulated_reducible_qty
  outputPropertyName: 模拟可减少风险量
  initializationStrategy: full_recompute
