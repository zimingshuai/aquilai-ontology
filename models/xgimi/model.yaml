assumptions:
  - id: A1
    content: Supply.available_date 类型取 DATE：附录"可用或到货日"列的"V0"按 §11.1 数据版本可见时间映射（V0=2026-09-28）；"未确定"（PS-1002 冻结）留空并由 exclude_reason 说明，不按零或任意日期处理
  - id: A2
    content: BomLine.project_id 为推断关联：附录 BOM 行表无项目列，依据 §11.2 项目表"BOM 状态"列（项目持有 BOM 版本）建立行→项目关系
  - id: A3
    content: 记录级 known_at 以数据版本号字符串（V0/V1/V2/V3）表达而非日期，忠实附录口径（"V0 之前"无法日期化，见 OQ-12）；DataVersion.visible_at 承载版本→时间的映射
  - id: A4
    content: PurchaseOrder 数量字段的"明确为 0"与"未导入"语义不同（§11.6"旧料领用、退货、报废和其他调整均明确为 0，不是因为未导入而默认 0"），本体不区分缺省与零，由 evidence_status 与运行时缺证处理承载
  - id: A5
    content: MaterialRequirement 的 gross_qty/substitute_satisfied_qty/allocated_supply_qty/authorized_coverage_qty 为运行器写入的输入位（多级展开/分配排序超方言，见 OQ-02/04/08），本体承载口径与衍生公式而非全部计算
  - id: A6
    content: 5 条 trigger 的 downstream 为引擎隐式动作名（如 create_risk_review_task），一期无 actions 段（dsl-spec §4），由引擎/运行器绑定实现
  - id: A7
    content: links 取舍遵循 studio-model 互导格式约定（外键=目标主键同名、单字段主键、同对实体连线四元组去重）：同一实体对同一目标的第二个引用以属性承载不进 links（BomLine.parent_material_id、SubstitutionPermission.substitute_material_id、InspectionChange.before_line_id）；Demand.covered_by_demand_id 因目标为复合主键（demand_id+demand_version）同样以属性承载；外键字段统一采用目标主键同名（如 CalculationRun.version_id、SolutionPlan.po_id）
