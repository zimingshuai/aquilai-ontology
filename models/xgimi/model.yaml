# 本体 DSL：极米四场景本体 POC（点检变化 / 策备计算 / 呆滞模拟 / 历史呆滞）
# 依据：dsl-spec v0.2.2 ｜ 来源：models/xgimi/modeling-brief/（单文档内部三源交叉：§4 规则 ↔ §11 附录 ↔ §5 黄金案例）
# 状态：draft（人审是唯一权威，未经确认不得注册生产）
ontology: xgimi
version: 0.1.0-draft.1
base_version: null            # target_engine=new，从零建库
governance:
  owner: 聂江锋（推断自文档"数字化负责人/CIO"，待用户确认）
  maturity: experimental

# 新术语注记（受控词表：target_engine=new 无既有词表，首次入库供人审裁定）
glossary_additions:
  - { term: 策备, definition: 电子料全量需求梳理→供应商备料/策备审批，输出授权外需求与供应商参考清单 }
  - { term: 点检, definition: 前后版本 BOM/风险BOM/替代/授权的自动对比与变化识别 }
  - { term: 呆滞, definition: 评估期末无法消耗的剩余物料风险 }
  - { term: known_at, definition: 记录可见时间，以数据版本号（V0-V3）表达 }
  - { term: FACT-SIM, definition: 事实记录与模拟记录分别保存的情景隔离约定 }
  - { term: 风险 BOM, definition: NPI 阶段经批准的预估 BOM }

# =====================================================================
# 实体（26 个，五层：基础主数据 / BOM 与变更 / 需求与授权 / 供给 / 运行底座与四场景产物 / 历史层）
# =====================================================================
entities:

  # ---------- 一、基础主数据层 ----------
  Project:
    display_name: 项目
    table_name: project
    description: 机型/产品线，需求和 BOM 的挂载主体（如 P-Z9/Z9、P-Z10 仅风险 BOM、P-X8 历史停产）
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      project_id: { display_name: 项目ID, description: 项目唯一编号（如 P-Z9）, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.2 项目表" }
      project_code: { display_name: 项目编码, description: 系统编码（如 100-Z9001）, type: STRING, source: "xgimi-poc-doc.md#§11.2" }
      model_name: { display_name: 机型, description: 机型名称（如 Z9/Z9S/Z10/X8）, type: STRING, source: "xgimi-poc-doc.md#§11.2" }
      stage: { display_name: 项目阶段, description: 量产 MP=量产；NPI-DVT=新品验证；EOL=停产（历史）, type: STRING, enum_values: [MP, NPI-DVT, EOL], source: "xgimi-poc-doc.md#§11.2（量产 MP/NPI-DVT/停产（历史））" }
      bom_status_desc: { display_name: BOM状态说明, description: 该项目当前 BOM 版本状态快照描述（如 标准 v3.2；换料后主板 v2.2）, type: STRING, source: "xgimi-poc-doc.md#§11.2" }
      purpose_desc: { display_name: 用途说明, description: 主线/补充测试/历史案例包等，历史案例包不与当前混算, type: STRING, source: "xgimi-poc-doc.md#§11.2" }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§11.2, reviewed: false }

  Material:
    display_name: 物料
    table_name: material
    description: 最小跟踪单位（WiFi 模组、SoC 等），用于汇总与库存跟踪
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      material_id: { display_name: 物料编码, description: 物料唯一编码（如 300-W6A01、H-WIFI-OLD、UNIT-M）, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.2" }
      material_name: { display_name: 物料名称, description: 如 WiFi5/WiFi6/SoC, type: STRING, source: "xgimi-poc-doc.md#§11.2" }
      base_uom: { display_name: 基本单位, description: 物料基本计量单位（颗/盒）, type: STRING, uom: 计量单位, source: "xgimi-poc-doc.md#§11.8 测试六" }
      unit_cost: { display_name: 演示成本单价, description: 固定演示成本（WiFi5 16 元/颗、WiFi6 20 元/颗），与供应商报价区间分别记录，不代表真实报价, type: DECIMAL, uom: 元/颗, source: "xgimi-poc-doc.md#§11.5" }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§11.2+§11.5, reviewed: false }

  UnitConversion:
    display_name: 单位换算
    table_name: unit_conversion
    description: 已批准的计量单位换算关系（如 1盒=100颗）；移除换算依据后提示缺证，不得将 12 盒当作 12 颗
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      conversion_id: { display_name: 换算关系ID, description: 换算关系唯一编号, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.8 测试六" }
      material_id: { display_name: 物料编码, description: 换算适用的物料, type: STRING, source: "xgimi-poc-doc.md#§11.8 测试六" }
      from_uom: { display_name: 源单位, description: 被换算单位（如 盒）, type: STRING, source: "xgimi-poc-doc.md#§11.8 测试六" }
      to_uom: { display_name: 目标单位, description: 换算目标单位（如 颗，即基本单位）, type: STRING, source: "xgimi-poc-doc.md#§11.8 测试六" }
      ratio: { display_name: 换算比率, description: 1 源单位 = ratio 目标单位（1盒=100颗）, type: DECIMAL, uom: 颗/盒, source: "xgimi-poc-doc.md#§11.8 测试六" }
      approval_status: { display_name: 批准状态, description: 换算关系须为已批准才可参与计算, type: STRING, enum_values: [approved, pending], source: "xgimi-poc-doc.md#§11.8 测试六（批准换算）" }
      evidence_status: { display_name: 证据状态, description: complete=证据齐全；missing=换算依据被移除，缺证提示、不按零处理, type: STRING, enum_values: [complete, missing], source: "xgimi-poc-doc.md#§11.8 测试六" }
    links: { material: Material }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§4.1+§11.8 测试六, reviewed: false }

  Supplier:
    display_name: 供应商
    table_name: supplier
    description: 物料供应商（参考清单的整理维度；参考清单不等于采购订单，默认不外发）
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      supplier_id: { display_name: 供应商编码, description: 供应商唯一编码（如 V-WLINK）, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.5" }
      supplier_name: { display_name: 供应商名称, description: 供应商名称, type: STRING, source: "xgimi-poc-doc.md#§11.5" }
      purchasing_group: { display_name: 采购组, description: 采购组编码（如 206）, type: STRING, source: "xgimi-poc-doc.md#§11.5" }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§11.5, reviewed: false }

  # ---------- 二、BOM 与变更层 ----------
  BomLine:
    display_name: BOM行
    table_name: bom_line
    description: 机型结构清单行（标准/风险/维修 BOM），含版本、层级用量、损耗与生效日期；标准 BOM 与风险 BOM 分开比较，新旧替代料行不得在同一有效 BOM 中同时作为必需组件相加
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      line_id: { display_name: BOM行ID, description: 行唯一编号（如 L-Z9-01、H-BOM-OLD-R1）, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.2 BOM 行表" }
      bom_type: { display_name: BOM类型, description: standard=标准 BOM；risk=风险 BOM（NPI 预批）；maintenance=维修 BOM（售后）, type: STRING, enum_values: [standard, risk, maintenance], source: "xgimi-poc-doc.md#§4.2+§11.8 测试三/七" }
      version: { display_name: BOM版本, description: 所属 BOM 版本（如 整机 v3.2、主板 v2.2、风险 v0.9）, type: STRING, source: "xgimi-poc-doc.md#§11.2" }
      parent_material_id: { display_name: 父项物料编码, description: 父项物料（如 100-Z9001 整机、200-Z9PCB 主板）；不进 links（双链取舍见 assumptions A7）, type: STRING, source: "xgimi-poc-doc.md#§11.2" }
      material_id: { display_name: 子项物料编码, description: BOM 行的子项物料（如 300-W6A01 WiFi6），links 主关联；父项引用以属性承载, type: STRING, source: "xgimi-poc-doc.md#§11.2" }
      project_id: { display_name: 所属项目ID, description: 行所属项目（由项目表"BOM 状态"关联推断，附录行表未单列）, type: STRING, source: "xgimi-poc-doc.md#§11.2（推断，见 assumptions A2）" }
      qty_per: { display_name: BOM行用量, description: 该行子项用量原始值，单位一致后参与计算, type: DECIMAL, uom: 件/台, source: "xgimi-poc-doc.md#§4.2" }
      base_qty: { display_name: BOM基准数量, description: 行用量对应的父项基准数量（如 1/1）, type: DECIMAL, uom: 台, source: "xgimi-poc-doc.md#§4.2" }
      yield_rate: { display_name: 良率, description: 该层良率，仅明确适用的层级计入；没有损耗的层级取 1（主案例良率均设 1，多层损耗见测试五）, type: DOUBLE, uom: 比率, source: "xgimi-poc-doc.md#§4.3 ②+§11.8 测试五" }
      effective_from: { display_name: 生效开始日期, description: 行生效起始日期（如 2026-11-01 起）, type: DATE, source: "xgimi-poc-doc.md#§11.2" }
      effective_to: { display_name: 生效截止日期, description: 行生效截止日期（旧 WiFi 行至 2026-10-31，V1 更新后的有效期）, type: DATE, source: "xgimi-poc-doc.md#§11.2" }
      known_at: { display_name: known_at（可见数据版本）, description: 记录可见时间，取值为数据版本号（V0/V1/V0之前）；版本机制见 DataVersion, type: STRING, source: "xgimi-poc-doc.md#§11.2 known_at 列" }
      evidence_status: { display_name: 证据状态, description: complete=明细齐全；missing=缺证版本移除行明细后标记缺失，依赖它的推导同步不可验证, type: STRING, enum_values: [complete, missing], source: "xgimi-poc-doc.md#§11.6 缺证版本" }
      standard_usage: { display_name: 标准用量, description: 标准 = BOM 行用量 ÷ BOM 基准数量（derived）, type: DECIMAL, uom: 件/台, derived: true, source: "xgimi-poc-doc.md#§4.2 核心判断规则" }
    links: { material: Material, project: Project }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§11.2+§4.2, reviewed: false }

  EcnRecord:
    display_name: 工程变更记录
    table_name: ecn_record
    description: 工程变更（ECN）记录（如 Z9 换料 ECN：WiFi5 退出、WiFi6 引入、11-01 生效）；缺证版本保留引用编号但批准文件与变更后 BOM 明细标记缺失
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      ecn_id: { display_name: 工程变更ID, description: 变更唯一编号（历史案例如 H-ECN-01；主案例编号文档未给出，见 OQ-10）, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.6" }
      project_id: { display_name: 所属项目ID, description: 变更所属项目, type: STRING, source: "xgimi-poc-doc.md#§11.1 V1" }
      change_desc: { display_name: 变更内容, description: 变更描述（换料：WiFi5 退出、WiFi6 引入）, type: STRING, source: "xgimi-poc-doc.md#§5.3.1" }
      publish_date: { display_name: 发布日期, description: 变更发布日期（V1=2026-09-29）, type: DATE, source: "xgimi-poc-doc.md#§11.1" }
      effective_date: { display_name: 生效日期, description: 变更生效日期（2026-11-01）, type: DATE, source: "xgimi-poc-doc.md#§11.1" }
      approval_status: { display_name: 批准状态, description: approved=已批准；pending=待批准, type: STRING, enum_values: [approved, pending], source: "xgimi-poc-doc.md#§11.6（已批准的工程切换）" }
      evidence_status: { display_name: 证据状态, description: complete=批准文件与变更后 BOM 明细齐全；missing=引用编号保留但批准文件缺失，依赖推导不可验证, type: STRING, enum_values: [complete, missing], source: "xgimi-poc-doc.md#§5.4.6" }
      known_at: { display_name: known_at（可见数据版本）, description: 记录可见数据版本（如 V1）, type: STRING, source: "xgimi-poc-doc.md#§11.1" }
    links: { project: Project }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§11.1+§11.6+§5.4.6, reviewed: false }

  # ---------- 三、需求与授权层 ----------
  Demand:
    display_name: 需求
    table_name: demand
    description: 各项目需要数量与日期（订单/MPS/预测/售后维修），覆盖关系明确；同 ID 新版本替换旧版本、不追加计数
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      demand_id: { display_name: 需求ID, description: 需求唯一编号（如 DEM-Z9-NOV、ORD-Z9-NOV、FCST-Z9-NOV）, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.2 需求表" }
      demand_version: { display_name: 需求版本, description: 同一需求的版本（v1/v2），v2 替换 v1 而非追加；与 demand_id 构成复合主键, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.2（DEM-Z9-DEC v1/v2）" }
      project_id: { display_name: 项目ID, description: 需求归属项目, type: STRING, source: "xgimi-poc-doc.md#§11.2" }
      need_date: { display_name: 需要日期, description: 物料需要可用的日期（非客户交货日期，如 2026-11-30）, type: DATE, source: "xgimi-poc-doc.md#§11.1+§11.2" }
      demand_qty: { display_name: 需求数量, description: 需求数量（台/件）, type: DECIMAL, uom: 台, source: "xgimi-poc-doc.md#§11.2" }
      source_type: { display_name: 需求来源, description: MPS=已确认生产计划；order=客户订单；forecast=早期预测；service=售后维修需求, type: STRING, enum_values: [MPS, order, forecast, service], source: "xgimi-poc-doc.md#§11.2+§11.8 测试七" }
      covered_by_demand_id: { display_name: 被覆盖于需求ID, description: 覆盖关系：本需求已包含于哪条需求（ORD-Z9-NOV covered_by=DEM-Z9-NOV）；无覆盖依据时不得仅凭来源优先级舍弃；以属性承载、不建 links（复合主键目标，见 assumptions A7 与 OQ-03）, type: STRING, source: "xgimi-poc-doc.md#§11.2+§4.3 ①" }
      status: { display_name: 需求状态, description: confirmed=已确认参与计算；superseded=已被新版本替换；reference=仅作参考（被替换的早期预测）, type: STRING, enum_values: [confirmed, superseded, reference], source: "xgimi-poc-doc.md#§11.2" }
      known_at: { display_name: known_at（可见数据版本）, description: 记录可见数据版本（V0/V3）, type: STRING, source: "xgimi-poc-doc.md#§11.2" }
      package_id: { display_name: 所属数据包ID, description: 所属数据包（主案例/历史案例/补充测试互不混算）, type: STRING, source: "xgimi-poc-doc.md#§11（每条记录具有唯一编号、所属数据包和版本）" }
    links: { project: Project }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§11.2+§4.3 ①, reviewed: false }

  MaterialAuthorization:
    display_name: 物料授权
    table_name: material_authorization
    description: 整机料号维度的供应商备料授权（对应卫国策备表口径）；授权仅是审批覆盖口径，不构成物理供给，不得因授权增加而新增供给；新版本替换旧版本
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      auth_id: { display_name: 授权ID, description: 授权记录唯一编号, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.8 测试四（授权 v1/v2）" }
      auth_version: { display_name: 授权版本, description: 授权版本（v1/v2），v2 覆盖并替换 v1；与 auth_id 构成复合主键, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.8 测试四" }
      material_id: { display_name: 物料编码, description: 被授权物料, type: STRING, source: "xgimi-poc-doc.md#§2.1 场景24" }
      project_id: { display_name: 授权对象项目ID, description: 授权覆盖的整机项目/产品, type: STRING, source: "xgimi-poc-doc.md#§11.8 测试四（覆盖 N 台）" }
      covered_qty: { display_name: 授权覆盖量, description: 授权覆盖的数量（如 v1 覆盖 10,000 台、v2 覆盖 6,000 台）, type: DECIMAL, uom: 台, source: "xgimi-poc-doc.md#§11.8 测试四" }
      approval_status: { display_name: 批准状态, description: approved=已批准（10月1日批准）；pending=待批准, type: STRING, enum_values: [approved, pending], source: "xgimi-poc-doc.md#§11.8 测试四" }
      effective_from: { display_name: 生效开始日期, description: 授权生效起始日期, type: DATE, source: "xgimi-poc-doc.md#§11.8 测试四" }
      known_at: { display_name: known_at（可见数据版本）, description: 记录可见数据版本, type: STRING, source: "xgimi-poc-doc.md#§11.8 测试四" }
      package_id: { display_name: 所属数据包ID, description: 所属数据包, type: STRING, source: "xgimi-poc-doc.md#§11" }
    links: { material: Material, project: Project }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§4.3 步骤6+§11.8 测试四+§8 红线, reviewed: false }

  # ---------- 四、供给层 ----------
  Supply:
    display_name: 供给记录
    table_name: supply
    description: 物理供给条目（可用库存/质检冻结库存/已确认未收货订单/模拟采购）；质检冻结不参与供给单列待核查；模拟供给只存在于 SIM 情景、不得写入 FACT
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      supply_id: { display_name: 供给ID, description: 供给唯一编号（PS-1001/SIM-W6-9000/ST-R1）, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.3 供给表" }
      material_id: { display_name: 物料编码, description: 供给物料, type: STRING, source: "xgimi-poc-doc.md#§11.3" }
      supply_type: { display_name: 供给类型, description: available_stock=可用库存；frozen_stock=质检冻结库存；open_order=已确认未收货订单；simulated_purchase=模拟采购（仅 SIM）, type: STRING, enum_values: [available_stock, frozen_stock, open_order, simulated_purchase], source: "xgimi-poc-doc.md#§11.3+§11.1" }
      qty: { display_name: 供给数量, description: 供给数量（颗）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§11.3" }
      available_date: { display_name: 可用或到货日, description: 供给可用/确认到货日期；库存类取数据版本可见日（V0 映射见 assumptions A1）；未确定时缺省并由 evidence 语义约束, type: DATE, source: "xgimi-poc-doc.md#§11.3（可用或到货日列）" }
      restriction_desc: { display_name: 限制说明, description: 使用限制（如 仅按 A.4 临时许可使用/未获放行不参与供给/不能满足 11 月）, type: STRING, source: "xgimi-poc-doc.md#§11.3 限制列" }
      po_id: { display_name: 关联订单号, description: 订单类供给指向的采购订单（库存类为空）, type: STRING, source: "xgimi-poc-doc.md#§11.3（类型=已确认未收货订单）" }
      scenario_tag: { display_name: 情景标签, description: FACT=事实记录；SIM=模拟记录；事实与模拟分别保存，模拟供给不得写入 FACT, type: STRING, enum_values: [FACT, SIM], source: "xgimi-poc-doc.md#§11.1" }
      package_id: { display_name: 所属数据包ID, description: 所属数据包（主案例/历史/测试包独立）, type: STRING, source: "xgimi-poc-doc.md#§11" }
      known_at: { display_name: known_at（可见数据版本）, description: 记录可见数据版本（六条供给均在 V0 可见）, type: STRING, source: "xgimi-poc-doc.md#§11.3" }
      exclude_reason: { display_name: 排除原因, description: 不参与供给分配的原因（质检冻结：未获放行，单列待核查，不认定零风险或全额损失）, type: STRING, source: "xgimi-poc-doc.md#§11.3 PS-1002" }
    links: { material: Material, po: PurchaseOrder }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§11.3+§11.1, reviewed: false }

  PurchaseOrder:
    display_name: 采购订单
    table_name: purchase_order
    description: 采购订单承诺与取消/延期条款（未到货供给的订单侧）；取消权限、数量上限及延期条件须为已有书面模拟证据，不能在计算出结果后临时补设
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      po_id: { display_name: 订单号, description: 订单唯一编号（PO-R1；PS-3002 对应订单）, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.3+§11.8 测试八" }
      material_id: { display_name: 物料编码, description: 订单物料, type: STRING, source: "xgimi-poc-doc.md#§11.3" }
      order_qty: { display_name: 订单数量, description: 订单总量（如 8,000 颗）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.3 ③" }
      cumulative_receipt_qty: { display_name: 累计有效收货量, description: 累计有效收货数量；明确为 0 与未导入不同（assumptions A4）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.3 ③" }
      cancelled_qty: { display_name: 已取消量, description: 已执行取消的数量, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.3 ③" }
      closed_unreceived_qty: { display_name: 已关闭未收余量, description: 已关闭订单的未收余量（收货转库存后不再按原未收货数量重复计入）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.3 ③" }
      confirmed_arrival_date: { display_name: 确认到货日, description: 订单确认到货日期（2026-11-20/12-20）, type: DATE, source: "xgimi-poc-doc.md#§11.3" }
      cancel_deadline: { display_name: 取消截止日, description: 取消窗口截止日（2026-10-15），过后不再具备取消资格, type: DATE, source: "xgimi-poc-doc.md#§11.3 PS-3002" }
      cancel_fee_per_unit: { display_name: 取消费单价, description: 每颗取消费用（1 元/颗）, type: DECIMAL, uom: 元/颗, source: "xgimi-poc-doc.md#§11.3" }
      cancel_limit_qty: { display_name: 可取消数量上限, description: 按权限最多可取消数量（PS-3002 最多 2,000 颗）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§11.3" }
      postpone_allowed: { display_name: 是否允许整单延期, description: true=供应商允许整单延期至 postpone_deadline, type: BOOLEAN, source: "xgimi-poc-doc.md#§11.3（可整单延期至 2027-01-15）" }
      postpone_deadline: { display_name: 延期后到货日, description: 延期方案的新到货日期（2027-01-15）, type: DATE, source: "xgimi-poc-doc.md#§11.3" }
      postpone_fee: { display_name: 延期费用, description: 延期方案费用（本例设为 0，为演示输入）, type: DECIMAL, uom: 元, source: "xgimi-poc-doc.md#§11.3" }
      status: { display_name: 订单状态, description: confirmed=已确认；closed=已关闭；cancelled=已取消, type: STRING, enum_values: [confirmed, closed, cancelled], source: "xgimi-poc-doc.md#§4.3 ③（根据状态、可用日期和占用情况）" }
      unreceived_qty: { display_name: 订单未收货量, description: 未收货量 = max(订单数量−累计有效收货量−已取消量−已关闭未收余量, 0)（derived）, type: DECIMAL, uom: 颗, derived: true, source: "xgimi-poc-doc.md#§4.3 ③ 公式" }
      package_id: { display_name: 所属数据包ID, description: 所属数据包, type: STRING, source: "xgimi-poc-doc.md#§11" }
      known_at: { display_name: known_at（可见数据版本）, description: 记录可见数据版本, type: STRING, source: "xgimi-poc-doc.md#§11.3" }
    links: { material: Material }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§4.3 ③+§11.3, reviewed: false }

  StockMovement:
    display_name: 库存流水
    table_name: stock_movement
    description: 库存出入库流水（收货/领用/退货/报废/调整/调拨），分类互斥、调拨和处置不得重复计算；每条记录在对应日期发生后才可用于事实还原，不能用于此前的历史决策判断
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      movement_id: { display_name: 流水ID, description: 流水唯一编号, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.6 实际流水" }
      case_id: { display_name: 所属案例ID, description: 关联的历史呆滞案例（waterfall 还原）, type: STRING, source: "xgimi-poc-doc.md#§11.6" }
      material_id: { display_name: 物料编码, description: 流水物料, type: STRING, source: "xgimi-poc-doc.md#§11.6" }
      movement_type: { display_name: 流水类型, description: receipt=收货入库；issue=生产领用；return=退货；scrap=报废；adjust=其他调整；transfer=调拨（互斥分类）, type: STRING, enum_values: [receipt, issue, return, scrap, adjust, transfer], source: "xgimi-poc-doc.md#§11.6+§4.5 ①" }
      movement_qty: { display_name: 流水数量, description: 出入库数量，入库为正、出库为负（waterfall 逐项展示增加和减少）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§5.4.3" }
      movement_date: { display_name: 流水日期, description: 发生日期（发生后方可用于事实还原）, type: DATE, source: "xgimi-poc-doc.md#§11.6" }
      evidence_status: { display_name: 证据状态, description: complete/missing；流水覆盖完整观察区间，缺证时只输出可确认事实, type: STRING, enum_values: [complete, missing], source: "xgimi-poc-doc.md#§11.6" }
      known_at: { display_name: known_at（可见数据版本）, description: 记录可见数据版本/时点, type: STRING, source: "xgimi-poc-doc.md#§11.6" }
    links: { case: HistoricalCase, material: Material }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§11.6+§5.4.3, reviewed: false }

  SubstitutionPermission:
    display_name: 替代与转用许可
    table_name: substitution_permission
    description: 物料间可替换规则及批准条件（替代/转用通道）；检查方向、适用项目、批次、有效期、可用日期、换算比例和批准上限后才可参与分配；失效替代关系保留问题记录但不得参与替代计算
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      permission_id: { display_name: 许可ID, description: 许可唯一编号（SUB-01 临时许可替代/SUB-02 售后转用）, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.4 替代及转用表" }
      permission_type: { display_name: 许可类型, description: substitution=替代（旧料替代新料需求）；transfer=跨项目/售后转用, type: STRING, enum_values: [substitution, transfer], source: "xgimi-poc-doc.md#§11.4" }
      material_id: { display_name: 原料编码, description: 被替代/转出的原物料（WiFi5），links 主关联；替代料引用以属性承载, type: STRING, source: "xgimi-poc-doc.md#§11.4" }
      substitute_material_id: { display_name: 替代料编码, description: 被替代满足的物料需求侧（WiFi6）；不进 links（双链取舍见 assumptions A7）, type: STRING, source: "xgimi-poc-doc.md#§11.4" }
      project_id: { display_name: 适用项目ID, description: 许可仅适用的项目（SUB-01 仅 Z9；不代表新旧物料可任意互换）, type: STRING, source: "xgimi-poc-doc.md#§11.4" }
      conversion_ratio: { display_name: 换算比例, description: 替代换算比例（1:1）, type: DECIMAL, uom: 颗/颗, source: "xgimi-poc-doc.md#§11.4" }
      batch_limit_qty: { display_name: 批次限量, description: 指定库存批次总量上限（指定批次共 6,000 颗）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§11.4" }
      approved_usage_qty: { display_name: 批准用量上限, description: 最多允许使用的数量（SUB-02 最多 2,000 颗）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§11.4" }
      supply_id: { display_name: 绑定供给ID, description: 许可绑定的供给批次（SUB-01 指定库存批次/SUB-02 允许使用 PS-3002）, type: STRING, source: "xgimi-poc-doc.md#§11.4" }
      effective_from: { display_name: 生效开始日期, description: 许可生效起始（2026-11-01）, type: DATE, source: "xgimi-poc-doc.md#§11.4" }
      effective_to: { display_name: 生效截止日期, description: 许可到期日（11-30 到期；到货晚于到期日的供给不能用于补偿）, type: DATE, source: "xgimi-poc-doc.md#§11.4" }
      approval_status: { display_name: 批准状态, description: approved=已批准；expired=已失效, type: STRING, enum_values: [approved, expired], source: "xgimi-poc-doc.md#§11.4" }
      known_at: { display_name: known_at（可见数据版本）, description: 记录可见数据版本（测试七记录均在 2026-10-02 09:00 已知）, type: STRING, source: "xgimi-poc-doc.md#§11.8 测试七" }
      package_id: { display_name: 所属数据包ID, description: 所属数据包（SUB-02 属独立测试包）, type: STRING, source: "xgimi-poc-doc.md#§11.4" }
    links: { material: Material, project: Project, supply: Supply }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§11.4+§5.2, reviewed: false }

  SupplierSupplyCondition:
    display_name: 供应商供货条件
    table_name: supplier_supply_condition
