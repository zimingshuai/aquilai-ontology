      supplier_id: { display_name: 供应商编码, description: 供应商, type: STRING, source: "xgimi-poc-doc.md#§11.5" }
      material_id: { display_name: 物料编码, description: 供应物料, type: STRING, source: "xgimi-poc-doc.md#§11.5" }
      lead_time_weeks: { display_name: 交期（周）, description: 交期周数（8 周日历周）, type: INTEGER, uom: 周, source: "xgimi-poc-doc.md#§11.5" }
      moq: { display_name: 最小起订量, description: MOQ（5,000 颗）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§11.5" }
      order_multiple: { display_name: 订购倍数, description: 订购倍数（1,000 颗），取整产生的额外数量单独展示并纳入风险评估, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§11.5+§4.3 ⑤" }
      share_ratio: { display_name: 分配份额, description: 供应商分配份额（100%；双供应商 70%/30% 为取整前目标，实际比例另行显示）, type: DECIMAL, uom: "%", source: "xgimi-poc-doc.md#§11.5+§11.8 测试一" }
      approval_status: { display_name: 批准状态, description: approved=已批准供货（两家均已批准，无另设产能上限）, type: STRING, enum_values: [approved, pending], source: "xgimi-poc-doc.md#§11.8 测试一" }
    links: { supplier: Supplier, material: Material }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§11.5+§11.8 测试一, reviewed: false }

  # ---------- 五、运行底座层 ----------
  DataVersion:
    display_name: 数据版本
    table_name: data_version
    description: 数据包版本（V0-V3）：可见时间与新增/修改内容；V1 保存终止日期的变更版本，不能修改 V0 历史记录；V2 为策备运行快照、不代表新增事实采购订单
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      version_id: { display_name: 版本号, description: 数据版本号（V0/V1/V2/V3）, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.1 版本表" }
      visible_at: { display_name: 可见时间, description: 该版本数据可见的时间点（V0=2026-09-28 06:00）, type: TIMESTAMP, source: "xgimi-poc-doc.md#§11.1" }
      change_summary: { display_name: 变更内容摘要, description: 新增或修改内容描述（V1 发布 Z9 换料 ECN 与一次性旧料使用许可）, type: STRING, source: "xgimi-poc-doc.md#§11.1" }
      package_id: { display_name: 所属数据包ID, description: 版本所属数据包, type: STRING, source: "xgimi-poc-doc.md#§11" }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§11.1, reviewed: false }

  CalculationRun:
    display_name: 计算运行快照
    table_name: calculation_run
    description: 每次计算运行的快照（观察时间/输入版本/规则版本/情景编号/评估期间）；支持追溯与复算，历史决策判断只使用当时已知的信息
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      run_id: { display_name: 运行ID, description: 运行唯一编号（V2 策备运行）, type: STRING, primary: true, source: "xgimi-poc-doc.md#§4.1 统一计算约定" }
      run_type: { display_name: 运行类型, description: inspection=点检对比；sourcing=策备计算；risk_simulation=呆滞模拟；historical_replay=历史回放, type: STRING, enum_values: [inspection, sourcing, risk_simulation, historical_replay], source: "xgimi-poc-doc.md#§3 整体流程" }
      package_id: { display_name: 所属数据包ID, description: 本次运行使用的数据包（主案例/历史案例/补充测试独立）, type: STRING, source: "xgimi-poc-doc.md#§4.1 方案独立" }
      scenario_tag: { display_name: 情景标签, description: FACT=事实分支；SIM=模拟分支（同一前提下的模拟采购分支等分别保存，不共享失去依据的推导结果）, type: STRING, enum_values: [FACT, SIM], source: "xgimi-poc-doc.md#§11.1 各分支表" }
      observed_at: { display_name: 观察时间, description: 本次运行指定的观察时间（2026-09-30 09:00），只使用观察时间已知的信息, type: TIMESTAMP, source: "xgimi-poc-doc.md#§4.1 时间明确" }
      version_id: { display_name: 输入数据版本号, description: 本次运行使用的输入数据版本（V1/V3，指向 DataVersion 主键）, type: STRING, source: "xgimi-poc-doc.md#§4.1" }
      rule_version: { display_name: 规则版本, description: 本次运行使用的规则版本, type: STRING, source: "xgimi-poc-doc.md#§4.1" }
      evaluation_period_from: { display_name: 评估期间起, description: 评估期间起始日（2026-11-01）, type: DATE, source: "xgimi-poc-doc.md#§11.1" }
      evaluation_period_to: { display_name: 评估期间止, description: 评估期间截止日（2026-12-31）, type: DATE, source: "xgimi-poc-doc.md#§11.1" }
    links: { input_data_version: DataVersion }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§4.1+§11.1, reviewed: false }

  MaterialRequirement:
    display_name: 物料需求汇总
    table_name: material_requirement
    description: 策备计算在物料粒度的汇总结果：毛需求、替代满足、已分配供给、授权覆盖与物理缺口分列展示；授权覆盖量与物理供给完全分离（授权≠物理供给）
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      req_id: { display_name: 汇总ID, description: 汇总记录唯一编号, type: STRING, primary: true, source: "xgimi-poc-doc.md#§4.3 ②④" }
      run_id: { display_name: 运行ID, description: 归属计算运行（追溯与复算）, type: STRING, source: "xgimi-poc-doc.md#§4.1 结果可追溯" }
      material_id: { display_name: 物料编码, description: 汇总物料, type: STRING, source: "xgimi-poc-doc.md#§4.3 ②" }
      gross_qty: { display_name: 物料毛需求, description: 各项目、各有效 BOM 路径产生的需求之和（多级 BOM 运行时展开，见 OQ-02）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.3 ②" }
      substitute_satisfied_qty: { display_name: 替代满足量, description: 符合批准范围、供给可用量和需求上限的实际替代分配量（SUB-01 全部计入 11 月 Z9 补偿 6,000）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.3 ④" }
      allocated_supply_qty: { display_name: 已分配供给量, description: 按期可用的直接新料供给已分配量（主案例 15,000）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.3 ④" }
      authorized_coverage_qty: { display_name: 已授权覆盖量, description: 生效授权版本的覆盖量合计（运行时按 v2 替换 v1 口径选择，见 OQ-08）；授权不作为物理供给, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.3 步骤6+§11.8 测试四" }
      unit_price: { display_name: 参考单价, description: 待授权参考金额使用的单价（20 元/颗）, type: DECIMAL, uom: 元/颗, source: "xgimi-poc-doc.md#§11.8 测试四" }
      remaining_material_qty: { display_name: 剩余新料需求, description: 剩余新料需求 = 物料毛需求 − 替代满足量（derived）, type: DECIMAL, uom: 颗, derived: true, source: "xgimi-poc-doc.md#§4.3 ④ 公式" }
      physical_gap_qty: { display_name: 物理缺口, description: 新料缺口 = max(剩余新料需求 − 已分配新料供给, 0)（derived）；不得因授权增加而新增供给, type: DECIMAL, uom: 颗, derived: true, source: "xgimi-poc-doc.md#§4.3 ④ 公式+§11.8 测试四" }
      pending_auth_qty: { display_name: 待授权数量, description: 待授权 = max(毛需求 − 已授权覆盖量, 0)（derived；测试四 18,000−10,000=8,000）, type: DECIMAL, uom: 颗, derived: true, source: "xgimi-poc-doc.md#§11.8 测试四" }
      pending_auth_amount: { display_name: 待授权参考金额, description: 待授权数量 × 参考单价（derived；8,000×20=160,000 元）, type: DECIMAL, uom: 元, derived: true, source: "xgimi-poc-doc.md#§11.8 测试四" }
    links: { run: CalculationRun, material: Material }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§4.3+§11.8 测试四, reviewed: false }

  # ---------- 六、点检层（场景39） ----------
  InspectionChange:
    display_name: 点检变化记录
    table_name: inspection_change
    description: 点检自动对比识别的前后版本变化（六类变化）；同一项变化通过多条关系影响同一业务对象时合并为一条影响记录、保留多条依据
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      change_id: { display_name: 变化ID, description: 变化记录唯一编号, type: STRING, primary: true, source: "xgimi-poc-doc.md#§4.2 输出（变化清单）" }
      change_type: { display_name: 变化类型, description: material_add/material_remove=物料新增或删除；usage_change=用量变化；uom_change=单位变化；effective_date_change=生效日期变化；substitution_change=替代关系变化；auth_qty_change=授权数量变化, type: STRING, enum_values: [material_add, material_remove, usage_change, uom_change, effective_date_change, substitution_change, auth_qty_change], source: "A_schema/inspection-rules.csv（六类变化）" }
      object_type: { display_name: 变化对象类型, description: bom=标准 BOM；risk_bom=风险 BOM（分开比较）；substitution=替代关系；authorization=授权, type: STRING, enum_values: [bom, risk_bom, substitution, authorization], source: "xgimi-poc-doc.md#§4.2 步骤1" }
      run_id: { display_name: 发现运行ID, description: 识别该变化的点检运行, type: STRING, source: "xgimi-poc-doc.md#§4.2" }
      before_line_id: { display_name: 前版本行ID, description: 变化前的 BOM 行（可空：新增时无前版本）；不进 links（双链取舍见 assumptions A7）, type: STRING, source: "xgimi-poc-doc.md#§4.2 步骤2" }
      line_id: { display_name: 后版本行ID, description: 变化后的 BOM 行（links 主关联；可空：删除时无后版本）, type: STRING, source: "xgimi-poc-doc.md#§4.2 步骤2" }
      before_value: { display_name: 前值, description: 变化前的值（用量/生效日期/授权数量等，原始记录）, type: STRING, source: "A_schema/inspection-rules.csv 判断方法列" }
      after_value: { display_name: 后值, description: 变化后的值, type: STRING, source: "A_schema/inspection-rules.csv 判断方法列" }
      judgment_basis: { display_name: 判断依据, description: 判断方法与依据保留（在单位和基准数量一致后比较标准用量等）, type: STRING, source: "xgimi-poc-doc.md#§4.2 步骤4" }
      impact_desc: { display_name: 影响明细, description: 受影响的项目、物料、需求和供给（如 12 月到货 4,000 颗旧料不符合临时许可需复核采购安排）, type: STRING, source: "xgimi-poc-doc.md#§4.2 步骤3-4" }
      known_at: { display_name: known_at（可见数据版本）, description: 变化记录可见数据版本, type: STRING, source: "xgimi-poc-doc.md#§4.2" }
    links: { detection_run: CalculationRun, line: BomLine }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§4.2+A_schema/inspection-rules.csv, reviewed: false }

  ReviewTask:
    display_name: 复核任务
    table_name: review_task
    description: 点检变化生成的复核任务；任务只有在收到取消、调整或明确保留的处理依据后才能关闭，不能把"已通知"当作"已解决"
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      task_id: { display_name: 任务ID, description: 任务唯一编号, type: STRING, primary: true, source: "xgimi-poc-doc.md#§4.2 输出（复核任务）" }
      change_id: { display_name: 变化ID, description: 任务来源的变化记录, type: STRING, source: "xgimi-poc-doc.md#§4.2 步骤4" }
      task_desc: { display_name: 任务描述, description: 复核内容描述, type: STRING, source: "xgimi-poc-doc.md#§4.2" }
      status: { display_name: 任务状态, description: open=待处理；cancelled/adjusted/retained=已收到处理依据；closed=已关闭, type: STRING, enum_values: [open, cancelled, adjusted, retained, closed], source: "xgimi-poc-doc.md#§5.4.7" }
      resolution_basis: { display_name: 处理记录, description: 关闭依据（取消/调整/明确保留的处理依据与判断记录）, type: STRING, source: "xgimi-poc-doc.md#§4.2 步骤4+§5.4.7" }
    links: { change: InspectionChange }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§4.2+§5.4.7, reviewed: false }

  # ---------- 七、策备输出层（场景24） ----------
  SourcingSuggestion:
    display_name: 策备建议
    table_name: sourcing_suggestion
    description: 对剩余缺口的策备建议（按供应商条件形成初步分配再检查订购条件）；数量计算和交期检查分别输出，到货晚于需求日期的建议不视为解决当期缺料
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      suggestion_id: { display_name: 建议ID, description: 建议唯一编号, type: STRING, primary: true, source: "xgimi-poc-doc.md#§4.3 ⑤" }
      run_id: { display_name: 运行ID, description: 归属策备运行（V2）, type: STRING, source: "xgimi-poc-doc.md#§11.1" }
      material_id: { display_name: 物料编码, description: 建议物料, type: STRING, source: "xgimi-poc-doc.md#§4.3 ⑤" }
      supplier_id: { display_name: 供应商编码, description: 初步分配的供应商, type: STRING, source: "xgimi-poc-doc.md#§4.3 ⑤" }
      list_id: { display_name: 参考清单ID, description: 所属供应商参考清单, type: STRING, source: "xgimi-poc-doc.md#§4.3 ⑤（按供应商整理）" }
      allocated_qty: { display_name: 供应商分配量, description: 按份额/资格/交期形成的初步分配量（8,400/3,600）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§11.8 测试一" }
      suggested_qty: { display_name: 建议量, description: 建议量 = 按订购倍数向上取整〔max(分配量, 最小起订量)〕（9,000/4,000）；向上取整超出方言白名单，由运行时计算契约承载（OQ-01），不设 derived 标记, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.3 ⑤ 公式" }
      rounding_extra_qty: { display_name: 取整增量, description: 取整产生的额外数量单独展示并纳入后续风险评估（总建议 13,000 多出 1,000）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.3 ⑤+§11.8 测试一" }
      expected_arrival_date: { display_name: 预计到货日, description: 按 9 月 30 日下单推算的到货日（2027-01-20/02-03）；晚于需求日期不视为解决当期缺料, type: DATE, source: "xgimi-poc-doc.md#§11.8 测试一+§4.3 ⑤" }
    links: { run: CalculationRun, material: Material, supplier: Supplier, list: VendorReferenceList }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§4.3 ⑤+§11.8 测试一, reviewed: false }

  VendorReferenceList:
    display_name: 供应商参考清单
    table_name: vendor_reference_list
    description: 按供应商整理的策备参考清单，供内部审核；参考清单不等同于采购订单，默认不可直接外发，不自动转换为可用供给
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      list_id: { display_name: 清单ID, description: 清单唯一编号, type: STRING, primary: true, source: "xgimi-poc-doc.md#§3 流程③" }
      run_id: { display_name: 运行ID, description: 归属策备运行, type: STRING, source: "xgimi-poc-doc.md#§4.3 ⑤" }
      supplier_id: { display_name: 供应商编码, description: 清单所属供应商, type: STRING, source: "xgimi-poc-doc.md#§3 流程③" }
      status: { display_name: 清单状态, description: draft=草拟；internal_review=内部审核；archived=归档；不外发（外发审批流程未定义，见 OQ-11）, type: STRING, enum_values: [draft, internal_review, archived], source: "xgimi-poc-doc.md#§3+§8 红线" }
      created_at: { display_name: 生成日期, description: 清单生成日期, type: DATE, source: "xgimi-poc-doc.md#§4.3 ⑤" }
    links: { run: CalculationRun, supplier: Supplier }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§3 流程③+§8, reviewed: false }

  # ---------- 八、呆滞模拟层（场景51） ----------
  PeriodSupplyBalance:
    display_name: 分期供需
    table_name: period_supply_balance
    description: 按期间（11 月/12 月）分列的供需平衡：第一期期初取观察时间可用库存，后续期初=上期期末（结转由运行时承载，OQ-05）；初始库存只计入一次，未满足需求保留为逾期需求、结转不得重复累计
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      balance_id: { display_name: 平衡记录ID, description: 分期供需记录唯一编号, type: STRING, primary: true, source: "xgimi-poc-doc.md#§4.4 ①" }
      run_id: { display_name: 运行ID, description: 归属风险模拟运行, type: STRING, source: "xgimi-poc-doc.md#§4.4" }
      material_id: { display_name: 物料编码, description: 平衡物料（新料/旧料分开列示）, type: STRING, source: "xgimi-poc-doc.md#§11.7 预期结果表" }
      period_label: { display_name: 期间, description: 期间标签（2026-11/2026-12）, type: STRING, source: "xgimi-poc-doc.md#§11.7" }
      beginning_qty: { display_name: 本期期初量, description: 第一期取观察时间可用库存，后续各期=上期期末量, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.4 ①" }
      arrival_qty: { display_name: 本期有效到货, description: 本期有效到货数量, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.4 ①" }
      other_inflow_qty: { display_name: 其他有效流入, description: 本期其他有效流入数量, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.4 ①" }
      required_qty: { display_name: 本期应满足需求, description: 本期应满足的需求数量, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.4 ①" }
      demand_satisfied_qty: { display_name: 实际满足需求量, description: 本期实际满足的需求数量, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.4 ①" }
      other_outflow_qty: { display_name: 其他有效流出, description: 本期其他有效流出数量, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.4 ①" }
      unmet_demand_qty: { display_name: 本期未满足需求, description: 本期未满足需求 = 本期应满足需求 − 实际满足需求量（derived）；保留为逾期需求结转不重复累计, type: DECIMAL, uom: 颗, derived: true, source: "xgimi-poc-doc.md#§4.4 ① 公式" }
      ending_qty: { display_name: 本期期末量, description: 期末量 = 期初 + 本期有效到货 + 其他有效流入 − 实际满足需求量 − 其他有效流出（derived）, type: DECIMAL, uom: 颗, derived: true, source: "xgimi-poc-doc.md#§4.4 ① 公式" }
    links: { run: CalculationRun, material: Material }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§4.4 ①+§11.7, reviewed: false }

  SlowMovingRisk:
    display_name: 呆滞风险
    table_name: slow_moving_risk
    description: 评估期末可能无法消耗的物料风险，区分现有库存与未到货订单风险分别说明；保留量与期后消耗量不能重复覆盖同一用途，也不能仅凭"以后可能会用"扣减风险
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      risk_id: { display_name: 风险ID, description: 风险记录唯一编号, type: STRING, primary: true, source: "xgimi-poc-doc.md#§4.4 ②" }
      run_id: { display_name: 运行ID, description: 归属风险模拟运行, type: STRING, source: "xgimi-poc-doc.md#§4.4" }
      material_id: { display_name: 物料编码, description: 风险物料, type: STRING, source: "xgimi-poc-doc.md#§4.4 ②" }
      risk_source_type: { display_name: 风险来源类型, description: stock=现有库存风险；open_order=未到货订单风险（两种风险分开说明；风险可以先出现在未到货订单上）, type: STRING, enum_values: [stock, open_order], source: "xgimi-poc-doc.md#§4.4 步骤2+§5.4.2" }
      ending_remaining_qty: { display_name: 评估期末剩余量, description: 评估期末的剩余数量（S0 旧料 4,000/新料 1,200）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.4 ②+§11.7" }
      reserved_qty: { display_name: 经确认的保留量, description: 经确认的保留数量（主案例为 0）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.4 ②" }
      post_period_consumed_qty: { display_name: 经证实的期后消耗量, description: 经证实的评估期后消耗数量（无经证实用途时为 0）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.4 ②" }
      unit_cost: { display_name: 成本单价, description: 对应成本单价（WiFi5 16 元/颗、WiFi6 20 元/颗演示成本）, type: DECIMAL, uom: 元/颗, source: "xgimi-poc-doc.md#§4.4 ④+§11.5" }
      risk_qty: { display_name: 期末风险量, description: 风险量 = max(评估期末剩余量 − 经确认的保留量 − 经证实的期后消耗量, 0)（derived）, type: DECIMAL, uom: 颗, derived: true, source: "xgimi-poc-doc.md#§4.4 ② 公式" }
      risk_amount: { display_name: 风险金额, description: 风险金额 = 风险数量 × 对应成本单价（derived）；不等于减值损失或实际收益，预计损失另行结合回收价值与处置方式计算, type: DECIMAL, uom: 元, derived: true, source: "xgimi-poc-doc.md#§4.4 ④ 公式" }
    links: { run: CalculationRun, material: Material }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§4.4+§11.7, reviewed: false }

  SolutionPlan:
    display_name: 处理方案
    table_name: solution_plan
    description: 呆滞处理方案（取消/延期/替代消耗/转用）及其重算结果对比；不得用"原风险量减措施数量"代替完整计算；延期至评估期外的供给单独展示后续承诺、不视为消失
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      plan_id: { display_name: 方案ID, description: 方案唯一编号, type: STRING, primary: true, source: "xgimi-poc-doc.md#§4.4 ③" }
      run_id: { display_name: 运行ID, description: 归属风险模拟运行, type: STRING, source: "xgimi-poc-doc.md#§4.4" }
      plan_code: { display_name: 方案编号, description: 方案代号（S0 不处理/S1 按权限取消 2,000/S2 整单延期）, type: STRING, source: "xgimi-poc-doc.md#§11.7 方案表" }
      action_type: { display_name: 措施类型, description: none=不处理；cancel=取消或减少订单（按有依据的可取消数量减少对应到货）；postpone=延期（从原到货期移出在新到货期加入）；substitute_consume=替代消耗（增加已批准替代分配同时减少原料需求分配）；transfer=跨项目转用（分配给有实际需求、时间匹配且已批准的用途）; reduce=减量, type: STRING, enum_values: [none, cancel, postpone, substitute_consume, transfer, reduce], source: "A_schema/scenario-recompute.csv+§11.7" }
      po_id: { display_name: 目标订单号, description: 措施作用的采购订单（S1/S2 目标 PS-3002）, type: STRING, source: "xgimi-poc-doc.md#§11.7" }
      action_qty: { display_name: 措施数量, description: 措施作用数量（S1 取消 2,000 颗）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§11.7" }
      action_cost: { display_name: 行动成本, description: 措施执行成本（S1 取消费 2,000 元），单独列示不与风险金额混项, type: DECIMAL, uom: 元, source: "xgimi-poc-doc.md#§4.4 ④+§11.7" }
      window_risk_amount: { display_name: 窗口内风险金额, description: 评估窗口内的风险金额（S0=88,000/S1=56,000/S2=24,000 元）, type: DECIMAL, uom: 元, source: "xgimi-poc-doc.md#§11.7 方案表" }
      post_window_commitment_amount: { display_name: 窗口后未消化承诺, description: 评估窗口外的未消化承诺金额（S2 旧料 4,000 颗价值 64,000 元、无已确认用途）, type: DECIMAL, uom: 元, source: "xgimi-poc-doc.md#§11.7 方案表" }
      shortage_flag: { display_name: 是否缺料, description: true=方案造成缺料；造成不允许缺料的方案不进入推荐结果, type: BOOLEAN, source: "xgimi-poc-doc.md#§4.4 ④+§11.7" }
      feasible_flag: { display_name: 是否可行, description: true=满足供货要求（S1 可标为当前约束下优先复核方案，但仍有剩余风险）, type: BOOLEAN, source: "xgimi-poc-doc.md#§4.4 ④+§5.3.4" }
      baseline_risk_qty: { display_name: 不干预风险量, description: 不采取措施时的风险量（历史干预模拟 8,000 颗）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.5 ③" }
      intervened_risk_qty: { display_name: 干预后风险量, description: 采取措施后的风险量（及时取消 6,000 颗后剩余 2,000 颗）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§5.4.5" }
      reducible_qty: { display_name: 模拟可减少风险量, description: 模拟可减少风险量 = max(不干预风险量 − 干预后风险量, 0)（derived）；表示条件成立时可减少的量，不等同已实现收益, type: DECIMAL, uom: 颗, derived: true, source: "xgimi-poc-doc.md#§4.5 ③ 公式" }
      total_exposure_amount: { display_name: 合计敞口金额, description: 窗口内风险金额 + 窗口后未消化承诺（derived；S2 合计仍为 88,000 元，不能把 64,000 移出窗口当作风险消除）, type: DECIMAL, uom: 元, derived: true, source: "xgimi-poc-doc.md#§11.7 方案表说明" }
    links: { run: CalculationRun, target_po: PurchaseOrder }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§4.4+§4.5 ③+§11.7+A_schema/scenario-recompute.csv, reviewed: false }

  # ---------- 九、历史层（场景55） ----------
  HistoricalCase:
    display_name: 历史呆滞案例
    table_name: historical_case
    description: 独立数据包的历史呆滞案例还原（P-X8）；事实还原可用后续实际记录，历史决策判断只使用当时已知信息；完整版与缺证版分别保存、不共享失去依据的推导结果
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      case_id: { display_name: 案例ID, description: 案例唯一编号, type: STRING, primary: true, source: "xgimi-poc-doc.md#§11.6" }
      package_id: { display_name: 所属数据包ID, description: 独立数据包（不与当前项目混算）, type: STRING, source: "xgimi-poc-doc.md#§11.6" }
      project_id: { display_name: 项目ID, description: 案例项目（P-X8）, type: STRING, source: "xgimi-poc-doc.md#§11.6" }
      material_id: { display_name: 物料编码, description: 案例物料（H-WIFI-OLD 旧料）, type: STRING, source: "xgimi-poc-doc.md#§11.6" }
      observation_period_from: { display_name: 观察区间起, description: 观察区间起始日（2025-07-01）, type: DATE, source: "xgimi-poc-doc.md#§11.6" }
      observation_period_to: { display_name: 观察区间止, description: 观察区间截止日（2025-09-30；未来需求检查至 2025-12-31）, type: DATE, source: "xgimi-poc-doc.md#§11.6" }
      stagnant_qty: { display_name: 呆滞总量, description: 案例呆滞总数量（8,000 颗）；各主要原因归因数量之和不得超过该总量, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.5 ④+§11.6" }
      risk_formed_date: { display_name: 风险形成时点, description: 风险首次可识别日（2025-07-15，阈值=未覆盖数量大于 0 一次有效评估即触发）, type: DATE, source: "xgimi-poc-doc.md#§11.6 预期结果" }
      decision_observed_date: { display_name: 决策观察时点, description: 回放评估选用的历史决策时点（本例与风险形成时点相同，其他案例不必相同）, type: DATE, source: "xgimi-poc-doc.md#§5.4.2" }
      evidence_status: { display_name: 证据状态, description: complete=五类记录齐全；missing=缺证版本（保留 ECN 引用编号，批准文件与变更后 BOM 明细缺失，不输出确定结论）, type: STRING, enum_values: [complete, missing], source: "xgimi-poc-doc.md#§5.4.6" }
      unattributed_qty: { display_name: 未归因数量, description: 未归因 = max(呆滞总量 − Σ各原因归因数量, 0)（derived）；无法确认的部分保留为未归因、不强行凑足总量, type: DECIMAL, uom: 颗, derived: true, source: "xgimi-poc-doc.md#§4.5 ④ 公式+§8 红线" }
    links: { project: Project, material: Material }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§11.6+§4.5+§5.4, reviewed: false }

  CauseAttribution:
    display_name: 原因归因
    table_name: cause_attribution
    description: 历史案例的呆滞原因归因记录；相关证据可同时保留，不自动定责个人/部门；不应直接把全部呆滞归为单一原因
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      attribution_id: { display_name: 归因ID, description: 归因记录唯一编号, type: STRING, primary: true, source: "xgimi-poc-doc.md#§4.5 ④" }
      case_id: { display_name: 案例ID, description: 归属历史案例, type: STRING, source: "xgimi-poc-doc.md#§4.5 ④" }
      cause_type: { display_name: 原因类型, description: 归因原因描述（如 工程切换后未及时取消订单/需求下修；不预设原因、不自动定责）, type: STRING, source: "xgimi-poc-doc.md#§5.4.6" }
      attributed_qty: { display_name: 归因数量, description: 分配到该原因的数量；各主要原因数量之和 ≤ 案例呆滞总量（约束见 OQ-09）, type: DECIMAL, uom: 颗, source: "xgimi-poc-doc.md#§4.5 ④" }
      evidence_desc: { display_name: 证据说明, description: 支持该归因的证据描述（证据不充分时不输出确定的可避免数量）, type: STRING, source: "xgimi-poc-doc.md#§4.5 ④" }
      is_primary: { display_name: 是否主要原因, description: true=主要原因, type: BOOLEAN, source: "xgimi-poc-doc.md#§4.5 ④（各主要原因对应数量）" }
    links: { case: HistoricalCase }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§4.5 ④+§5.4.6, reviewed: false }

  PreventionRule:
    display_name: 预防规则
    table_name: prevention_rule
    description: 从历史案例沉淀的检查规则草案（如工程变更导致旧料需求减少时检查关联未到货订单）；应在变更已获知且影响能够判断时触发、不等 BOM 正式生效；经审核并试运行后启用
    governance: { owner: 聂江锋（推断）, maturity: experimental }
    properties:
      rule_id: { display_name: 预防规则ID, description: 规则唯一编号, type: STRING, primary: true, source: "xgimi-poc-doc.md#§5.4.7" }
      case_id: { display_name: 来源案例ID, description: 规则来源的历史案例, type: STRING, source: "xgimi-poc-doc.md#§5.4.7" }
      rule_text: { display_name: 规则内容, description: 规则文本（已批准的工程变更导致未来旧料需求减少时，检查关联的未到货订单，计算无法被需求覆盖的数量，提示可取消数量、办理时间及截止日期）, type: STRING, source: "xgimi-poc-doc.md#§5.4.7 规则草案" }
      trigger_timing: { display_name: 触发时机, description: 变更已获知且影响能够判断时触发，不能等到 BOM 正式生效后才检查（否则可能错过取消窗口）, type: STRING, source: "xgimi-poc-doc.md#§5.4.7" }
      status: { display_name: 规则状态, description: draft=草案；review=审核中；trial=测试运行；active=启用（经审核后进入测试运行）, type: STRING, enum_values: [draft, review, trial, active], source: "xgimi-poc-doc.md#§5.4.7" }
      close_basis: { display_name: 关闭依据, description: 任务只有在收到取消、调整或明确保留的处理依据后才能关闭，不能把已通知当作已解决, type: STRING, source: "xgimi-poc-doc.md#§5.4.7" }
    links: { source_case: HistoricalCase }
    provenance: { doc: B_scenarios/xgimi-poc-doc.md#§5.4.7+§4.5 输出, reviewed: false }

# =====================================================================
# 规则（18 条：13 derived + 5 trigger）
# =====================================================================
rules:
  # ---------- derived_property（文档公式原文，方言白名单内） ----------
  - rule_type: derived_property
    name: 标准用量
    upstream: [BomLine]
    logic: "standard_usage: qty_per / base_qty"
    description: 标准用量 = BOM 行用量 ÷ BOM 基准数量；用量比较须在单位和基准数量一致后进行（§4.2 核心判断规则）
  - rule_type: derived_property
    name: 订单未收货量
    upstream: [PurchaseOrder]
    logic: "unreceived_qty: MAX(order_qty - cumulative_receipt_qty - cancelled_qty - closed_unreceived_qty, 0)"
    description: 订单未收货量 = max(订单数量 − 累计有效收货量 − 已取消量 − 已关闭未收余量, 0)；订单收货转为库存后不再按原未收货数量重复计入（§4.3 ③）
  - rule_type: derived_property
    name: 剩余新料需求
    upstream: [MaterialRequirement]
    logic: "remaining_material_qty: gross_qty - substitute_satisfied_qty"
    description: 剩余新料需求 = 物料毛需求 − 替代满足量（主案例 Z9：20,000−6,000=14,000，加 Z9S 共 24,000）（§4.3 ④）
  - rule_type: derived_property
    name: 新料缺口
    upstream: [MaterialRequirement]
    logic: "physical_gap_qty: MAX(remaining_material_qty - allocated_supply_qty, 0)"
    description: 新料缺口 = max(剩余新料需求 − 已分配新料供给, 0)（24,000−15,000=9,000）；不得因授权增加而新增供给（§4.3 ④+§11.8 测试四）
  - rule_type: derived_property
    name: 待授权数量
    upstream: [MaterialRequirement]
    logic: "pending_auth_qty: MAX(gross_qty - authorized_coverage_qty, 0)"
    description: 待授权数量 = max(毛需求 − 已授权覆盖量, 0)（测试四：18,000−10,000=8,000；授权 v2 生效后 18,000−12,000=6,000）；授权单独核算、不作为物理供给（§4.3 步骤6）
  - rule_type: derived_property
    name: 待授权参考金额
    upstream: [MaterialRequirement]
    logic: "pending_auth_amount: pending_auth_qty * unit_price"
    description: 待授权参考金额 = 待授权数量 × 参考单价（8,000×20=160,000 元）；供内部审核，不自动生成采购订单（§11.8 测试四+§2.1 场景24）
  - rule_type: derived_property
    name: 本期期末量
    upstream: [PeriodSupplyBalance]
    logic: "ending_qty: beginning_qty + arrival_qty + other_inflow_qty - demand_satisfied_qty - other_outflow_qty"
    description: 本期期末量 = 期初量 + 本期有效到货 + 其他有效流入 − 实际满足需求量 − 其他有效流出；初始库存只计入一次（§4.4 ①）
  - rule_type: derived_property
    name: 本期未满足需求
    upstream: [PeriodSupplyBalance]
    logic: "unmet_demand_qty: required_qty - demand_satisfied_qty"
    description: 本期未满足需求 = 本期应满足需求 − 实际满足需求量；保留为逾期需求，后续结转不得重复累计（11 月 9,000 与 12 月底 7,800 分别展示）（§4.4 ①+§5.3.3）
  - rule_type: derived_property
    name: 期末风险量
    upstream: [SlowMovingRisk]
    logic: "risk_qty: MAX(ending_remaining_qty - reserved_qty - post_period_consumed_qty, 0)"
    description: 风险量 = max(评估期末剩余量 − 经确认的保留量 − 经证实的期后消耗量, 0)；保留量与期后消耗量不得重复覆盖同一用途（§4.4 ②）
  - rule_type: derived_property
    name: 呆滞风险金额
    upstream: [SlowMovingRisk]
    logic: "risk_amount: risk_qty * unit_cost"
    description: 风险金额 = Σ(风险数量 × 对应成本单价)；不等于减值损失或实际收益，敞口≠损失（§4.4 ④+§8 红线）
  - rule_type: derived_property
    name: 方案合计敞口
    upstream: [SolutionPlan]
    logic: "total_exposure_amount: window_risk_amount + post_window_commitment_amount"
    description: 合计敞口 = 窗口内风险金额 + 窗口后未消化承诺（S2：24,000+64,000=88,000，不能宣称消除了 64,000 风险）；延期只是把旧料移出评估窗口（§11.7）
  - rule_type: derived_property
    name: 模拟可减少风险量
    upstream: [SolutionPlan]
    logic: "reducible_qty: MAX(baseline_risk_qty - intervened_risk_qty, 0)"
    description: 模拟可减少风险量 = max(不干预风险量 − 干预后风险量, 0)（8,000−2,000=6,000）；表示条件成立时可减少的量，不等同已实现收益（§4.5 ③）
  - rule_type: derived_property
    name: 未归因数量
    upstream: [HistoricalCase]
    logic: "unattributed_qty: MAX(stagnant_qty - COALESCE(SUM(cause_attributions.attributed_qty), 0), 0)"
    description: 未归因数量 = max(呆滞总量 − Σ各原因归因数量, 0)；各主要原因对应数量之和 ≤ 案例呆滞总量，无法确认的部分保留为未归因、不强行凑足总量（§4.5 ④+§8 防重复归因红线）

  # ---------- trigger（条件触发） ----------
  - rule_type: trigger
    name: 呆滞风险触发复核
    upstream: [SlowMovingRisk]
    logic:
      ALL:
        - { field: risk_qty, operator: '>', value: 0 }
    downstream: create_risk_review_task
    description: 风险阈值为未覆盖数量大于 0，一次有效评估即可触发；风险首次可识别日即形成（§11.6 预期结果）；后续形成风险复核任务
  - rule_type: trigger
    name: 工程变更预防检查触发
    upstream: [EcnRecord]
    logic:
      ALL:
        - { field: approval_status, operator: '==', value: approved }
        - { field: evidence_status, operator: '==', value: complete }
    downstream: check_uncovered_open_orders
    description: 已批准的工程变更导致未来旧料需求减少时，检查关联的未到货订单，计算无法被需求覆盖的数量并提示可取消数量、办理时间及截止日期；应在变更已获知且影响能够判断时触发、不等 BOM 生效（§5.4.7）；"旧料需求减少"的判定由运行时计算（OQ-02 派生）
  - rule_type: trigger
    name: 授权数量变化重核算
    upstream: [InspectionChange]
    logic:
      ALL:
        - { field: change_type, operator: '==', value: auth_qty_change }
    downstream: recompute_pending_authorization
    description: 同一授权对象及口径下比较前后数量，识别授权数量变化后重新核算相关待授权需求或策备建议（A_schema/inspection-rules.csv#授权数量变化）
  - rule_type: trigger
    name: 替代关系变化复核分配方案
    upstream: [InspectionChange]
    logic:
      ALL:
        - { field: change_type, operator: '==', value: substitution_change }
    downstream: review_allocation_validity
    description: 比较方向、范围、比例、有效期及批准状态，检查原分配方案是否仍然有效；失效替代关系保留问题记录，但不得参与替代计算（§4.2 异常处理+A_schema/inspection-rules.csv）
  - rule_type: trigger
    name: 冻结供给排除待核查
    upstream: [Supply]
    logic:
      ALL:
        - { field: supply_type, operator: '==', value: frozen_stock }
    downstream: exclude_from_allocation_and_flag
    description: 质检冻结库存未获放行不参与供给分配，单列待核查数量（1,000 颗/20,000 元），不认定为零风险或全额损失（§11.3 PS-1002）

# =====================================================================
# 能力问题（12 条，见 charter.md）
# =====================================================================
competency_questions:
  - id: cq-001
    q: BOM、风险 BOM、替代关系或授权发生前后版本变化时，系统识别出哪些变化、波及哪些需求与供给、生成哪些复核任务？
    covered_by: [InspectionChange, ReviewTask]
  - id: cq-002
    q: 某物料在评估期内的毛需求、替代满足量、已分配供给和物理缺口分别是多少？
    covered_by: [MaterialRequirement.gross_qty, MaterialRequirement.substitute_satisfied_qty, MaterialRequirement.allocated_supply_qty, MaterialRequirement.physical_gap_qty]
  - id: cq-003
    q: 某物料的待授权数量与参考金额是多少？新增授权后物理缺口是否应随之改变？
    covered_by: [MaterialRequirement.pending_auth_qty, MaterialRequirement.pending_auth_amount, MaterialRequirement.physical_gap_qty, MaterialAuthorization.covered_qty]
  - id: cq-004
    q: 按供应商整理的参考清单列了哪些物料、建议量、取整增量和预计到货安排？
    covered_by: [SourcingSuggestion.allocated_qty, SourcingSuggestion.suggested_qty, SourcingSuggestion.rounding_extra_qty, SourcingSuggestion.expected_arrival_date, VendorReferenceList]
  - id: cq-005
    q: 某物料逐期的期初、到货、满足消耗、期末结余与未满足需求是多少？
    covered_by: [PeriodSupplyBalance.beginning_qty, PeriodSupplyBalance.arrival_qty, PeriodSupplyBalance.demand_satisfied_qty, PeriodSupplyBalance.ending_qty, PeriodSupplyBalance.unmet_demand_qty]
  - id: cq-006
    q: 评估期末哪些物料存在呆滞风险量与风险金额，分别来自现有库存还是未到货订单？
    covered_by: [SlowMovingRisk.risk_qty, SlowMovingRisk.risk_amount, SlowMovingRisk.risk_source_type]
  - id: cq-007
    q: 取消、延期、替代消耗、转用各方案的窗口内风险、窗口后未消化承诺、行动成本与合计敞口各是多少，是否造成缺料？
    covered_by: [SolutionPlan.window_risk_amount, SolutionPlan.post_window_commitment_amount, SolutionPlan.action_cost, SolutionPlan.total_exposure_amount, SolutionPlan.shortage_flag]
  - id: cq-008
    q: 某张未到货订单的未收货量、可取消数量上限、取消截止日与延期条件是什么？
    covered_by: [PurchaseOrder.unreceived_qty, PurchaseOrder.cancel_limit_qty, PurchaseOrder.cancel_deadline, PurchaseOrder.postpone_allowed]
  - id: cq-009
    q: 某历史呆滞案例的呆滞总量、风险形成时点、决策观察时点与证据完整性如何？
    covered_by: [HistoricalCase.stagnant_qty, HistoricalCase.risk_formed_date, HistoricalCase.decision_observed_date, HistoricalCase.evidence_status]
  - id: cq-010
    q: 历史案例归因中各原因分配了多少数量，未归因部分还剩多少，是否守住"各原因之和≤总量"？
    covered_by: [HistoricalCase.stagnant_qty, HistoricalCase.unattributed_qty, CauseAttribution.attributed_qty]
  - id: cq-011
    q: 从历史案例沉淀了哪些预防规则，各自触发时机与启用状态是什么？
    covered_by: [PreventionRule.rule_text, PreventionRule.trigger_timing, PreventionRule.status]
  - id: cq-012
    q: 每次计算运行采用的输入数据版本、观察时间、规则版本与情景（FACT/SIM）是什么？
    covered_by: [CalculationRun.observed_at, CalculationRun.version_id, CalculationRun.rule_version, CalculationRun.scenario_tag, DataVersion]

# =====================================================================
# 待确认问题（禁止脑补；人审前须清零或标记接受）
# =====================================================================
open_questions:
  - id: OQ-01
    topic: 策备建议量向上取整（方言边界）
    question: 建议量 = 按订购倍数向上取整〔max(分配量, 最小起订量)〕，CEILING 类函数不在表达式方言白名单（SUM/COALESCE/MAX+四则+点路径）内，如何承载？
    proposal: 按运行时计算契约处理：SourcingSuggestion.suggested_qty/rounding_extra_qty 由运行器计算写入，不设 derived 规则、不发明函数；测试一 8,400/3,600→9,000/4,000、测试十 9,408→MOQ 12,000 为验收用例
    missing_from: 无（文档口径齐全，缺的是引擎方言能力——由引擎侧裁决是否扩展取整函数）
  - id: OQ-02
    topic: 多级 BOM 迭代展开（方言边界）
    question: 「下层物料需求 = 上层需求 × 标准用量 ÷ 有效良率；多层 BOM 按层展开再汇总」为迭代展开语义，DSL 衍生表达式无法表达逐层递归；良率只在明确适用层级计入。
    proposal: 运行时计算契约：MaterialRequirement.gross_qty 由运行器按层展开写入（测试五 20,000÷0.98÷0.99→20,615 向上取整为最终汇总后取整，见 OQ-01 同类取整问题）
    missing_from: 无（方言能力边界）
  - id: OQ-03
    topic: 需求去重与覆盖关系选取（方言边界）
    question: 订单/MPS/预测存在明确覆盖关系时按确认口径选取或冲减（Z9 11 月 20,000 台计划已含 12,000 台订单并替代 22,000 台早期预测，三者不相加）；无覆盖依据时不得仅凭来源优先级舍弃——条件分支逻辑超出方言。
    proposal: 运行时计算契约：Demand.covered_by_demand_id + status 承载覆盖证据，选取逻辑由运行器执行
    missing_from: 无（方言能力边界）
  - id: OQ-04
    topic: 供给分配优先级与稳定排序（方言边界）
    question: 分配须满足「先满足合法旧料使用许可并确定被替代数量，再按需要日期分配新料；相同日期按项目编码、供给可用日期和供给ID稳定排序；同一批供给累计分配量≤可用数量」——排序与贪心分配是算法语义。
    proposal: 运行时计算契约：MaterialRequirement.allocated_supply_qty/substitute_satisfied_qty 由运行器写入；规则路径中的直接供给和替代供给不得重复
    missing_from: 无（方言能力边界）
  - id: OQ-05
    topic: 分期滚动结转（方言边界）
    question: 「本期期初量=上期期末量；未满足需求保留为逾期需求后续结转不重复累计」为跨行引用，衍生表达式无法表达行间递推。
    proposal: 运行时计算契约：PeriodSupplyBalance 行内公式已建 derived（期末/未满足），跨期结转由运行器按期间顺序执行
    missing_from: 无（方言能力边界）
  - id: OQ-06
    topic: 替代资格多条件检查（方言边界）
    question: 替代计算先检查方向、适用项目、批次、有效期、可用日期、换算比例和批准上限，再按确定的优先级分配——多条件资格判定超出方言（无 IF/CASE）。
    proposal: 运行时计算契约；失效替代关系保留问题记录（trigger R17 触发复核）但不得参与替代计算
    missing_from: 无（方言能力边界）
  - id: OQ-07
    topic: 方案措施数据调整与完整重算（方言边界/动作域）
    question: scenario-recompute.csv 定义了取消/延期/替代消耗/转用四类措施对计算数据的调整方式，"调整后用同一套供需公式重新计算，不得直接用原风险量减措施数量代替完整计算"——属动作域语义（M3 动作生成候选）。
    proposal: 方案重算由运行器/动作承载；SolutionPlan 承载重算结果对比字段
    missing_from: 无（属后续阶段动作域，dsl-spec §4 actions 一期不含）
  - id: OQ-08
    topic: 授权生效版本选择（方言边界）
    question: 同一授权对象的 v2「覆盖并替换 v1」，生效授权版本的选取逻辑（按日期/批准状态取最新有效版本）超出方言。
    proposal: 运行时计算契约：MaterialRequirement.authorized_coverage_qty 由运行器按生效版本汇总写入
    missing_from: 无（方言能力边界）
  - id: OQ-09
    topic: 防重复归因上限约束（admission 候选）
    question: 「各主要原因对应数量之和 ≤ 案例呆滞总量」是数据约束而非计算；当前以 unattributed_qty derived 量化表达（未归因=max(总量−Σ归因,0)），但写入时的硬拦截需要 admission/动作准入（M3 能力）。
    proposal: M3 接入 admission 后将"Σ归因≤总量"注册为 CauseAttribution 写入准入；当前人审与运行器校验
    missing_from: 无（M3 能力排期，dsl-spec §3.3）
  - id: OQ-10
    topic: 主案例 ECN 编号缺失
    question: 主案例 Z9 换料 ECN 无显式编号（历史案例有 H-ECN-01），EcnRecord.ecn_id 主键值需数据侧补充或按规则生成。
    proposal: 向客户确认 ECN 编码规则后补数据；不自行编造编号
    missing_from: B_scenarios/xgimi-poc-doc.md#§11.2 与 §11.1（V1 行只写"发布 Z9 换料 ECN"，无编号列）
  - id: OQ-11
    topic: 参考清单外发审批流程未定义
    question: 供应商参考清单默认不可直接外发（§8 红线），但外发的审批流程/角色/条件文档未定义；VendorReferenceList.status 仅到 internal_review。
    proposal: 人审裁定是否保留 archived 终态或补充外发审批状态机；流程步骤不建对象
    missing_from: B_scenarios/xgimi-poc-doc.md#§3 流程③与 §8 设计红线（只声明"不外发"，无外发审批路径）
  - id: OQ-12
    topic: known_at"V0 之前"的精确时点
    question: 附录 BOM 行表 known_at 列存在「V0 之前」取值（原记录早于 V0 但无精确可见时间），双时间语义在该类记录上粒度不足。
    proposal: 与客户确认原记录的导入时点口径；DSL 侧 known_at 保留 STRING 原值不做日期化脑补
    missing_from: B_scenarios/xgimi-poc-doc.md#§11.2 BOM 行表（known_at 列值"V0 之前"无对应精确时间定义）

