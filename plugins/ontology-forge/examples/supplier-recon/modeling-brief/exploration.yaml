  # ───── D1 总体理解与范围 ─────
  - id: X-001
    dimension: D1
    kind: scope
    statement: "本域管的是：财务共享中心每月按供应商对账，算清每张对账单的差异；差异超线的转人工复核；供应商被冻结时它的对账单不再自动推进。要支撑三项决策：哪些对账单需要人工复核、哪些供应商当前不宜推进对账、某供应商交付了多少金额"
    basis: stated
    must_ask: false
    status: confirmed
    source: "资料：B_scenarios/decisions.md#财务共享中心每月按供应商对账"
    refs: ["X-002", "X-033"]
  - id: X-002
    dimension: D1
    kind: scope
    statement: "本域不包含发票明细管理与付款执行，只使用对账单上的发票金额与已对账金额"
    basis: inferred
    must_ask: false
    status: confirmed
    question: "发票本身的明细（逐张发票的信息）和实际付款，要不要纳入这次对账的范围？"
    proposal: "不纳入：本域只使用对账单上的发票金额与已对账金额"
    rationale: "五份资料里没有发票明细表，也没有付款记录表；对账只用到对账单上的发票金额与已对账金额（A_schema/data_dictionary.md#reconciliation_statement），交货总额也只汇总交货金额"
    options:
      - "把发票明细纳入范围（需要补充发票明细的表结构与口径资料）"
      - "把付款记录纳入范围（需要补充付款数据来源，「差异」可能要从发票减已对账改成发票减已付款）"
    source: "AI 建议 2026-11-25"
    asked_rounds: 0
    resolution: "[2026-11-25 17:20:39] 示范确认人（虚构域示范记录）：按 AI 建议确认"   # 留痕时间早于 updated_at：确认发生在追加 X-035 之前
    refs: ["X-001"]
  # ───── D2 业务对象、属性与关系 ─────
  - id: X-003
    dimension: D2
    kind: object
    statement: "本域有四类业务对象：供应商、采购合同、交货记录、对账单；分别用供应商编码、采购合同号、交货单号、对账单号唯一标识"
    basis: stated
    must_ask: false
    status: confirmed
    source: "资料：A_schema/supplier_ddl.sql#supplier.supplier_code；A_schema/supplier_ddl.sql#purchase_contract.contract_nr；A_schema/supplier_ddl.sql#delivery_record.delivery_nr；A_schema/supplier_ddl.sql#reconciliation_statement.recon_nr"
    refs: ["X-016", "X-032"]
  - id: X-004
    dimension: D2
    kind: rule
    statement: "术语「对账差异金额」在本域特指：发票金额 − 已对账金额（不是发票与交货金额之差，也不是发票与付款之差）；结果为负表示「多对账」，保留负值、不取绝对值；「已对账金额」指双方核对一致确认的金额"
    basis: stated
    must_ask: true                 # 必问清单第 5 条：业务术语在本企业的特殊含义
    status: confirmed
    question: "「对账差异金额」在你们这里具体是哪两个数相减？算出来是负数怎么办？"
    source: "资料：B_scenarios/rules.md#对账差异金额；A_schema/data_dictionary.md#reconciliation_statement.reconciled_amount"
    refs: ["X-008", "X-026"]
  - id: X-005
    dimension: D2
    kind: object
    statement: "术语「冻结」在本域特指：供应商因合同纠纷或质检问题被停止对账与付款；冻结由采购侧在 SRM 系统操作"
    basis: stated
    must_ask: true                 # 必问清单第 5 条：业务术语在本企业的特殊含义
    status: confirmed
    question: "「冻结」的供应商具体是什么意思？由谁来冻结？"
    source: "资料：A_schema/data_dictionary.md#supplier.frozen_flag；C_interviews/interview_finance.md#Q：冻结是什么意思？"
    refs: ["X-023"]
  - id: X-006
    dimension: D2
    kind: property
    statement: "金额类信息项的口径与计量单位：采购合同总金额是含税金额，单位为元；交货金额是含税金额，单位为元；交货数量的单位为件"
    basis: stated
    must_ask: true                 # 必问清单第 4 条：计量单位（属性口径在 D2 问清）
    status: confirmed
    question: "合同总金额、交货金额登记的是含税还是不含税？金额和数量各以什么单位计量？"
    source: "资料：A_schema/data_dictionary.md#purchase_contract.contract_amount；A_schema/data_dictionary.md#delivery_record.delivery_amount；A_schema/data_dictionary.md#delivery_record.delivery_qty"
    refs: ["X-014", "X-027"]
  - id: X-007
    dimension: D2
    kind: property
    statement: "三个有固定取值的信息项，取值全集如下——结算方式：月结30天、月结60天、货到付款；合同状态：生效、终止、作废；对账状态：open（对账中）、confirmed（双方确认）、disputed（有争议）"
    basis: stated
    must_ask: true                 # 必问清单第 4 条：枚举类属性的取值全集
    status: confirmed
    question: "结算方式、合同状态、对账状态各自一共有哪几个取值？"
    source: "资料：A_schema/data_dictionary.md#supplier.settlement_type；A_schema/data_dictionary.md#purchase_contract.status；A_schema/data_dictionary.md#reconciliation_statement.status"
    refs: ["X-017", "X-018"]
  - id: X-008
    dimension: D2
    kind: property
    statement: "空值的含义：已对账金额为空时按 0 处理；供应商的冻结标记缺省为 0（即正常）"
    basis: stated
    must_ask: true                 # 必问清单第 4 条：空值含义
    status: confirmed
    question: "已对账金额没有填的时候当什么算？冻结标记没有填的时候算冻结还是正常？"
    source: "资料：B_scenarios/rules.md#对账差异金额；A_schema/supplier_ddl.sql#supplier.frozen_flag"
    refs: ["X-004", "X-026"]
  - id: X-009
    dimension: D2
    kind: property
    statement: "各字段的类型与数据字典一致：采购合同号、供应商编码等为字符串，合同总金额、交货金额为 DECIMAL(18,2)，交货数量为 DOUBLE，签约日期为 DATE，创建时间与更新时间为 DATETIME；冻结标记在数据字典里是 BOOLEAN，在建表语句里是 TINYINT(1)"
    basis: stated
    must_ask: false                # 数据类型属可补全项；本域类型资料齐备，直接取自建表语句
    status: confirmed
    source: "资料：A_schema/supplier_ddl.sql#purchase_contract.contract_nr；A_schema/supplier_ddl.sql#purchase_contract.contract_amount；A_schema/supplier_ddl.sql#delivery_record.delivery_qty；A_schema/supplier_ddl.sql#delivery_record.delivery_amount；A_schema/supplier_ddl.sql#purchase_contract.sign_date；A_schema/supplier_ddl.sql#supplier.create_time；A_schema/supplier_ddl.sql#supplier.update_time；A_schema/supplier_ddl.sql#supplier.frozen_flag；A_schema/data_dictionary.md#supplier.frozen_flag"
    refs: ["X-013"]
  - id: X-010
    dimension: D2
    kind: property
    statement: "三个引用字段都不允许为空：采购合同上的供应商编码、交货记录上的合同号、对账单上的供应商编码"
    basis: stated
    must_ask: false                # 必填/可空属可补全项；建表语句已写明 NOT NULL
    status: confirmed
    source: "资料：A_schema/supplier_ddl.sql#purchase_contract.supplier_code；A_schema/supplier_ddl.sql#delivery_record.contract_nr；A_schema/supplier_ddl.sql#reconciliation_statement.supplier_code"
    refs: ["X-016"]
  - id: X-011
    dimension: D2
    kind: property
    statement: "建议对账单增加一个「状态变更时间」信息项，记录最近一次状态变化的时间"
    basis: inferred
    must_ask: false                # 可补全项：常见属性清单
    status: proposed
    question: "对账单要不要记下最近一次状态变化的时间？"
    proposal: "增加「状态变更时间」，由系统在对账单状态变化时自动记录"
    rationale: "决策 1 的 KPI 里有「争议单处理时长」（B_scenarios/decisions.md#决策 1），算时长需要知道对账单什么时候进入「有争议」；对账单现在只有创建时间，没有状态变化时间"
    options:
      - "不增加（「争议单处理时长」这项 KPI 算不出来）"
      - "改为分别记录进入争议的时间与争议结束的时间（多一个信息项，时长算得更准）"
    source: "AI 建议 2026-11-25"
    asked_rounds: 0
    refs: ["X-017"]
  - id: X-012
    dimension: D2
    kind: property
    statement: "建议供应商增加一个「对账联系人」信息项，记录对账事项的对接人"
    basis: inferred
    must_ask: false                # 可补全项：常见属性清单
    status: proposed
    question: "供应商要不要记一个对账联系人？"
    proposal: "增加「对账联系人」，记录对账事项的对接人"
    rationale: "对账出现差异时需要找供应商核对，而供应商现在只有名称与结算方式，没有任何联系方式；同类对账业务里一般都有联系人"
    options:
      - "不增加（有差异时需要到别的系统查联系人）"
      - "增加联系人与联系方式两个信息项（多一个信息项，沟通更直接）"
    source: "AI 建议 2026-11-25"
    asked_rounds: 0
    refs: ["X-003"]
  - id: X-013
    dimension: D2
    kind: property
    statement: "建议三个计算字段的数据类型：对账差异金额、供应商交货总额按金额型，对账差异率按数值型"
    basis: inferred
    must_ask: false                # 可补全项：常见数据类型
    status: proposed
    question: "三个算出来的字段（差异金额、差异率、交货总额）按什么类型存？"
    proposal: "对账差异金额、供应商交货总额按金额型，对账差异率按数值型"
    rationale: "资料给了三个字段的口径但没有给类型。两个金额分别由金额相减、相加得到，沿用金额型；差异率是小数比率"
    options:
      - "三个都按金额型（差异率带上金额的单位，容易让人误读成金额）"
    source: "AI 建议 2026-11-25"
    asked_rounds: 0
    refs: ["X-004", "X-026", "X-027"]
  - id: X-014
    dimension: D2
    kind: property
    statement: "发票金额、已对账金额登记的是含税金额还是不含税金额，资料没有写明"
    basis: inferred
    must_ask: false                # 属必问清单第 4 条「是否含税」；资料未写明、无法按资料确认，挂为待确认
    status: pending
    question: "对账单上的发票金额和已对账金额，登记的是含税金额还是不含税金额？"
    proposal: "按含税金额登记，与交货金额、合同总金额的口径保持一致"
    rationale: "交货金额与合同总金额都写明是含税金额，决策 3 要用交货金额合计与发票金额交叉核对，两边口径一致才比得出来"
    options:
      - "按不含税金额登记（与交货金额口径不一致，交叉核对前要先做价税换算）"
      - "含税与不含税都登记（多一个信息项，两种口径都能查）"
    source: "AI 建议 2026-11-25"
    asked_rounds: 2
    pending_reason: "示范过程：已追问两轮仍无明确答复。属必问清单第 4 条「是否含税」，资料未写明，挂为待确认、不带入建模"
    refs: ["X-006"]
  - id: X-015
    dimension: D2
    kind: property
    statement: "对账单被系统标记为「需复核」之后，这个标记记在对账单的哪个信息项上，资料没有说明；对账单现有的信息项里没有复核标记"
    basis: inferred
    must_ask: false                # 常见属性清单的缺口；资料未说明，挂为待确认
    status: pending
    question: "对账单被标记「需复核」以后，这个标记记在对账单的哪个信息项上？"
    proposal: "对账单增加一个「需复核标记」信息项（是 / 否），差异超线时由系统置为「是」"
    rationale: "口径规则说由系统动作把对账单标记为需复核（B_scenarios/rules.md#复核触发），但数据字典里对账单只有对账单号、对账期间、发票金额、已对账金额、对账状态、创建时间等信息项，没有能承载这个标记的字段；不补的话，决策 1 要看的「月度复核单量」无从统计"
    options:
      - "不加信息项，标记由系统动作自行处理（对账单上查不到是否需复核，复核单量需另行统计）"
    source: "AI 建议 2026-11-25"
    asked_rounds: 2
    pending_reason: "示范过程：已追问两轮仍无明确答复；标记落在哪需要业务方与平台侧共同确认，挂为待确认、不带入建模"
    refs: ["X-019", "X-022"]
  - id: X-016
    dimension: D2
    kind: relation
    statement: "三条关系：每份采购合同签约于一个供应商，一个供应商可以有多份合同；每条交货记录挂在一份采购合同下，一份合同可以有多条交货记录；每张对账单对应一个供应商，按供应商加月份生成、一个供应商每月一张"
    basis: stated
    must_ask: false
    status: confirmed
    source: "资料：C_interviews/interview_finance.md#Q：合同和交货的关系？；A_schema/data_dictionary.md#purchase_contract.supplier_code；A_schema/data_dictionary.md#delivery_record.contract_nr；A_schema/data_dictionary.md#reconciliation_statement.supplier_code"
    refs: ["X-003", "X-010", "X-025"]
  # ───── D3 状态与生命周期 ─────
  - id: X-017
    dimension: D3
    kind: state
    statement: "对账单的三种状态（对账中 / 双方确认 / 有争议）之间如何流转、什么条件下允许变化，资料没有说明"
    basis: inferred
    must_ask: false                # 属必问清单第 3 条「状态如何流转」；资料未说明，挂为待确认
    status: pending
    question: "对账单从「对账中」变成「双方确认」或「有争议」，分别要满足什么条件？确认之后还能不能改回「对账中」？"
    proposal: "差异在复核线以内且双方核对一致的，对账单从「对账中」变为「双方确认」；任一方对差异提出异议的，变为「有争议」；「双方确认」是终态，不改回「对账中」"
    rationale: "资料只给了三个状态和各自的含义；「有争议」说明存在提出异议的环节，「双方确认」说明需要双方都认可；终态不回退是对账业务的通行做法"
    options:
      - "「有争议」在对账单争议解决后可以直接变为「双方确认」（多一条流转路径，需要明确争议解决的判定人）"
      - "所有状态变化都由人工操作，系统不做任何自动确认"
    source: "AI 建议 2026-11-25"
    asked_rounds: 2
    pending_reason: "示范过程：已追问两轮仍无明确答复。属必问清单第 3 条「状态如何流转」，资料只给了状态取值，挂为待确认、不带入建模"
    refs: ["X-007", "X-023"]
  - id: X-018
    dimension: D3
    kind: state
    statement: "采购合同的三种状态（生效 / 终止 / 作废）在什么条件下允许变化、由谁操作，资料只给了含义，没有给变化规则"
    basis: inferred
    must_ask: false                # 属必问清单第 3 条「状态如何流转」；资料未说明，挂为待确认
    status: pending
    question: "采购合同从「生效」变为「终止」或「作废」，分别由谁在什么情况下操作？变成「终止」或「作废」之后还能不能恢复为「生效」？"
    proposal: "合同到期或双方协商提前结束时由采购人员把合同置为「终止」；签署后取消的合同置为「作废」；「终止」和「作废」都是终态，不恢复为「生效」"
    rationale: "数据字典对两个状态的解释已经点明了各自的成因（到期或提前终止、签署后取消），建议只是把成因对应到操作上；终态不回退是合同管理的通行做法"
    options:
      - "「终止」的合同允许恢复为「生效」（需要额外记录恢复原因和次数）"
      - "只保留「生效」一种状态，其余用删除处理（丢失合同的历史轨迹）"
    source: "AI 建议 2026-11-25"
