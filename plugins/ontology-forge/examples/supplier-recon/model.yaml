# supplier-recon 本体 DSL v0.1.0-draft.2
# 依据：plugins/ontology-forge/examples/supplier-recon/modeling-brief/（五份资料：A_schema / B_scenarios / C_interviews；各元素的 source 指回具体位置）
# 状态：draft——人审是唯一权威，未确认不得注册引擎
# 范例性质：虚构域示范（随插件分发的黄金范例）。与评测黄金答案结构等价——实体 / 主键 / 引用关系 / 规则 / 能力问题逐项不变，
#   只做形态升级到 dsl-spec 现行写法（治理注释三行、links 显式形态、属性 source 锚点、枚举双写、衍生重述、规则级 source、
#   OQ 七态 schema、assumptions）。受发布门禁保护：改动后须重过 lint、能力问题回验与编译幂等。
# 待确认事项：等引擎的 2 条在下方 open_questions；等业务方的 14 条见 design-proposal.md 第 6.2 节与 business-inquiry.md，
#   未写入本文件的 open_questions（原因见 design-proposal.md 第 6.2 节的升格说明）——这 14 条清零之前本文件不得定稿。
# 出处记法：source 路径相对资料包目录；数据字典用「表.字段」定位到行，口径规则用章节标题，访谈用问句。
ontology: supplier-recon            # 本体标识（kebab-case，与 brief.yaml 的 domain 一致）
version: 0.1.0-draft.2              # 语义化版本，草稿态带 -draft.N 后缀；draft.2 = 形态升级、结构未变
base_version: null                  # 增量建模时基于的引擎快照版本；从零建库为 null
governance:                         # 本体级治理（实体级缺省继承）
  owner: 王财务                      # 业务负责人（取自 brief.yaml）
  maturity: experimental            # 新建本体、未经人审

entities:
  Supplier:
    display_name: 供应商
    table_name: supplier
    description: "SRM 系统管理的供应商主数据，含结算方式与冻结状态"
    properties:
      supplier_code:
        display_name: 供应商编码
        description: "SRM 系统供应商唯一编码"
        type: STRING
        primary: true
        source: "A_schema/data_dictionary.md#supplier.supplier_code"
      supplier_name:
        display_name: 供应商名称
        description: "供应商营业执照全称"
        type: STRING
        source: "A_schema/data_dictionary.md#supplier.supplier_name"
      settlement_type:
        display_name: 结算方式
        description: "与供应商约定的付款周期；取值：月结30天 / 月结60天 / 货到付款"
        type: STRING
        enum_values: [月结30天, 月结60天, 货到付款]
        source: "A_schema/data_dictionary.md#supplier.settlement_type"
      frozen_flag:
        display_name: 冻结标记
        description: "true=冻结（合同纠纷或质检问题时冻结，停止对账与付款）；false=正常"
        type: BOOLEAN
        source: "A_schema/data_dictionary.md#supplier.frozen_flag"
      create_time:
        display_name: 创建时间
        description: "供应商主数据创建时间"
        type: TIMESTAMP
        source: "A_schema/data_dictionary.md#supplier.create_time"
      update_time:
        display_name: 更新时间
        description: "供应商主数据最近更新时间"
        type: TIMESTAMP
        source: "A_schema/data_dictionary.md#supplier.update_time"
      total_delivery_amount:
        display_name: 供应商交货总额
        description: "衍生：该供应商所有合同下全部交货记录的交货金额合计（元，含税）；沿「采购合同 → 交货记录」两级合计，两级合计的引擎支持性待验证，见 open_questions OQ-02"
        type: DECIMAL
        uom: 元
        derived: true
        source: "B_scenarios/rules.md#供应商交货总额"
    provenance:
      doc: "A_schema/supplier_ddl.sql#supplier + A_schema/data_dictionary.md#supplier"
      reviewed: true

  PurchaseContract:
    display_name: 采购合同
    table_name: purchase_contract
    description: "与供应商签署的采购合同，记录金额与履约状态"
    properties:
      contract_nr:
        display_name: 采购合同号
        description: "SRM 合同唯一编号"
        type: STRING
        primary: true
        source: "A_schema/data_dictionary.md#purchase_contract.contract_nr"
      contract_amount:
        display_name: 合同总金额
        description: "合同含税总金额（元）"
        type: DECIMAL
        uom: 元
        source: "A_schema/data_dictionary.md#purchase_contract.contract_amount"
      sign_date:
        display_name: 签约日期
        description: "合同签署日期"
        type: DATE
        source: "A_schema/data_dictionary.md#purchase_contract.sign_date"
      status:
        display_name: 合同状态
        description: "生效=正常履约；终止=到期或提前终止；作废=签署后取消"
        type: STRING
        enum_values: [生效, 终止, 作废]
        source: "A_schema/data_dictionary.md#purchase_contract.status"
      supplier_code:
        display_name: 签约供应商
        description: "合同签约方的供应商编码"
        type: STRING
        source: "A_schema/data_dictionary.md#purchase_contract.supplier_code"
    links:
      supplier:
        target: Supplier
        fk: [supplier_code]
        name: 签约供应商
        description: "每份采购合同签约于一个供应商，一个供应商可以有多份合同；引用字段 supplier_code，不允许为空"
    provenance:
      doc: "A_schema/supplier_ddl.sql#purchase_contract + A_schema/data_dictionary.md#purchase_contract"
      reviewed: true

  DeliveryRecord:
    display_name: 交货记录
    table_name: delivery_record
    description: "WMS 记录的每次交货明细，挂在采购合同下"
    properties:
      delivery_nr:
        display_name: 交货单号
        description: "WMS 交货单唯一编号"
        type: STRING
        primary: true
        source: "A_schema/data_dictionary.md#delivery_record.delivery_nr"
      delivery_qty:
        display_name: 交货数量
        description: "本次交货件数"
        type: DOUBLE
        uom: 件
        source: "A_schema/data_dictionary.md#delivery_record.delivery_qty"
      delivery_amount:
        display_name: 交货金额
        description: "本次交货金额（元，含税）"
        type: DECIMAL
        uom: 元
        source: "A_schema/data_dictionary.md#delivery_record.delivery_amount"
      delivery_date:
        display_name: 交货日期
        description: "实际到货日期"
        type: DATE
        source: "A_schema/data_dictionary.md#delivery_record.delivery_date"
      contract_nr:
        display_name: 关联合同
        description: "本次交货所属采购合同"
        type: STRING
        source: "A_schema/data_dictionary.md#delivery_record.contract_nr"
    links:
      purchase_contract:
        target: PurchaseContract
        fk: [contract_nr]
        name: 关联合同
        description: "每条交货记录挂在一份采购合同下，一份合同可以有多条交货记录；引用字段 contract_nr，不允许为空"
    provenance:
      doc: "A_schema/supplier_ddl.sql#delivery_record + A_schema/data_dictionary.md#delivery_record"
      reviewed: true

  ReconciliationStatement:
    display_name: 对账单
    table_name: reconciliation_statement
    description: "FIM 财务系统按供应商按月生成的对账单，记录发票与对账金额"
    properties:
      recon_nr:
        display_name: 对账单号
        description: "FIM 对账单唯一编号"
        type: STRING
        primary: true
        source: "A_schema/data_dictionary.md#reconciliation_statement.recon_nr"
      recon_period:
        display_name: 对账期间
        description: "对账月份，格式 yyyy-MM"
        type: STRING
        source: "A_schema/data_dictionary.md#reconciliation_statement.recon_period"
      invoice_amount:
        display_name: 发票金额
        description: "供应商本期开具发票总额（元）"
        type: DECIMAL
        uom: 元
        source: "A_schema/data_dictionary.md#reconciliation_statement.invoice_amount"
      reconciled_amount:
        display_name: 已对账金额
        description: "双方核对一致确认的金额（元）"
        type: DECIMAL
        uom: 元
        source: "A_schema/data_dictionary.md#reconciliation_statement.reconciled_amount"
      status:
        display_name: 对账状态
        description: "open=对账中；confirmed=双方确认；disputed=存在争议。「需复核」是复核触发规则打的标记，不是对账状态的取值"
        type: STRING
        enum_values: [open, confirmed, disputed]
        source: "A_schema/data_dictionary.md#reconciliation_statement.status"
      create_time:
        display_name: 创建时间
        description: "对账单创建时间"
        type: TIMESTAMP
        source: "A_schema/data_dictionary.md#reconciliation_statement.create_time"
      supplier_code:
        display_name: 对账供应商
        description: "本对账单对应的供应商"
        type: STRING
        source: "A_schema/data_dictionary.md#reconciliation_statement.supplier_code"
      recon_diff_amount:
        display_name: 对账差异金额
        description: "衍生：发票金额 − 已对账金额（元）；已对账金额为空按 0 处理；负值表示多对账，保留负值、不取绝对值"
        type: DECIMAL
        uom: 元
        derived: true
        source: "B_scenarios/rules.md#对账差异金额"
      recon_diff_rate:
        display_name: 对账差异率
        description: "衍生：差异金额 ÷ 发票金额（比率，非百分数）；发票金额为 0 或缺失时记 9999；除零兜底能否生效待引擎验证，见 open_questions OQ-01"
        type: DECIMAL
        uom: 比率
        derived: true
        source: "B_scenarios/rules.md#对账差异率"
    links:
      supplier:
        target: Supplier
        fk: [supplier_code]
        name: 对账供应商
        description: "每张对账单对应一个供应商，按供应商加月份生成；引用字段 supplier_code，不允许为空"
    provenance:
      doc: "A_schema/supplier_ddl.sql#reconciliation_statement + A_schema/data_dictionary.md#reconciliation_statement"
      reviewed: true

rules:
  - rule_type: derived_property
    name: 对账差异金额
    upstream: [ReconciliationStatement]
    logic: "recon_diff_amount: invoice_amount - COALESCE(reconciled_amount, 0)"
    description: "发票金额 − 已对账金额（元）；无已对账金额按 0 处理；负值=多对账，保留不取绝对值"
    source: "B_scenarios/rules.md#对账差异金额"
  - rule_type: derived_property
    name: 对账差异率
    upstream: [ReconciliationStatement]
    logic: "recon_diff_rate: COALESCE(recon_diff_amount / invoice_amount, 9999)"
    description: "差异金额 ÷ 发票金额（比率）；发票金额为 0 或缺失时记 9999（异常大，保证触发复核）；除零兜底能否生效待引擎验证，见 open_questions OQ-01"
    source: "B_scenarios/rules.md#对账差异率"
  - rule_type: derived_property
    name: 供应商交货总额
    upstream: [Supplier]
    logic: "total_delivery_amount: SUM(purchase_contracts.delivery_records.delivery_amount)"
    description: "该供应商所有合同下全部交货记录的交货金额合计（元，含税）；经采购合同到交货记录两级合计，两级合计的引擎支持性待验证，见 open_questions OQ-02"
    source: "B_scenarios/rules.md#供应商交货总额"
  - rule_type: trigger
    name: 对账差异复核触发
    upstream: [ReconciliationStatement]
    logic:
      ALL:
        - { field: recon_diff_amount, operator: ">", value: 2000 }
        - { field: recon_diff_rate, operator: ">", value: 0.05 }
    downstream: mark_recon_review
    description: "差异金额超 2000 元且差异率超 5% 的对账单自动标记需复核；两个条件须同时满足，只超一个不触发"
    source: "B_scenarios/rules.md#复核触发"
  - rule_type: trigger
    name: 供应商冻结提醒
    upstream: [Supplier]
    logic:
      ALL:
        - { field: frozen_flag, operator: "==", value: true }
    downstream: mark_supplier_frozen
    description: "供应商冻结时触发冻结提醒，其所有对账单不再自动推进；提醒失败时的处置资料未规定，待确认"
    source: "B_scenarios/rules.md#冻结拦截"

competency_questions:
  - { id: cq-001, q: 哪些对账单的差异金额超阈值且差异率超阈值（需要复核）？, covered_by: [ReconciliationStatement.recon_diff_amount, ReconciliationStatement.recon_diff_rate] }
  - { id: cq-002, q: 哪些供应商处于冻结状态？, covered_by: [Supplier.frozen_flag] }
  - { id: cq-003, q: 某供应商本期发票金额、已对账金额、差异金额分别是多少？, covered_by: [ReconciliationStatement.invoice_amount, ReconciliationStatement.reconciled_amount, ReconciliationStatement.recon_diff_amount] }
  - { id: cq-004, q: 某供应商名下所有交货记录的金额合计是多少？, covered_by: [Supplier.total_delivery_amount] }

open_questions:                    # 七态状态机；两条均为等引擎侧验证的未裁决问题（pending-engine），验证通过前不注册引擎
  - id: OQ-01
    topic: 差异率除零兜底语义
    question: "差异率口径中「发票金额为 0」的除零行为：引擎方言未定义除零语义，COALESCE 兜底是否覆盖除零异常，待引擎侧验证"
    proposal: "在引擎沙箱用一张发票金额为 0 的对账单实测；兜底不生效时由建模侧另写兜底方案"
    missing_from: "B_scenarios/rules.md#对账差异率"
    status: pending-engine
  - id: OQ-02
    topic: 两跳嵌套聚合方言支持性
    question: "供应商交货总额使用了两跳反向嵌套聚合 SUM(别名1.别名2.字段)，超出已实测的一跳聚合先例（SUM(sales_orders.unfulfill_qty)），方言支持性待引擎侧验证"
    proposal: "在引擎沙箱实测；引擎不支持两跳聚合时回退为逐级衍生——先在中间实体算合计，再 SUM 到主实体"
    missing_from: "B_scenarios/rules.md#供应商交货总额"
    status: pending-engine

conflicts: []                       # 口径冲突记录：显式空集合（已逐术语交叉比对五份资料，结论为零；一处措辞出入见 fact-cards.md 第 6 节）
assumptions:                       # 生成假设清单（可抽查的推断记录，与 design-proposal.md 第 6.4 节同一清单）
  - id: AS-01
    content: "三个衍生字段的类型系推断（口径规则只给算法、未给类型）：对账差异金额、供应商交货总额按 DECIMAL（对齐发票金额与交货金额的类型），对账差异率按 DECIMAL（比率）"
  - id: AS-02
    content: "冻结标记按数据字典建模为 BOOLEAN：数据字典为 BOOLEAN，建表语句为 TINYINT(1)（1=冻结、0=正常），两者语义一致"
  - id: AS-03
    content: "三条引用关系的引用字段与目标主键同名（supplier_code / contract_nr），按数据字典的外键指向以显式 fk 形态声明"
  - id: AS-04
    content: "两条触发规则的下游动作 mark_recon_review、mark_supplier_frozen 取自口径规则原文（由平台内置处理）；资料未给参数与写入语义，故不在 actions 段声明"
  - id: AS-05
    content: "三个引用字段在建表语句中均为 NOT NULL，故不按可空引用登记"
